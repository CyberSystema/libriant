# Libriant — deploy fleet.
#
# The deploy workflow iterates this list. Each host is one cell today;
# adding capacity is "append a host" — no code change. Tenants are pinned
# to a cell via `tenants.cell_id` (control-plane DB), so existing tenants
# keep landing on their original cell until `scripts/tenant-relocate.ts`
# moves them.

hosts:
  - name: CyberSystema-1
    user: deploy
    # SSH target. We use the RAW IP, not the domain, because the apex is
    # proxied through Cloudflare (orange-cloud) — `libriant.com` resolves to
    # Cloudflare's edge, which doesn't carry SSH (port 22). The IP reaches the
    # box directly. (Lock host port 22 to your own IP in the firewall.)
    ssh: 178.104.32.176
    # Public host the deploy workflow health-checks (`https://<health_host>/healthz`).
    # This one goes THROUGH Cloudflare → origin, so it must be the proxied
    # domain with a valid cert (Cloudflare's edge cert + the origin cert).
    health_host: libriant.com
    # Compose project name on the remote host. The workflow exports this
    # as `COMPOSE_PROJECT_NAME` before running compose commands.
    project: libriant
    # Informational label only — the deploy workflow does NOT read `cell_id`.
    # The real cell lives in the control DB: the seeder (seed-data.ts) creates
    # id `cell-eu-1`, slug `eu-1`, and that is what tenants are pinned to.
    cell_id: cybersystema-1
    # Optional: tag this host with the region (informational; the
    # multi-region story lands at Stage 6).
    region: eu-central

  # Add more cells like this when the pilot graduates:
