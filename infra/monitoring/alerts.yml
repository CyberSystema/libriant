# Libriant — Prometheus alert rules.
#
# Thresholds map to the capacity signals from the deployment guide: host
# RAM / disk / CPU / swap, scrape-target liveness, and the app's own
# Postgres connection-saturation + cache-hit gauges. Wire an Alertmanager
# (email / Slack / ntfy) in prometheus.yml to actually deliver these; until
# then they're visible in the Prometheus + Grafana "Alerts" views.

groups:
  - name: availability
    rules:
      # `optional!="true"` excludes targets that are opt-in by design — today
      # only cAdvisor, which lives behind the `dashboards` compose profile that
      # no deploy path passes. Without the qualifier this rule fires critical,
      # permanently, from the first bring-up, and the one chance an alert
      # channel gets to be believed is spent on a container nobody started.
      # The label is set on the target in prometheus.yml, where the fact lives.
      - alert: TargetDown
        expr: up{optional!="true"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Scrape target down ({{ $labels.job }} / {{ $labels.instance }})'
          description: 'Prometheus cannot scrape {{ $labels.job }} for >2m.'

      - alert: LibriantApiDown
        expr: up{job="libriant-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Libriant API is not responding to scrapes'
          description: 'The api /metrics endpoint has been down for >1m.'

  - name: host
    rules:
      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.12
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Low available memory on {{ $labels.instance }}'
          description: 'Available RAM < 12% for 10m. Cache headroom is gone — tune Postgres or scale the box (vertical upgrade).'

      - alert: HostSwapping
        expr: node_memory_SwapTotal_bytes > 0 and (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Host is swapping heavily ({{ $labels.instance }})'
          description: 'Swap >50% used for 10m — memory pressure. Time to scale up.'

      - alert: HostDiskFilling
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs"}) < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Disk filling on {{ $labels.instance }} ({{ $labels.mountpoint }})'
          description: 'Free space < 15%. Offload backups to a Storage Box and/or move per-tenant files to Object Storage.'

      - alert: HostDiskCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs"}) < 0.07
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'Disk nearly full on {{ $labels.instance }} ({{ $labels.mountpoint }})'
          description: 'Free space < 7%. Act now — Postgres/uploads will fail when the disk fills.'

      - alert: HostHighCPU
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Sustained high CPU on {{ $labels.instance }}'
          description: 'CPU busy > 85% for 15m. Check for a bulk import/report, or scale CPU.'

      - alert: HostClockNotSynchronised
        # On this box the clock is an AUTHENTICATION INPUT, not a cosmetic.
        # Admin MFA is mandatory in production (ADMIN_MFA_REQUIRED defaults on
        # and cannot be turned off from .env.prod), TOTP verifies with a ~90
        # second acceptance window, and a recovery code can only be minted AFTER
        # a TOTP code has already verified — bootstrap-admin.ts refuses to issue
        # one to an admin with no authenticator enrolled. So a box whose clock
        # drifts becomes an admin panel nobody can enter, and the symptom is
        # "invalid code", which reads as a bad QR or a bad phone.
        #
        # scripts/install-server.sh's `clock` step proves this at install time.
        # This is the only thing that keeps watching afterwards. The metric comes
        # from node-exporter's timex collector, which is on by default; it is 1
        # when the kernel considers the clock disciplined and 0 when it does not.
        expr: node_timex_sync_status == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Host clock is NOT synchronised on {{ $labels.instance }}'
          description: 'The kernel reports the clock undisciplined for >15m. Admin TOTP has a ~90-second window and there is no recovery code until one TOTP code has passed, so drift here locks every admin out of the panel. Check: timedatectl timesync-status.'

  - name: libriant
    rules:
      - alert: LibriantPgConnectionsHigh
        expr: libriant_pg_connections / libriant_pg_connections_max > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Postgres connections > 80% of max'
          description: 'Approaching max_connections. Lower PgBouncer DEFAULT_POOL_SIZE or raise max_connections (see the deployment guide capacity section).'

      - alert: LibriantPgConnectionsCritical
        expr: libriant_pg_connections / libriant_pg_connections_max > 0.95
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Postgres connections > 95% of max'
          description: 'New connections will start failing. Tune pools now.'

      # reliability-18. The gauge existed and nothing watched it, which is how
      # Redis got to a 512 MB cgroup ceiling with no internal limit and no
      # signal between "fine" and the kernel OOM-killer. It now has a limit
      # (docker-compose.prod.yml, `--maxmemory 320mb --maxmemory-policy
      # noeviction`), and hitting THAT is not silent either — writes start
      # failing — but by then queued jobs are already being refused. These two
      # are the warning before that.
      #
      # Absolute bytes rather than a ratio because nothing exports Redis's own
      # maxmemory: 234881024 is 70% of 320 MiB, 301989888 is 90%. If
      # REDIS_MAXMEMORY moves in compose, both move here.
      - alert: LibriantRedisMemoryHigh
        expr: libriant_redis_used_memory_bytes > 234881024
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Redis using > 70% of its configured maxmemory'
          description: 'BullMQ queues or cached sessions are growing. At 100% Redis refuses writes (noeviction) and job enqueues start failing. Check queue backlogs; raise REDIS_MAXMEMORY *and* REDIS_MEM_LIMIT together if this is real growth.'

      - alert: LibriantRedisMemoryCritical
        expr: libriant_redis_used_memory_bytes > 301989888
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Redis using > 90% of its configured maxmemory'
          description: 'Writes will start being refused with OOM at the ceiling — every queued job, every session write. Act now.'

      - alert: LibriantPgCacheHitLow
        expr: libriant_pg_cache_hit_ratio < 0.95
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Postgres cache hit ratio < 95%'
          description: 'Working set is outgrowing RAM — queries are hitting disk. Add RAM (vertical) or shard tenants (horizontal).'

  # ───────────────────────────────────────────────────────────────────────────
  # "Up but broken".
  #
  # reliability-17: every rule above this point is a liveness or a capacity
  # rule. Not one of them could express an error rate, so the only availability
  # signal was `up{job="libriant-api"}` — which requires /metrics ITSELF to stop
  # answering. A regression that 500s one route, a tenant whose every request
  # errors, or a latency cliff after a bad migration were all invisible.
  # These fire on libriant_api_requests_total / _request_duration_seconds, which
  # HttpMetricsMiddleware (apps/api/src/platform/http-metrics.ts) now emits.
  # ───────────────────────────────────────────────────────────────────────────
  - name: libriant-app-errors
    rules:
      - alert: LibriantApi5xxRate
        # Ratio, not a raw count: a fixed count alerts on a busy morning and
        # stays quiet during a 3 a.m. outage with three requests in it. The
        # `> 0.5` arm on the denominator keeps a single stray 500 on an idle
        # night from reading as a 100% error rate.
        expr: |
          sum(rate(libriant_api_requests_total{status=~"5.."}[5m]))
            / sum(rate(libriant_api_requests_total[5m])) > 0.05
          and sum(rate(libriant_api_requests_total[5m])) > 0.5
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: '>5% of API requests are failing with a 5xx'
          description: 'The API is up (it is still being scraped) but returning server errors. Break it down by route with `sum by (route, status) (rate(libriant_api_requests_total{status=~"5.."}[5m]))`, then read the api container logs for the supportCode.'

      - alert: LibriantApiRouteErrors
        # The narrower case the fleet-wide ratio hides: ONE broken route, or one
        # tenant whose every request errors, while overall traffic looks fine.
        expr: |
          sum by (route) (rate(libriant_api_requests_total{status=~"5.."}[10m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Route {{ $labels.route }} is returning sustained 5xx'
          description: 'One endpoint is failing steadily even though the overall error ratio may look acceptable. This is what a regression on a single feature looks like.'

      - alert: LibriantApiLatencyHigh
        # p95 over the whole API. Route-level p95 is a dashboard question; a
        # page should mean "the product feels broken to everyone".
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(libriant_api_request_duration_seconds_bucket[10m]))
          ) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'API p95 latency above 2s'
          description: 'Nineteen requests in twenty are still under 2s, but the twentieth is not — usually a missing index after a migration, a tenant with an outsized catalogue, or Postgres swapping. Check LibriantPgCacheHitLow and HostSwapping alongside this.'

  # ───────────────────────────────────────────────────────────────────────────
  # Mail that was owed and never sent.
  #
  # reliability-10: after `maxAttempts` the worker marks a row `dead` and gives
  # up. Nothing read that status — no endpoint, no metric, no sweep, no alert —
  # so a misconfigured or blocked provider permanently abandoned password-reset
  # and e-mail-verification links with the user's "it never arrived" as the only
  # signal. Dormant while EMAIL_DRIVER=console; live the day a real driver is.
  # ───────────────────────────────────────────────────────────────────────────
  - name: libriant-email-outbox
    rules:
      - alert: LibriantEmailOutboxDeadLetters
        # `> 0`, not a rate. One abandoned password reset is one person locked
        # out of their library account, and the row is recoverable — but only if
        # somebody knows it is there.
        expr: libriant_email_outbox_rows{status="dead"} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} e-mail(s) permanently abandoned'
          description: >-
            The worker exhausted maxAttempts and gave up. Read the cause with
            `SELECT id, kind, "toEmail", attempts, "lastError", "abandonedAt" FROM email_outbox WHERE status = 'dead' ORDER BY "abandonedAt" DESC LIMIT 50;`
            After fixing the provider, re-drive them with
            `UPDATE email_outbox SET status = 'pending', attempts = 0, "lastError" = NULL, "abandonedAt" = NULL WHERE status = 'dead' AND "abandonedAt" > now() - interval '7 days';`
            — the worker's recovery scan re-enqueues owed rows every 5 minutes.
            EXCEPTION: rows whose lastError mentions an expired one-time link
            cannot be re-driven (the token is gone); ask the recipient to
            request a new reset instead.

      - alert: LibriantEmailOutboxStalled
        # A backlog that is not draining. Distinct from dead letters: these rows
        # have not been given up on, they are simply not moving — a wedged
        # consumer, a Redis partition, or a worker that never started.
        expr: libriant_email_outbox_oldest_pending_seconds > 1800
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Oldest owed e-mail is {{ $value | humanizeDuration }} old'
          description: 'Mail is queued and not being sent. Check the worker container is up and its /readyz is 200, then the api/worker logs for `[email-worker]`. Password resets and hold-ready notices are in this queue.'

      - alert: LibriantEmailOutboxCensusMissing
        # The census runs on a timer inside the worker and keeps its last
        # successful snapshot on failure, so the gauges vanishing entirely means
        # the worker is not exporting them at all — and the two rules above have
        # gone quiet without saying so.
        expr: absent(libriant_email_outbox_rows)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'The e-mail outbox census is not being exported'
          description: 'libriant_email_outbox_rows is absent from every scrape target. Either the worker is down, or its first census pass has never completed (control DB unreachable). Until this clears, LibriantEmailOutboxDeadLetters and LibriantEmailOutboxStalled cannot fire.'

  # ───────────────────────────────────────────────────────────────────────────
  # The worker: is anything actually consuming the queues, and are the sweeps
  # finishing?
  #
  # REL-04 made /readyz honest about a dead consumer, which tells the
  # ORCHESTRATOR. It tells nobody else: a container that flaps out of service at
  # 02:00 and back in at 02:01 leaves no trace an operator will find, and which
  # of the five consumers failed is not in the readiness response Prometheus
  # never sees. These are the same facts as a series.
  # ───────────────────────────────────────────────────────────────────────────
  - name: libriant-worker
    rules:
      - alert: LibriantWorkerDown
        # The API has had a named rule since the alerting landed and the worker
        # never did — it was covered only by the generic TargetDown, which fires
        # with a description about "a scrape target" and tells the reader
        # nothing about what has stopped. Everything asynchronous in this
        # product runs here.
        expr: up{job="libriant-worker"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'The Libriant worker is not answering'
          description: >-
            No e-mail is being sent, no scheduled sweep is running, and no
            import, export or maintenance job is being consumed. The queues
            themselves are durable — BullMQ and the e-mail outbox both survive
            this — so the backlog drains once the container is back. Check
            `dc ps worker` and its log.

      - alert: LibriantWorkerConsumerDown
        # Per-queue, so the page names the capability. A worker with a dead
        # `export` consumer still sends every e-mail and runs every sweep; one
        # with a dead `email-outbox` consumer is silently swallowing password
        # resets. Those are not the same incident.
        expr: libriant_worker_consumer_up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'The {{ $labels.queue }} queue consumer is not running'
          description: >-
            The worker is up and answering /metrics, but this BullMQ consumer is
            closed or has lost its Redis connection. Its jobs are accumulating
            and nothing is draining them. /readyz on the worker returns 503 with
            a `down` array naming it; check the worker log for
            `failed to start the {{ $labels.queue }} consumer`, then that
            consumer's own Redis connection.

      - alert: LibriantWorkerQueueWedged
        # A job that never finishes, as opposed to a consumer that is not
        # running. `maintenance` and `export` run at concurrency 1, so one
        # wedged job blocks the whole queue while `libriant_worker_consumer_up`
        # stays at 1 and readiness stays green.
        #
        # SIX HOURS, and the window is the whole design of this rule. It was
        # written at 30 minutes first, on the reasoning that "every job in every
        # queue finishes in seconds to low minutes". That is false:
        # EXPORT_MAX_RUNTIME_MS is 4 hours (apps/api/src/export/export.constants.ts),
        # a full-fleet VACUUM is unbounded, and IMPORT_MAX_ROWS is 250 000. A
        # platform-wide export would have paged, on a healthy system, about
        # thirty-five minutes in — and the first thing a newly-wired alert
        # channel delivers teaches its reader whether to trust it.
        #
        # Six hours sits above the longest LEGITIMATE occupancy in the process,
        # so `min_over_time(...[6h]) > 0` — this queue did not go idle once in
        # six hours — is a statement about a wedge and not about load. The
        # faster, queue-specific failures have their own rules:
        # LibriantEmailOutboxStalled watches the backlog age, and the import
        # stuck-batch sweep reclaims a batch whose BullMQ job is gone.
        #
        # The `and on() … uptime > 6h` clause is what makes the window real.
        # `min_over_time(m[6h])` does NOT require six hours of data — it takes
        # the minimum of whatever samples exist in the window, so for the first
        # six hours of every worker process the expression degrades to "busy
        # since boot", and with `for: 15m` it could page fifteen minutes into a
        # perfectly ordinary export. Gating on the process's own uptime is the
        # exact fix: the rule cannot evaluate true until the series has actually
        # spanned its window.
        expr: |
          min_over_time(libriant_worker_jobs_running[6h]) > 0
            and on() libriant_worker_uptime_seconds > 6 * 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'The {{ $labels.queue }} queue has not gone idle in six hours'
          description: >-
            Longer than any job in this process is budgeted for, so most likely
            one is wedged — a stuck export reading a slow tenant database, or a
            maintenance VACUUM that will not return. Check the worker log for
            the job that started and never logged a result. BullMQ will not
            stall-recover it while the process still holds it.

      - alert: LibriantScheduledJobFailing
        # reliability-07's other half, finally alertable: the runner has always
        # known whether each sweep worked, and until phase 5 the only place that
        # truth existed was the worker's /healthz JSON, which no rule can read.
        #
        # 30m, not one tick: the fastest sweeps run every 60s with retries
        # inside the tick, so anything shorter pages on a blip.
        expr: libriant_worker_job_last_ok == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'The {{ $labels.sweep }} sweep has been failing for 30 minutes'
          description: >-
            Its last run reported failed units of work — an unreachable tenant
            database is the usual cause. `libriant_worker_job_count{sweep="{{ $labels.sweep }}"}`
            carries the handler's own counters, and the worker's /healthz shows
            the message verbatim.

      - alert: LibriantScheduledJobNotRunning
        # Failing is one thing; stopping is another, and looks like health. A
        # scheduler key lost from Redis, or a job renamed in the registry
        # without its old schedule being reconciled away, leaves the series
        # frozen at its last run.
        #
        # 26h is the smallest threshold that cannot false-alarm: the slowest
        # band in jobs/registry.ts is 24h (retention-sweep,
        # storage-usage-recompute).
        #
        # WHAT THIS CANNOT CATCH, stated because a rule that reads as wider
        # coverage than it has is the thing this whole phase is about.
        # `lastResults` lives in process memory, so a worker restart deletes
        # every series and the expression has no data to be true about. For a
        # 24-hour sweep that means a blind window of up to a day after each
        # deploy. It catches a sweep that stopped WITHOUT a restart — a
        # scheduler reconciled away, a rename, a Redis key lost — and after a
        # restart the boot log's `[scheduled] started — N job(s)` line is the
        # surface that says the schedule was re-registered.
        expr: time() - libriant_worker_job_last_run_timestamp_seconds > 26 * 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'The {{ $labels.sweep }} sweep has not run for over a day'
          description: >-
            The job is registered and its series exists, so it ran once in this
            worker process — and then stopped. Check the worker log for
            `[scheduled] started` naming it, and BullMQ's job schedulers under
            the `lbr-bull` prefix.

  # ───────────────────────────────────────────────────────────────────────────
  # The alerts about the alerting, and about the backups.
  #
  # reliability-09: "a backup that never runs, or aborts every night, is
  # undetectable". Everything above alerts on something being WRONG. These two
  # alert on something failing to HAPPEN, which is the harder and more valuable
  # case — a backup that silently stopped three weeks ago looks exactly like a
  # backup that is working, right up until the restore.
  # ───────────────────────────────────────────────────────────────────────────
  - name: liveness-of-the-safety-nets
    rules:
      - alert: Watchdog
        # Fires ALWAYS, on purpose. Its absence is the signal: if this stops
        # arriving, the chain — node-exporter, Prometheus, Alertmanager, the
        # network out — is broken, and every other rule in this file has gone
        # quiet for the same reason. Routed to a heartbeat receiver that alerts
        # on SILENCE (see alertmanager.yml).
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: 'Alert pipeline is alive'
          description: 'This should always be firing. If it is not, alerting itself is broken — assume every other rule is also silent, and check Prometheus and Alertmanager before believing the system is healthy.'

      - alert: BackupNeverRan
        # `absent()` is the point: this fires when the metric does not exist at
        # all, which is what a backup that has never run since the exporter
        # started looks like. A rule written as `time() - metric > threshold`
        # would evaluate to nothing here and never fire.
        expr: absent(libriant_backup_last_success_timestamp_seconds)
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: 'No backup has EVER reported success'
          description: 'The metric is absent entirely. Either the nightly cron is not installed, backup.sh cannot write BACKUP_TEXTFILE_DIR, or node-exporter is not reading it (--collector.textfile.directory). Until this clears there is no evidence any backup exists.'

      - alert: BackupAborted
        # A backup that produced NOTHING tonight, said tonight.
        #
        # Everything else here alerts on staleness: BackupStale and
        # BackupOffsiteStale need 36 hours of no success before they fire, and
        # BackupNeverRan needs the metric to be absent entirely. So a run that
        # aborted at 02:15 was first mentioned a day and a half later, with a
        # second failed night already behind it. The exit code is written on
        # every exit path, including all eight aborts, precisely so a failed run
        # leaves evidence — and until now nothing read it.
        #
        # `and libriant_backup_degraded == 0` is what makes this safe to page
        # on, and it is not a refinement — without it this rule is critical
        # every night on the configuration this repository SHIPS.
        # backup.sh:618-631 sets `degraded=1` and exits non-zero when
        # RCLONE_REMOTE is unset and unacknowledged, `.env.prod.example` ships
        # it blank, and the runbook says "Unset makes the nightly exit non-zero
        # on purpose". A rule that pages critical every night on a default
        # install is how a channel gets muted before it has ever said anything
        # true.
        #
        # So the two states the script itself distinguishes get the two
        # treatments they deserve: `degraded == 1` is "finished, and a promise
        # is unmet" and belongs to BackupDegraded at warning; `degraded == 0`
        # with a non-zero exit is "aborted, there is nothing", and that is this.
        expr: libriant_backup_last_exit_code != 0 and libriant_backup_degraded == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'The last backup run ABORTED — no artefact was produced'
          description: >-
            scripts/backup.sh exited non-zero without reaching the end, so this
            night has no backup at all (a merely degraded run — off-site copy or
            encryption unmet — fires BackupDegraded instead). Read the cause in
            the backup log on the host. The dailies you still hold are as old as
            `libriant_backup_last_success_timestamp_seconds`.

      - alert: BackupStale
        # The nightly job runs at 02:15. 36h means one missed night alerts, and
        # a single late run does not.
        expr: time() - libriant_backup_last_success_timestamp_seconds > 36 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Last successful backup is over 36h old'
          description: 'At least one nightly backup has not completed. Check /var/log/libriant/backup.log. The offer terms promise daily backups with an off-server copy; this alert firing means that promise is currently untrue.'

      - alert: BackupOffsiteStale
        expr: time() - libriant_backup_offsite_last_success_timestamp_seconds > 36 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Last successful OFF-SITE copy is over 36h old'
          description: 'Local backups may still be running. An on-box-only backup does not survive the event it exists for — losing the host loses both. Check RCLONE_REMOTE and the Storage Box credentials.'

      - alert: BackupNotEncrypted
        # The DPA and the offer terms both say "encrypted backups". backup.sh
        # reports whether the artefacts it wrote actually are. A 0 here means
        # the sentence customers were shown is false right now.
        expr: libriant_backup_encrypted == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Backups are being written UNENCRYPTED'
          description: "BACKUP_AGE_RECIPIENT / BACKUP_GPG_PASSPHRASE_FILE is unset or the tool is missing, so last night's archive is plaintext. The DPA states backups are encrypted; that is currently untrue."

      - alert: BackupDegraded
        # The run finished, but not as intended — a leg was skipped, a verify
        # was unavailable, or something was retried. Not urgent enough to wake
        # someone, loud enough that it cannot run for a month unnoticed.
        expr: libriant_backup_degraded == 1
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: 'Backup completed in a degraded mode'
          description: 'The nightly run reported success with caveats. Read /var/log/libriant/backup.log — a degraded backup that nobody reads becomes an unrestorable one.'

      - alert: BackupOffsiteNotConfigured
        # Distinct from BackupOffsiteStale, which needs the metric to exist. If
        # off-site was never set up, this says so instead of staying silent.
        expr: libriant_backup_offsite_configured == 0
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: 'No off-site backup destination is configured'
          description: 'RCLONE_REMOTE is empty, so every backup lives only on the host it protects. The offer terms promise an off-server copy.'
