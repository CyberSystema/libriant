# Where an alert actually goes.
#
# reliability-04 / launch-readiness-06: Prometheus was evaluating a full set of
# rules and delivering none of them, because this file did not exist and
# `alerting:` in prometheus.yml was commented out. A rule that fires into
# nothing is worse than no rule — it reads like coverage on the page and pages
# nobody at 3am.
#
# ─────────────────────────────────────────────────────────────────────────────
# `default` NOW DELIVERS, TO ntfy. `watchdog` STILL DOES NOT, AND CANNOT.
#
# Both receivers used to read `[PLACEHOLDER: …]`, which Alertmanager cannot
# parse, so the service refused to boot and both deploy scripts kept it behind
# the `alerting` profile. Every rule in alerts.yml was evaluated and delivered
# nowhere. That is now half fixed, and the two halves are very different:
#
#   default   → ntfy (hosted, ntfy.sh). The URL is NOT in this file; see
#               `url_file` below. Filled in.
#   watchdog  → nothing. ntfy is push-only and this receiver's whole job is to
#               notice SILENCE. Deliberately still open — see its own note.
#
# ── WHY THE URL IS NOT IN THIS FILE ─────────────────────────────────────────
#
# On ntfy.sh a topic is readable AND writable by anyone who knows the string.
# There is no second factor: the topic name IS the credential. This file is in
# git, so the topic can never be written here — a `git log -p` of a repo that
# later goes public, or a laptop backup, hands a stranger both the alert feed
# and the ability to forge alerts into it.
#
# So the receiver reads `url_file`, and the file lives in the alertmanager_data
# volume, written on EVERY deploy by scripts/deploy-on-host.sh from NTFY_TOPIC
# in /srv/libriant/.env.prod (which is 600, untracked, and in no backup). It is
# the same posture as every other secret on this box.
#
# ── WHAT ACTUALLY ARRIVES ON THE PHONE, HONESTLY ────────────────────────────
#
# Alertmanager's webhook receiver POSTs ITS OWN JSON envelope
# ({"receiver":…,"status":…,"alerts":[…]}) and has NO body template — `url`,
# `url_file`, `max_alerts`, `send_resolved` and `http_config` are the whole
# surface. ntfy uses the request body verbatim as the message text. So the
# notification body is raw JSON. Measured, not assumed: in a representative
# firing envelope the alert NAME starts 92 bytes in, which is past the one-line
# preview and inside the expanded notification.
#
# That is accepted rather than fixed, and the tradeoff is stated out loud:
#   • fixing it needs a reshaping proxy between Alertmanager and ntfy.sh — one
#     more service on the same box, in the alerting path, that can itself fail;
#   • `max_alerts: 1` below keeps the envelope small enough to stay well inside
#     ntfy's message ceiling and puts the one alert that matters first;
#   • deploy-on-host.sh appends ntfy's documented `?title=`/`?priority=`/
#     `?tags=` query aliases to the URL, so the notification has a readable
#     TITLE even though its body is JSON. If a server ignores those aliases the
#     message is still delivered, just untitled — nothing depends on them.
# It is a doorbell, not a letter: it says something fired and where to look.
#
# ── WHAT ELSE COULD GO HERE ─────────────────────────────────────────────────
#   • an email receiver via the transactional mail provider (nothing is
#     configured — EMAIL_DRIVER is 'console' and there is no API key);
#   • a paid on-call service if this ever carries more than the pilot.
# ─────────────────────────────────────────────────────────────────────────────

global:
  # How long a firing alert stays "firing" without a fresh evaluation before
  # Alertmanager assumes it resolved. Must exceed Prometheus's evaluation
  # interval by a comfortable margin or alerts flap.
  resolve_timeout: 5m

route:
  # Group by alertname AND instance: one host filling its disk is one page, not
  # one per filesystem, but two different hosts are two different problems.
  group_by: ['alertname', 'instance']
  # Wait this long to collect other alerts of the same group before sending —
  # an outage usually trips several rules within seconds and they belong in one
  # message.
  group_wait: 30s
  group_interval: 5m
  # Do not re-send an unchanged firing alert more often than this. Long enough
  # not to become noise, short enough that a page lost to a flaky network is
  # retried the same night.
  repeat_interval: 4h
  receiver: default

  routes:
    # The dead man's switch. This alert fires CONTINUOUSLY and on purpose; its
    # silence is the signal. Route it somewhere that expects a heartbeat and
    # complains when one stops arriving — a cron-monitoring service, or a script
    # that pages when it has not been poked in an hour.
    #
    # Without this, the whole chain — exporter, Prometheus, this file, the
    # network out — fails silently, and everything looks calm precisely because
    # nothing can report. That is indistinguishable from "nothing is wrong",
    # which is how an outage runs all weekend.
    - matchers: ['alertname = Watchdog']
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Anything that means data is at risk jumps the queue and repeats sooner.
    - matchers: ['severity = critical']
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # /alertmanager is the alertmanager_data volume — the only writable path
      # this container has, since alertmanager.yml itself is a read-only bind
      # mount of this git-tracked file. scripts/deploy-on-host.sh writes the
      # topic URL there on every deploy, from NTFY_TOPIC in .env.prod, and
      # REFUSES to switch the `alerting` profile on when it cannot: an
      # Alertmanager that is up and posting to a file that is not there fails
      # every notification into its own container log, which is the silent
      # non-delivery this whole file exists to end.
      #
      # `url_file` is Alertmanager's own field (it is mutually exclusive with
      # `url`). If an older Alertmanager ever ships here without it, the
      # `amtool check-config` both deploy paths run first fails loudly and the
      # stack is not touched — it cannot degrade into delivering nowhere.
      - url_file: /alertmanager/ntfy-url
        send_resolved: true
        # One alert per push, and this is a size limit rather than a taste one.
        # Measured on a real HostDiskCritical envelope: 1 alert is 1108 bytes,
        # 5 are 3088, and 10 are 5563 — past ntfy.sh's documented 4096-byte
        # message limit, at which point the notification is not truncated, it is
        # REFUSED. The group key is alertname+instance so a group is nearly
        # always one alert anyway; this is what stops the worst night — the one
        # where everything trips at once — from being the night nothing arrives.
        # `truncatedAlerts` in the envelope says when something was held back.
        max_alerts: 1

  # ── STILL OPEN, ON PURPOSE. DO NOT POINT THIS AT ntfy. ─────────────────────
  #
  # [PLACEHOLDER: dead-man's-switch ping URL — e.g. the healthchecks.io check
  # the owner is setting up. It must ALERT ON SILENCE, not on receipt.]
  #
  # This receiver has no delivery config at all, which is valid Alertmanager
  # (the classic "null" receiver) and lets the service boot so that `default`
  # above can do its job. The Watchdog alert therefore fires every minute and
  # is dropped. That is a KNOWN, NAMED hole, not a fixed one, and both deploy
  # scripts and `pnpm check:alerts` say so on every run.
  #
  # ntfy cannot serve this receiver, and the reason is structural rather than a
  # missing feature: ntfy is push-only. A dead man's switch is the assertion
  # "somebody complains when a message STOPS arriving", and nothing that only
  # receives pushes can make it. Wiring the Watchdog here would also push once a
  # minute (see its route's repeat_interval), which is precisely how a phone
  # channel gets muted — and a muted channel loses every real alert too.
  #
  # It must not share `default`'s destination either: a heartbeat delivered to
  # the same place as real alerts makes a broken pipeline look like a quiet
  # night. `pnpm check:alerts` asserts that they differ.
  #
  # CLOSED, the same way `default` is. The URL is NOT here: a healthchecks.io
  # ping URL is a bearer credential — anyone holding it can ping the check and
  # keep it GREEN, which silences the exact alarm this receiver exists to raise.
  # It is materialised into the alertmanager_data volume on every deploy from
  # WATCHDOG_PING_URL in /srv/libriant/.env.prod, the same posture as the ntfy
  # topic above.
  #
  # `send_resolved: false` on purpose. The Watchdog never resolves — its expr is
  # `vector(1)`, permanently true — so a resolved notification is a message that
  # can never legitimately be sent, and this channel must express trouble by
  # SILENCE rather than by a message.
  #
  # If WATCHDOG_PING_URL is unset the deploy writes no file, Alertmanager cannot
  # open `url_file`, and each heartbeat fails into its own container log — the
  # same honest failure as an unset ntfy topic, and the deploy's closing banner
  # says so rather than implying the switch is armed.
  - name: watchdog
    webhook_configs:
      - url_file: /alertmanager/watchdog-url
        send_resolved: false

inhibit_rules:
  # If the whole API is down, do not also page about its connection pool, its
  # queue depth and its latency. One cause, one page.
  - source_matchers: ['alertname = LibriantApiDown']
    target_matchers: ['severity =~ "warning|critical"']
    equal: ['instance']

  # A host that is critically out of disk will trip the warning rule too.
  - source_matchers: ['alertname = HostDiskCritical']
    target_matchers: ['alertname = HostDiskFilling']
    equal: ['instance', 'mountpoint']
