# Libriant — Prometheus scrape config.
#
# Scrapes: itself, the host (node-exporter), all containers (cAdvisor), and the
# app's own metrics endpoints — api, worker and web. Every metric declared in
# apps/api/src/observability/metrics.registry.ts names the source that writes
# it, and `pnpm check:alerts` fails the build when a source has no job here.
# Service names resolve over the docker networks this Prometheus is attached
# to (`monitoring` for exporters, `app` for the Libriant services).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    fleet: libriant

rule_files:
  - /etc/prometheus/alerts.yml

# Wire an Alertmanager here when you want delivery (email/Slack/ntfy).
# Where a firing rule is DELIVERED. This was commented out, so every rule in
# alerts.yml evaluated correctly and reached nobody (reliability-04).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host: CPU, memory, disk, network, load.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Per-container resource usage.
  #
  # cAdvisor sits behind `profiles: ['dashboards']` in the monitoring compose
  # file, and no deploy path passes that profile — COMPOSE_PROFILES is only ever
  # "" or "alerting" (scripts/deploy-on-host.sh:198,200 and deploy.yml:555,558).
  # So on every ordinary bring-up this target is down, and an unqualified
  # `up == 0` would page `severity: critical` forever about a container nobody
  # intended to run. The first message a newly-wired alert channel delivers
  # teaches its reader whether to trust it; spending that on a false page is how
  # BackupNeverRan and the Watchdog end up muted.
  #
  # The `optional` label is what TargetDown excludes. It marks "this target is
  # opt-in; its absence is the normal state", which is a property of the target,
  # not of the rule — so it belongs here rather than as a job name hard-coded
  # into alerts.yml.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          optional: 'true'

  # Libriant API — uptime + tenant census + PG connections/cache + Redis mem.
  # Scraped directly over the private `app` network (NOT via Caddy, which
  # short-circuits the public /metrics path).
  - job_name: libriant-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3001']

  # Libriant web — uptime + build info.
  #
  # Added in 2.0 phase 5. The web tier had been emitting these two gauges since
  # the app was first deployed and NOTHING collected them: there was no job
  # here, so `libriant_web_uptime_seconds` existed in the source, in a unit of
  # exposition served on a live port, and in no time series anywhere. The only
  # liveness signal for the container serving every staff page was Caddy failing
  # to proxy to it.
  #
  # `/api/metrics`, not `/metrics` — it is a Next route handler. WEB-03: that
  # path is publicly reachable, which is why the route deliberately carries no
  # `node_env` label; Prometheus reaches it over the private `app` network
  # regardless.
  - job_name: libriant-web
    metrics_path: /api/metrics
    static_configs:
      - targets: ['web:3000']

  # Libriant worker — BullMQ jobs in-flight + uptime.
  - job_name: libriant-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3002']

  # Optional exporters (enable the matching services in the compose overlay):
  # - job_name: postgres
  #   static_configs: [{ targets: ['postgres-exporter:9187'] }]
  # - job_name: redis
  #   static_configs: [{ targets: ['redis-exporter:9121'] }]
