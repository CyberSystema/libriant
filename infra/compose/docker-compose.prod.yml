# Libriant — production / staging stack (single host).
#
# Topology (from the plan):
#
#     Internet → caddy (80/443) → web (3000) + api (3001)
#                                          ↓
#                            postgres + pgbouncer + redis  (internal only)
#                                          ↓
#                                   worker (3002)
#
# All app traffic terminates at Caddy; the app + data services are on a
# private docker network and never bind to host ports. The single bind
# mount is the storage box at /srv/libriant/storage; volumes hold the
# Postgres + Redis data + Caddy ACME state.
#
# Bring up:   docker compose -f infra/compose/docker-compose.prod.yml up -d
# Tear down:  docker compose -f infra/compose/docker-compose.prod.yml down
#
# Required env (load via `--env-file` or shell):
#   PUBLIC_HOST                 — the APP host (app.libriant.com). Not the apex:
#                                 the marketing site owns libriant.com.
#   ADMIN_HOST                  — admin host (admin.libriant.com)
#   ACME_EMAIL                  — contact for Let's Encrypt
#   IMAGE_TAG                   — image tag to pull (default: latest)
#   POSTGRES_PASSWORD           — superuser password
#   SESSION_SECRET / ADMIN_SESSION_SECRET / IMPERSONATION_SECRET — JWT secrets
#   MFA_MASTER_KEY              — 64-hex (32-byte) AES key
#
# Optional (default to "not configured" — see x-app-env):
#   STRIPE_DRIVER=real + STRIPE_API_KEY / STRIPE_WEBHOOK_SECRET — real billing
#   EMAIL_DRIVER=smtp + SMTP_URL                                — real email
#
# See `.env.prod.example` in the repo root for the full list.

x-app-env: &app-env
  NODE_ENV: production
  CONTROL_DATABASE_URL: postgresql://libriant:${POSTGRES_PASSWORD}@pgbouncer:5432/libriant_control
  REDIS_URL: redis://redis:6379
  # boot-and-config-09. PUBLIC_HOST is REQUIRED, and has no default anywhere in
  # this file. It used to have two, and they disagreed: this block and the web
  # block defaulted it to `libriant.com`, while the caddy block below and
  # infra/caddy/Caddyfile defaulted it to `app.libriant.com`. Since the
  # marketing site moved onto its own vhost those are DIFFERENT hosts, and the
  # apex one deliberately carries no `handle_path /lbr-api/*` (see the note
  # above `{$SITE_HOST}` in the Caddyfile). So bringing the stack up by hand —
  # the invocation this file's own header documents — from an env file complete
  # enough to satisfy the five `:?` secrets but missing PUBLIC_HOST gave Caddy
  # the app on app.libriant.com while the browser bundle asked libriant.com for
  # its data. The panel painted its shell and then 404'd every fetch, the
  # password-reset links already in the outbox pointed at the marketing site,
  # and every container healthcheck stayed green throughout.
  #
  # ONE SOURCE: this variable. Everything else derives from it — the API's
  # PUBLIC_APP_URL and BILLING_RETURN_URL here, the browser bundle's
  # NEXT_PUBLIC_API_URL in the web block, and the app vhost's site address via
  # the caddy block's PUBLIC_HOST. Nothing may reintroduce a default: there is
  # no value that is right for both the app host and the apex.
  PUBLIC_APP_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required (the app host, e.g. app.libriant.com)}
  PUBLIC_APEX_DOMAIN: ${PUBLIC_APEX_DOMAIN:-libriant.com}
  SITE_HOST: ${SITE_HOST:-libriant.com}
  HASH_PEPPER: ${HASH_PEPPER:?HASH_PEPPER is required in production}
  APPLY_NOTIFY_TO: ${APPLY_NOTIFY_TO:-info@libriant.com}
  # Excluded from tenant subdomain resolution so admin.<apex> isn't treated
  # as a library slug (otherwise admin login 404s "Unknown library admin").
  ADMIN_HOST: ${ADMIN_HOST:-admin.libriant.com}
  TENANT_PATH_PREFIX: /t/
  SESSION_COOKIE_SECURE: 'true'
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in production}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
  IMPERSONATION_SECRET: ${IMPERSONATION_SECRET:?IMPERSONATION_SECRET is required}
  MFA_MASTER_KEY: ${MFA_MASTER_KEY:?MFA_MASTER_KEY is required}
  STORAGE_ROOT: /srv/libriant/storage
  STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-}
  ASSETS_ROOT: /srv/libriant/assets
  LOCALES_ROOT: /srv/libriant/locales
  # Billing defaults to "switched off" so a clean deploy boots without a Stripe
  # account. Flip it in .env.prod (STRIPE_DRIVER=real + keys, EMAIL_DRIVER=smtp
  # + SMTP_URL) when you go live.
  # NOTE: every driver var the app reads MUST be listed here — Compose only
  # injects variables referenced in this block, not everything in .env.prod.
  # Plan/quota enforcement. Default OFF for a free pre-monetization launch:
  # every tenant gets unlimited access to all features. Set 'true' (and
  # STRIPE_DRIVER=real) when you start charging. (Admin panel is unaffected.)
  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  # billing-02: `none` means NO Stripe driver is loaded — every billing action
  # refuses with a 503 and POST /webhooks/stripe answers 503 without verifying
  # anything. This default used to be `fake`, an in-memory stand-in that
  # verified webhook signatures against a secret published in the Libriant
  # repository; because that endpoint is unauthenticated by design, any host on
  # the internet could rewrite any library's subscription. `fake` is now
  # development/test only and the API downgrades it to `none` here.
  STRIPE_DRIVER: ${STRIPE_DRIVER:-none}
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  BILLING_RETURN_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required (the app host, e.g. app.libriant.com)}
  # REL-06: do NOT default to `console` in prod. A `console` driver writes
  # password-reset token URLs (account-takeover material) and member PII into
  # retained Docker logs, and the old `:-console` default silently DISABLED the
  # fail-fast env.ts builds in for production (it defaults an unset EMAIL_DRIVER
  # to `smtp`, which then refuses to boot without SMTP_URL). Pass through unset
  # (empty) instead of defaulting: an operator who sets EMAIL_DRIVER=smtp +
  # SMTP_URL gets real mail; an operator who forgets gets the loud env.ts
  # boot-time failure rather than silent, PII-logging email.
  EMAIL_DRIVER: ${EMAIL_DRIVER:-}
  SMTP_URL: ${SMTP_URL:-}
  # A5-01: the Resend HTTP driver's key MUST be listed here or it never reaches
  # the container — `EMAIL_DRIVER=resend` would then crash-loop the api + worker
  # at boot (env.ts requires it). Compose only injects vars referenced in this
  # block, so an unlisted .env.prod key is silently dropped.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  BCRYPT_COST: '12'
  PG_SUPERUSER_URL: postgresql://libriant:${POSTGRES_PASSWORD}@postgres:5432/libriant_control
  # In-panel desktop-app download proxy. Repo where `desktop-v*` installers are
  # published (matches apps/desktop/electron-builder.yml). The TOKEN is required
  # because that repo is PRIVATE — without it the in-panel download 404s. Use a
  # fine-grained PAT with `contents:read` on the repo (or a classic `repo` token).
  DESKTOP_RELEASE_REPO: ${DESKTOP_RELEASE_REPO:-CyberSystema/libriant}
  DESKTOP_RELEASE_TOKEN: ${DESKTOP_RELEASE_TOKEN:-}
  # boot-and-config-02. `max_connections` used to be written TWICE in this repo
  # — as a literal in the postgres `command:` below, and as a hard-coded default
  # of 200 inside apps/api/src/platform/tenant-pool-budget.ts — with nothing
  # keeping them equal. The planner sizes every tenant pool from its copy, so an
  # operator who raised the server's ceiling for a bigger box got no extra
  # capacity, and one who LOWERED it got a budget that overspends the server.
  # Now one variable feeds both: the value below is what Postgres is started
  # with AND what the API/worker plan against.
  PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-200}

# A12-01: per-container resource limits. On the single-host topology one runaway
# or leaking process (a fork bomb, an OOM during a bad import) could otherwise
# starve Postgres and take the WHOLE cell down. These `mem_limit` / `cpus` /
# `pids_limit` caps (honoured by `docker compose up`, no Swarm needed) contain
# the blast radius. Defaults suit a ~4 GB host; raise via .env.prod on bigger
# boxes (the sum should stay comfortably under host RAM to leave page cache).
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'

# supply-chain-07. Applied to EVERY service below, including the ones that still
# start as uid 0. `no-new-privileges` sets PR_SET_NO_NEW_PRIVS on the container's
# init process, which every descendant inherits and none can clear: a setuid or
# file-capability binary reached from a compromised process — the ordinary first
# step out of an RCE and into the container's privileged surface — execs with the
# caller's privileges instead of the file's.
#
# It does NOT break privilege DROPPING, which is what the data-tier entrypoints
# actually do: the postgres image execs `gosu postgres`, redis execs `su-exec
# redis`, and both are a root process calling setuid() downwards. no_new_privs
# only blocks GAINING privileges, so those paths are unaffected. That distinction
# is the whole reason this is safe to apply to every service rather than to the
# app tier only.
x-hardening: &hardening
  security_opt: ['no-new-privileges:true']

services:
  # ----- edge -----------------------------------------------------------
  caddy:
    # Was `caddy:2-alpine`. Now stock Caddy with the rendered marketing site
    # baked in at /srv/libriant/site — apps/site/dist is gitignored, so there is
    # nothing on the host to bind-mount, and the host has no Node to render it.
    image: ghcr.io/${IMAGE_OWNER:-libriant}/libriant-caddy:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/caddy/Dockerfile
    <<: [*restart, *logging, *hardening]
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-1}
    pids_limit: 256
    # supply-chain-07. THIS CONTAINER RUNS AS uid 0 — the upstream caddy image
    # sets no USER and infra/caddy/Dockerfile does not add one. Saying so out
    # loud matters because the comment on `migrate` below used to claim the
    # opposite about the whole stack, which is the kind of sentence that ends a
    # security review early.
    #
    # What uid 0 buys an attacker here is now almost nothing, because the
    # capability set is empty except for the one capability the process cannot
    # work without. NET_BIND_SERVICE is what lets it listen on 80/443; dropping
    # ALL takes away CAP_DAC_OVERRIDE, CAP_SETUID/SETGID/SETPCAP/SETFCAP,
    # CAP_CHOWN, CAP_FOWNER, CAP_SYS_CHROOT, CAP_MKNOD, CAP_NET_RAW and the rest
    # of the default set — every one of the post-RCE escalation and
    # container-escape primitives that made "root" the word worth worrying
    # about. Paired with no-new-privileges above, a compromised Caddy is a
    # process that can read the files it already reads and open two ports.
    #
    # WHY NOT uid 1000, WHICH IS THE OBVIOUS NEXT STEP. Two routes, both
    # rejected here, and the reasons are specific so nobody repeats the dead end:
    #
    #  1. Non-root on 80/443 needs CAP_NET_BIND_SERVICE to reach a NON-ROOT
    #     process, which Docker's `cap_add` alone does not do — the daemon does
    #     not set the AMBIENT set, and the capability is dropped across the
    #     setuid into the container user unless the caddy binary carries a file
    #     capability. Whether the upstream alpine image runs `setcap` on
    #     /usr/bin/caddy decides it, and that cannot be checked from here:
    #     Docker is not installed on the machine this was written on, so the
    #     image could not be pulled or inspected. Shipping it unverified risks
    #     an edge that cannot bind — the whole product dark — to close a
    #     hardening gap the audit itself downgraded to low.
    #  2. Listening on 8080/8443 instead and publishing 80→8080 removes the
    #     capability question entirely, and it is what the audit suggested. It
    #     also silently disarms the origin lockdown: scripts/prod-bootstrap.sh
    #     matches `--dports 80,443` in DOCKER-USER, and DOCKER-USER sees the
    #     packet AFTER DNAT, so the rule would stop matching the container port
    #     and every IPv4 source on the internet would reach this edge again.
    #     Two files that must change together, one of them a firewall — a worse
    #     trade than uid 0 behind an empty capability set.
    #
    # To finish it: confirm `getcap /usr/bin/caddy` on the real image, then add
    # `user: '1000:1000'` here, keep the two capability lines exactly as they
    # are, and chown $LIBRIANT_DATA_ROOT/caddy (the /data bind AND the origin
    # key) to that uid — the deploy scripts' origin-key gate already asserts
    # that ownership, so it is the one line that would have to change with it.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      # Loosened from service_healthy deliberately: now that the marketing site
      # lives inside Caddy, an app outage must not take the marketing site down
      # with it — separating them is the entire point. Caddy answers 502 for an
      # upstream that is not up, and the deploy's health gate asserts api/web
      # container health independently.
      web:
        condition: service_started
      api:
        condition: service_started
    # PUBLISHED WITH AN EXPLICIT BIND ADDRESS — never the bare `80:80` form.
    #
    # authn-authz-01 / input-and-files-02. `80:80` binds BOTH `0.0.0.0` and
    # `[::]`. The host has a public IPv6 address (2a01:4f8:13b:ac8::2) but no
    # compose network below sets `enable_ipv6`, so the caddy container holds no
    # v6 address and a v6 connection CANNOT be DNATed to it. Docker carries it
    # instead through the USERLAND PROXY (`docker-proxy`, a host process), which
    # accepts the v6 connection and opens a brand-new IPv4 connection to the
    # container FROM THE BRIDGE GATEWAY. Two things follow, and a verifier used
    # both:
    #   1. Caddy's `remote_ip` sees a private address for every v6 client, so the
    #      edge guard's private-peer arm admitted them — 25 logins with rotating
    #      CF-Connecting-IP headers landed in 25 separate rate-limit buckets.
    #   2. The connection never traverses FORWARD, so DOCKER-USER never sees it
    #      and a firewall rule that lives only there is invisible to it.
    #
    # Binding v4 explicitly removes the `[::]` listener entirely: a v6 SYN to
    # 80/443 is refused by the kernel, there is no userland-proxy path left, and
    # every connection that reaches Caddy arrives by DNAT with its true source
    # address intact. What this layer guarantees ON ITS OWN: Caddy's view of the
    # peer is the truth for all internet traffic, whatever the firewall and the
    # Caddyfile are doing. What it does NOT do: it admits every IPv4 source —
    # scripts/prod-bootstrap.sh --firewall-only is the layer that narrows that.
    #
    # CONSEQUENCE FOR DNS, and it is not optional: while this is v4-only the
    # origin must have NO AAAA records, or Cloudflare will try the v6 origin and
    # get a 522. Visitors still reach Cloudflare over IPv6; only the
    # Cloudflare→origin hop is v4. See docs/RUNBOOK.md §5.4.
    #
    # TO GO DUAL-STACK PROPERLY (the alternative to this line, not an addition):
    # set `enable_ipv6: true` on the `edge` network below AND `"ip6tables": true`
    # in the daemon's /etc/docker/daemon.json, so v6 is DNATed like v4 and Caddy
    # sees the real v6 peer; then set EDGE_BIND_IPV4 back to a dual-stack publish
    # by hand, re-run `--firewall-only --allow-ipv6`, and only then add the AAAA
    # records. Doing any one of those four without the others reopens this.
    ports:
      - '${EDGE_BIND_IPV4:-0.0.0.0}:80:80'
      - '${EDGE_BIND_IPV4:-0.0.0.0}:443:443'
      - '${EDGE_BIND_IPV4:-0.0.0.0}:443:443/udp' # HTTP/3
    environment:
      SITE_HOST: ${SITE_HOST:-libriant.com}
      # boot-and-config-09: same variable, no default — see x-app-env above.
      # The Caddyfile still spells `{$PUBLIC_HOST:app.libriant.com}` so it can be
      # read and adapted standalone, but that literal is now unreachable through
      # this file: compose refuses to start without a value to pass in.
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required (the app host, e.g. app.libriant.com)}
      ADMIN_HOST: ${ADMIN_HOST:-admin.libriant.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@libriant.com}
      MAINTENANCE_HARD: ${MAINTENANCE_HARD:-false}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/maintenance.html:/srv/libriant/caddy/maintenance.html:ro
      - ../../assets:/srv/libriant/assets:ro
      # Cloudflare Origin Certificate (origin.crt + origin.key) — Caddy serves
      # it because we sit behind Cloudflare's proxy (Full strict). Place the
      # two files on the data volume at $LIBRIANT_DATA_ROOT/caddy/origin/.
      - ${LIBRIANT_DATA_ROOT:-/mnt/libriant}/caddy/origin:/etc/caddy/origin:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [edge, app]
    # reliability-14, see `api`. Caddy stops accepting and then waits for
    # in-flight requests with no deadline of its own, so this IS the deadline.
    # 30s so the file downloads it is proxying — an export a library is in the
    # middle of saving — finish rather than truncating at 10s.
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/healthz']
      interval: 30s
      timeout: 5s
      retries: 5

  # ----- app processes --------------------------------------------------
  # One-shot bootstrap: control-plane migrations + seed + (optional) first
  # admin, run to completion BEFORE api/worker start. Idempotent, so it runs
  # safely on every deploy — that is what makes deploys self-bootstrapping.
  # scripts/ + locales/ are mounted from the repo checkout (not baked into the
  # image), so this needs no separate image. Migrations go straight to Postgres
  # (PG_SUPERUSER_URL) — pgbouncer's transaction pooling breaks Prisma's
  # session advisory lock.
  migrate:
    image: ghcr.io/${IMAGE_OWNER:-libriant}/libriant-api:${IMAGE_TAG:-latest}
    <<: [*logging, *hardening]
    restart: 'no'
    # INFRA-4: runs as the image's non-root `node` user (the Dockerfile default)
    # — the previous `user: root` override was only there to avoid a corepack
    # cache re-download, which is now fixed by warming a shared COREPACK_HOME at
    # build time.
    #
    # supply-chain-07: this used to end "…which eliminates the only root
    # container in the prod stack", and that was false the day it was written.
    # `caddy` runs as uid 0 — see the long note on that service, which now says
    # so in the first line. A sentence like that one is worse than silence: a
    # reviewer greps for `user:`, finds nothing, reads this, and stops looking.
    command: ['sh', '/app/scripts/prod-bootstrap.sh']
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../locales:/app/locales:ro
    # INFRA-3: only the internal data tier — this one-shot does DB DDL and
    # serves no traffic, so it never needs the app/egress network.
    networks: [data]
    # reliability-14. Of everything in this file, this is the container you
    # least want SIGKILLed at 10s: `docker compose down` while a deploy's
    # migrations are running would sever `prisma migrate deploy` mid-run. The
    # DDL itself is transactional and rolls back, but the run is abandoned
    # holding its migration advisory lock until the backend notices the socket
    # is gone, and the next deploy then sits waiting for a lock nobody holds.
    stop_grace_period: 60s

  api:
    image: ghcr.io/${IMAGE_OWNER:-libriant}/libriant-api:${IMAGE_TAG:-latest}
    <<: [*restart, *logging, *hardening]
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-1.5}
    pids_limit: 1024
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      PORT: '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # `service_started` and not `service_healthy` — boot-and-config-15: the
      # pooler carries no healthcheck of its own (the probe lives in the
      # `pgbouncer-probe` sidecar), and this container is deliberately not gated
      # on that sidecar either. This container's own /readyz crosses the same
      # hop, so gating the API's boot on a diagnostic would only convert a
      # broken probe into an outage.
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - storage:/srv/libriant/storage
      - ../../assets:/srv/libriant/assets:ro
      - ../../locales:/srv/libriant/locales:ro
    # `app` for Caddy↔web↔api + egress (Stripe/SMTP); `data` (internal) for
    # postgres/pgbouncer/redis. (INFRA-3)
    networks: [app, data]
    # reliability-14. Docker's default is 10s from SIGTERM to SIGKILL, and
    # `worker` was the only service that said otherwise. Deploys recreate these
    # containers in place, so the 10s applied to every deploy: a request still
    # writing at the deadline — a tenant provision, an import commit, the tail
    # of a large export kickoff — was severed mid-flight rather than finished.
    # 30s is chosen against the API's own longest handler rather than as a round
    # number, and it is an upper bound, not a wait: Docker sends SIGKILL as soon
    # as the process exits. The remaining half of this — main.ts racing
    # `app.close()` against its own deadline the way worker.ts:208 does, so the
    # process never simply sits there — is in the API package, not this file.
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/readyz']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    image: ghcr.io/${IMAGE_OWNER:-libriant}/libriant-web:${IMAGE_TAG:-latest}
    <<: [*restart, *logging, *hardening]
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    cpus: ${WEB_CPUS:-1}
    pids_limit: 512
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
      # Server-side fetches from the web container go to api directly over
      # the docker network. Browser-side fetches still go through Caddy at
      # /lbr-api/* (see lib/api.ts).
      API_INTERNAL_URL: http://api:3001
      # boot-and-config-09: this is the base the BROWSER bundle is built against
      # — get it wrong and the panel loads, then 404s every /lbr-api/* call
      # against a vhost that has no API route. No default; see x-app-env.
      NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required (the app host, e.g. app.libriant.com)}
      PUBLIC_APP_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required (the app host, e.g. app.libriant.com)}
      # boot-and-config-13. This block is the web service's OWN environment —
      # compose merges nothing from x-app-env into it — so these two have to be
      # repeated here or the two read-only mounts below are inert. They were,
      # and it was invisible: apps/web/lib/locale-loader.ts and lib/legal.ts
      # (and lib/asset-root.ts) fall back to a path resolved relative to the
      # compiled server chunk, which happens to be the copy baked into the image
      # at build time. So editing /srv/libriant/locales on the host — the
      # documented way to correct a translation or a legal document without a
      # rebuild — changed nothing for the pages a visitor sees, while changing
      # everything the API served from the same files. The api/worker never had
      # this problem: x-app-env sets both for them.
      LOCALES_ROOT: /srv/libriant/locales
      ASSETS_ROOT: /srv/libriant/assets
      # The admin panel is served ONLY from this host; the admin layout 404s the
      # /admin routes on any other host (e.g. the public apex libriant.com/admin).
      ADMIN_HOST: ${ADMIN_HOST:-admin.libriant.com}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../../assets:/srv/libriant/assets:ro
      - ../../locales:/srv/libriant/locales:ro
    networks: [app]
    # reliability-14, see `api`. Next's server finishes in-flight renders on
    # SIGTERM; 30s so a page being streamed to a librarian completes instead of
    # being cut off into a broken document at the 10s default.
    stop_grace_period: 30s
    # boot-and-config-08. This probed /api/healthz, which returns a constant
    # `{status:'ok'}` and — by its own comment — "doesn't touch the API or any
    # other dependency". The web container therefore could NOT become unhealthy
    # no matter what happened behind it, and the deploy gate
    # (.github/workflows/deploy.yml, scripts/deploy-on-host.sh) trusted that
    # signal: a wrong API_INTERNAL_URL or a broken `app` network passed every
    # check green while every page a librarian opened rendered an error.
    # /api/readyz already existed and already fetches ${API_INTERNAL_URL}/readyz
    # with a 3s timeout, returning 503 on failure — it was simply wired to
    # nothing. /api/healthz stays as the pure liveness route.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/readyz']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    image: ghcr.io/${IMAGE_OWNER:-libriant}/libriant-api:${IMAGE_TAG:-latest}
    <<: [*restart, *logging, *hardening]
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-1}
    pids_limit: 512
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ['./apps/api/node_modules/.bin/tsx', 'apps/api/src/worker.ts']
    environment:
      <<: *app-env
      PORT: '3002'
      WORKER_PORT: '3002'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/srv/libriant/storage
      - ../../assets:/srv/libriant/assets:ro
      - ../../locales:/srv/libriant/locales:ro
    # `app` for egress (Stripe/SMTP); `data` (internal) for postgres/redis. (INFRA-3)
    networks: [app, data]
    # Give the worker time to drain in-flight jobs on SIGTERM before Docker
    # SIGKILLs it — pairs with the bounded graceful-shutdown deadline in
    # worker.ts (REL-03). Probe /readyz (reflects live queue + Redis health),
    # not /healthz (always-200), so a wedged consumer is actually detected.
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/readyz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----- data ----------------------------------------------------------
  postgres:
    # supply-chain-05. Tag AND digest. `docker compose pull` runs on every
    # deploy (.github/workflows/deploy.yml), so a floating tag meant two deploys
    # of the same IMAGE_TAG could run different Postgres binaries and nothing
    # would say so. The tag is kept for readability; the digest is what is
    # actually resolved. To move to a new base image, re-resolve the digest
    # deliberately (see infra/monitoring/../README or:
    #   docker buildx imagetools inspect postgres:16-alpine
    # ) and change both halves in the same commit.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: [*restart, *logging, *hardening]
    # Keep Postgres's ceiling the highest of the app tier — it's the component
    # whose death takes the whole cell down. Tune shared_buffers/work_mem in the
    # command below to stay within this on a larger host.
    mem_limit: ${PG_MEM_LIMIT:-2g}
    cpus: ${PG_CPUS:-2}
    pids_limit: 512
    environment:
      POSTGRES_USER: libriant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: libriant_control
      # boot-and-config-14. This was `LANG: el_GR.UTF-8`, which configured the
      # cluster's collation by side-effect — initdb reads LANG for its default
      # locale — on an image whose C library has no such locale. musl accepts
      # any locale name from setlocale() and behaves as C, so what was recorded
      # in pg_control was a name with no behaviour behind it: Greek text sorted
      # in BYTE order while the cluster claimed Greek collation.
      #
      # Both halves of that are real damage. Byte order is visibly wrong for the
      # only market this product has — measured on PostgreSQL 16.15 over a list
      # of Greek surnames, C collation returns
      #   Άλκη < Έλσα < Βιζυηνός < Ελύτης < … < Ωνάσης < άλφα < όμηρος
      # (every lowercase form dumped after Ω, and Έ sorted before Β), where ICU
      # el-GR returns the order a librarian expects:
      #   Άλκη < άλφα < Βιζυηνός < Έλσα < Ελύτης < … < Παπαδιαμάντης < Ωνάσης.
      # And the label was a trap for later: a data directory or base backup
      # carrying `el_GR.UTF-8` restored onto a glibc Postgres — a plausible DR
      # or migration path — makes that collation REAL, at which point every text
      # btree built under byte order disagrees with it. That is the classic
      # silent index-corruption scenario.
      #
      # ICU rather than a libc locale, deliberately: an ICU collation is carried
      # by the collation version recorded in the catalogue rather than by the
      # host's C library, so it means the same thing on musl, on glibc, and on
      # whatever restores the backup in five years. It also removes the reason
      # this was ever ambiguous.
      #
      # THIS ONLY APPLIES TO A CLUSTER THAT DOES NOT EXIST YET. The entrypoint
      # passes POSTGRES_INITDB_ARGS to initdb, and initdb runs once, on an empty
      # pg_data volume. An existing cluster keeps the collation it was built
      # with and cannot be changed in place without a full reindex, so this has
      # to be right BEFORE the first library is provisioned.
      # infra/compose/postgres-init.sql asserts it, on that same first run.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=el-GR --locale=C.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      # boot-and-config-02: same variable the api/worker plan their tenant pools
      # from (x-app-env PG_MAX_CONNECTIONS). Change it in ONE place or the pool
      # budget and the server silently disagree again.
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      # performance-14. Nothing anywhere bounded a tenant query. A runaway —
      # a lock wait nobody notices, a plan that flips to a sequential scan after
      # a bad ANALYZE — held one of that library's five pool slots for as long
      # as it liked, and five of them wedged the library completely with no
      # recovery short of an operator running pg_terminate_backend by hand.
      #
      # Set on the SERVER rather than on a connection string, because the
      # per-tenant URL is written into `tenants.db_url` at signup: a change made
      # there would apply to libraries provisioned afterwards and to no existing
      # one. This applies to every session on the box, including the ones that
      # already exist. Verified through the real client — a tenant client built
      # by makeTenantPrismaClient against a cluster started with exactly these
      # flags reports `statement_timeout=1min`, and `SELECT pg_sleep(300)` came
      # back "canceling statement due to statement timeout" at 1:00.03.
      #
      # 60s, not the 30s the finding suggested: the longest legitimate single
      # statement this product issues is the export worker's, and its author
      # already picked 60s as the line between slow and broken
      # (apps/api/src/export/export-processors.ts STATEMENT_TIMEOUT_MS). Nothing
      # a librarian waits on in a browser survives a tenth of that.
      #
      # WHAT THIS DELIBERATELY DOES NOT KILL — checked, not assumed:
      #  • Backups and restores. pg_dump/pg_dumpall set `statement_timeout = 0`
      #    on their own connection AND write it into the dump prologue, so
      #    backup.sh, restore.sh, dr-drill.sh and the export worker's pg_dump
      #    are all exempt by construction. Measured against a cluster running
      #    these flags: pg_dump exit 0, and the dump opens with
      #    `SET statement_timeout = 0; SET lock_timeout = 0;
      #     SET idle_in_transaction_session_timeout = 0;`, restore exit 0.
      #  • Migrations and long maintenance. A migration that legitimately needs
      #    longer opens with `SET statement_timeout = 0;` — Prisma runs each
      #    migration file in one session — and an operator's psql session takes
      #    `PGOPTIONS='-c statement_timeout=0'`, verified to reach the server
      #    both through libpq and through the app's own Prisma/pg adapter.
      #  • Imports. statement_timeout is per STATEMENT, not per transaction or
      #    per job, and the import engine commits ONE RECORD PER TRANSACTION
      #    (import-engine.ts:567 `$transaction` per row) out of a handful of
      #    small writes. A two-hour import of a 400k-record catalogue is never
      #    one statement, and it never sits idle inside a transaction either —
      #    nothing but database calls happens between BEGIN and COMMIT.
      #
      # And no `lock_timeout`: a statement blocked on a lock is still a running
      # statement, so statement_timeout already bounds it. Adding a separate
      # lock_timeout would buy nothing and would abort a migration waiting
      # legitimately behind a long read — a worse bug than the one being fixed.
      - -c
      - statement_timeout=${PG_STATEMENT_TIMEOUT:-60s}
      # A session that opens a transaction and then stops — a crashed client, a
      # tab closed mid-checkout — holds its locks and pins the xmin horizon, so
      # autovacuum stops reclaiming for the whole database. Generous on purpose:
      # Prisma's own interactive-transaction timeout is 5s, so anything reaching
      # two minutes is a leak, not a workload.
      - -c
      - idle_in_transaction_session_timeout=${PG_IDLE_TX_TIMEOUT:-120s}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../compose/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks: [data]
    # reliability-14, and this is the one that matters. The official postgres
    # image's STOPSIGNAL is SIGINT — fast shutdown — which still has to complete
    # a shutdown checkpoint before it exits. Under Docker's 10s default, a
    # checkpoint that overruns ends in SIGKILL, and the next start is WAL crash
    # recovery: extra downtime on the component whose death takes the whole cell
    # with it, at exactly the moment an operator is already doing something
    # stressful. Measured on the seeded audit cluster the shutdown checkpoint
    # took 0.048s, so 10s is not a live problem TODAY — it becomes one as the
    # dataset grows into the 2 GB limit above, silently, with no warning between
    # "fine" and "crash recovery". 120s is well past any checkpoint this box can
    # produce; it costs nothing on a clean shutdown, which is the normal case.
    stop_grace_period: 120s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libriant -d libriant_control']
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    # supply-chain-05, the softest link in this file: unlike postgres/redis/caddy
    # this is NOT a Docker Official Image but a single-maintainer community one,
    # and it sits in the credential path (POSTGRES_PASSWORD is in its
    # environment). A hijacked tag would have landed in production on the next
    # `docker compose pull` with no signal. Pinned to the digest of
    # v1.25.2-p0 as published on 2026-08-26.
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    <<: [*restart, *logging, *hardening]
    mem_limit: ${PGBOUNCER_MEM_LIMIT:-256m}
    cpus: ${PGBOUNCER_CPUS:-0.5}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: libriant
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_NAME: libriant_control
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '20'
    networks: [data]
    # boot-and-config-15. NO healthcheck on this service, and the probe that
    # replaces it lives in `pgbouncer-probe` below. The one that used to be here
    # — `pg_isready -h localhost -p 5432 -U libriant` — was a green light that
    # could not turn red for the failure that matters: pg_isready is satisfied
    # by the startup-packet reply, which pgbouncer sends ITSELF. It never
    # reaches Postgres, so the pooler reported "accepting connections" while the
    # backend behind it was unreachable, wrong-password or gone.
    #
    # Putting the real probe back HERE needs `psql` inside this image, and this
    # is the one image in the file that is a single-maintainer community build
    # rather than an official one — its contents cannot be checked from this
    # repo, and Docker is not installed on the machine this was written on, so
    # it could not be pulled and inspected either. A healthcheck that turns a
    # perfectly good pooler permanently red is a worse 3am signal than none.
    # Hence the sidecar: same probe, run from an image whose contents ARE known.

  # boot-and-config-15. The pooler's health probe, hosted out-of-process.
  #
  # `psql -c 'select 1'` through pgbouncer:5432 is the only probe that can tell
  # the two states apart — "the pooler answers" and "the pooler can reach the
  # database" — because it makes the pooler open a server-side connection and
  # run a statement on it. pg_isready cannot: it is answered by pgbouncer's own
  # startup-packet reply and never touches Postgres. Demonstrated rather than
  # assumed: against the audit's local Postgres, `pg_isready -U nobody -d
  # nope` returns "accepting connections" and exit 0, while `psql -U nobody -d
  # nope -c 'select 1'` exits 2 with a FATAL.
  #
  # THE IMAGE IS DELIBERATELY THE ONE POSTGRES ALREADY USES, digest and all: it
  # ships psql, it is a Docker Official Image, it is already pulled on the host,
  # and reusing the exact pin adds no supply-chain surface for a diagnostic. The
  # entrypoint is replaced because the postgres entrypoint would try to
  # initialise a cluster; this container only ever sleeps and gets probed.
  #
  # WHO CONSUMES IT, because a healthcheck nobody reads is the defect this
  # replaces: the deploy health gate asserts it alongside api/web/worker in BOTH
  # deploy paths (scripts/deploy-on-host.sh and .github/workflows/deploy.yml).
  # `api` deliberately does NOT gate its start on it — its own /readyz already
  # crosses the same hop, and making the API's boot depend on a diagnostic
  # sidecar would turn a broken probe into an outage. What this adds is
  # ATTRIBUTION: at 3am, api unhealthy + probe unhealthy means the pooler path,
  # api unhealthy + probe healthy means the API.
  pgbouncer-probe:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: [*restart, *logging, *hardening]
    mem_limit: ${PGBOUNCER_PROBE_MEM_LIMIT:-128m}
    cpus: ${PGBOUNCER_PROBE_CPUS:-0.25}
    pids_limit: 64
    # Replacing the entrypoint also replaces the thing that drops privileges:
    # postgres:16-alpine declares no USER, and it is its ENTRYPOINT that steps
    # down to the `postgres` account. Overriding it with `sleep` left PID 1 as
    # root with the full default capability set, on the `data` network beside
    # Postgres — a second uid-0 container introduced by the same change that
    # hardens the first one. This container only ever runs `sleep` and `psql`,
    # so neither root nor any capability buys it anything.
    user: 'postgres'
    cap_drop: ['ALL']
    # A bare number, not `sleep infinity`: this image is alpine, so `sleep` is
    # busybox, and `infinity` is a GNU coreutils spelling busybox rejects. That
    # would exit immediately, crash-loop under `restart: unless-stopped` and
    # never report healthy. The deploy no longer FAILS on that — the probe is a
    # reported signal, not a gate (see the health block in deploy.yml) — but a
    # crash-looping diagnostic is still a diagnostic nobody can read.
    # 2147483647 seconds is 68 years.
    entrypoint: ['sleep', '2147483647']
    depends_on:
      pgbouncer:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Bound the probe below the healthcheck timeout, so a pooler that accepts
      # the TCP connection and then hangs reads as a failed check rather than as
      # a check that never returns.
      PGCONNECT_TIMEOUT: '5'
    networks: [data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql -qtAX -h pgbouncer -p 5432 -U libriant -d libriant_control -c "select 1" >/dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    # supply-chain-05 — see the note on `postgres` above.
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    <<: [*restart, *logging, *hardening]
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1}
    pids_limit: 256
    # reliability-18. This used to be `--maxmemory-policy allkeys-lru` with no
    # `--maxmemory`, above a note explaining that eviction must never be allowed
    # to drop a live BullMQ job key. Both halves were wrong in opposite
    # directions: a maxmemory-policy is INERT without a maxmemory, so the line
    # configured nothing while reading like a protection — and the policy it
    # named was `allkeys-lru`, precisely the behaviour the note says would lose
    # jobs, waiting for the day somebody set a limit and thought the pairing had
    # been considered.
    #
    # The note's actual conclusion was right, so it is kept and made real. With
    # `noeviction` Redis never drops a key; at the ceiling it refuses WRITES
    # with an OOM error the app sees and logs, and reads and the existing queues
    # keep working. Without a ceiling there is nothing between "fine" and the
    # kernel OOM-killer taking the container — and a Redis that dies is not a
    # degraded cache here, it is a 100%-500 API.
    #
    # 320mb of the 512m cgroup limit above, not 100%: Redis forks for the AOF
    # rewrite and the child shares pages copy-on-write, so the container's peak
    # is the dataset plus whatever is written during the rewrite plus client
    # buffers. The two numbers move TOGETHER — raising REDIS_MEM_LIMIT alone
    # leaves Redis refusing writes with the RAM unused, raising REDIS_MAXMEMORY
    # alone puts the OOM-killer back in charge — and so does the alert
    # threshold in infra/monitoring/alerts.yml (LibriantRedisMemoryHigh), which
    # is what gives an operator warning before either edge. For scale: the
    # audited instance carrying 50 seeded tenants plus BullMQ used 1.4 MB.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-320mb}',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

# Network tiers (INFRA-3):
#   edge  — carries the host-published 80/443; only caddy joins it.
#   app   — inter-service comm (caddy↔web↔api/worker) + outbound egress for
#           Stripe / SMTP. Bridge (not internal) because the app processes need
#           the internet; caddy bridges edge↔app.
#   data  — postgres / pgbouncer / redis, plus the api/worker/migrate clients.
#           `internal: true`: containers here have NO route to/from the host or
#           the internet, so a future service that mistakenly declares `ports:`
#           — or a `docker run --network libriant_data -p` — CANNOT publish the
#           data tier (whose only auth is POSTGRES_PASSWORD/scram).
#
# None of the three sets `enable_ipv6`. That is a decision, not an oversight:
# a bridge network without IPv6 means Docker cannot DNAT a v6 connection, and
# without an explicit v4 bind on caddy's published ports it silently falls back
# to the userland proxy, which re-originates every v6 client from the bridge
# gateway — the bypass that defeated the first fix for authn-authz-01. The
# published ports above are therefore bound to IPv4 only; turning IPv6 on here
# is one of four changes that must be made together, listed in that comment.
networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  storage:
