# Libriant — local development stack.
#
# Brings up the data services only. App + worker run on the host via `pnpm dev`
# so TypeScript rebuilds are fast. Production compose will add caddy + app +
# worker as services here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: libriant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: libriant
      POSTGRES_PASSWORD: libriant
      POSTGRES_DB: libriant_control
      # boot-and-config-14. This said `LANG: el_GR.UTF-8` under a comment
      # claiming it gave Greek collation. It did not: musl (this is an Alpine
      # image) ships no locale definitions, accepts any name from setlocale()
      # and behaves as C, so the cluster recorded a Greek collation and sorted
      # in byte order. Dev matched prod only in being wrong the same way — which
      # is worse than not matching, because a sort bug reproduced locally looks
      # like an application bug.
      #
      # ICU carries the collation in the catalogue instead of in the host's C
      # library, so it means the same thing here, in the prod image, and on
      # whatever restores a backup later. Same args as
      # docker-compose.prod.yml; postgres-init.sql asserts the result.
      # Applies on FIRST init only: an existing libriant_pg_data volume keeps
      # the collation it was built with (`docker volume rm libriant_pg_data`
      # to rebuild, which drops your local data).
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=el-GR --locale=C.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      # UTC, by statement rather than by the image happening to ship no TZ.
      # `@prisma/adapter-pg` requires a UTC session and does not say so; a
      # non-UTC one stores every instant wrong by the offset. See
      # packages/shared/src/postgres-session.ts. This is the cluster-wide
      # companion to the per-database ALTER in postgres-init.sql, and it is what
      # a `TZ:` line added here in future would have to argue with.
      - -c
      - timezone=UTC
    ports:
      - '5432:5432'
    volumes:
      - libriant_pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libriant -d libriant_control']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: libriant-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: libriant
      DB_PASSWORD: libriant
      DB_HOST: postgres
      DB_NAME: libriant_control
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '20'
    ports:
      - '6432:5432'

  redis:
    image: redis:8-alpine
    container_name: libriant-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - libriant_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  libriant_pg_data:
  libriant_redis_data:
