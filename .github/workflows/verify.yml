name: verify

# Reusable validation gate — the SINGLE SOURCE OF TRUTH for "is this commit
# sound". Called by ci.yml (push/PR feedback), deploy.yml (production gate) and
# desktop-release.yml (desktop gate) so all three enforce the EXACT same checks
# and can never drift. Every job uses inline test-only values, so no secrets are
# needed and the gate is safe to call from any workflow.
on:
  workflow_call:

# Least privilege: the gate only ever reads the repo (checkout + install). It
# never publishes images or releases — those live in the calling workflows.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (typecheck + translations + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients (control-plane + tenant)
        run: pnpm db:generate
        env:
          # Generation doesn't actually connect; placeholder URLs silence the warnings.
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Translation parity (en + el catalogs in lock-step)
        run: pnpm check:translations

      # A Dockerfile/package.json pnpm mismatch is invisible until the migrate
      # one-shot fails on a network it has no egress from — which is exactly
      # what happened. The image-contents job below does build the images now,
      # but it runs late and in parallel; this answers in milliseconds.
      - name: pnpm pins match across package.json and the Dockerfiles
        run: pnpm check:pnpm-pins

      # The image-contents job builds and BOOTS the API image, so it does catch
      # a missing workspace COPY — it caught this one. It caught it for nine
      # consecutive phases, on a job that had been red long enough to read as
      # scenery, while every green signal a phase actually looked at stayed
      # green: typecheck, lint, unit, integration and smoke all run against the
      # full workspace on disk, where every package resolves.
      #
      # This is the same assertion, thirty seconds into the run instead of
      # twenty minutes, in a job people read.
      - name: Each Dockerfile copies the full workspace closure it builds
        run: pnpm check:docker-workspace-closure

      - name: Asset manifest integrity (every slot exists; every code ref listed)
        run: pnpm check:assets

      # Fails only on an author-facing note escaping into a published legal
      # page. The unfilled-provider-details list it prints is a readiness
      # report, not a gate — nobody in this repository can invent a GEMI number.
      - name: Legal documents publish nothing addressed to their author
        run: pnpm check:legal

      # The edge is the only thing between the internet and an API that trusts
      # X-Real-IP. A `handle /webhooks/*` block shipped with no origin guard and
      # nothing noticed, because nothing looked.
      - name: Every Caddy backend route sits behind the origin guard
        run: pnpm check:caddy

      # An alert on a metric nothing emits is a rule that can never fire, and
      # PromQL will not tell you — the expression is valid, it just matches
      # nothing. The opposite is just as real and completely invisible: a metric
      # that is emitted, scraped, charted and has NO alert, so the thing it
      # measures fails in silence. `libriant_backup_last_exit_code` was in that
      # state — a backup that failed at 03:00 was first mentioned 36 hours later
      # by BackupStale.
      #
      # Since 2.0 phase 5 this reads the declarations in
      # apps/api/src/observability/metrics.registry.ts and asserts BOTH
      # directions, plus: every literal metric name in an emitter is declared
      # (comments stripped, so prose cannot pass for an emission); every
      # declaration is written by the source it claims — which is how
      # `renderScheduledJobMetrics` was caught being exported, unit-tested,
      # documented as called, and never called; every source has a scrape job;
      # and every libriant_* in the README or the RUNBOOK is a real metric.
      - name: Every metric is declared, alerted on purpose and actually scraped
        run: pnpm check:alerts

      # `@libriant/shared` ships TS source whose barrel re-exports with `.js`
      # specifiers. tsc rewrites those and is happy; Turbopack cannot resolve
      # them. So a barrel import passes typecheck and then kills `next build`
      # minutes later. This is seconds, and runs before the build does.
      - name: Web imports @libriant/shared by subpath, never the barrel
        run: pnpm check:shared-imports

      # The country list behind the application form's two selects: 243 dial
      # codes drafted from memory, cross-checked here against ICU for the Greek
      # and English names and against libphonenumber's metadata for every digit.
      # A wrong dial code is not a rendering bug — it is a library whose number
      # nobody can ring, and nothing downstream would ever report it. This ran
      # only inside `pnpm check:all`, which CI does not call.
      - name: Country list matches ICU and libphonenumber
        run: pnpm check:countries

      # One Greek fold, four runtimes. `foldGreek` decides what a Greek query
      # and a Greek record have in common, and it has to run identically in
      # TypeScript, in Postgres (index expressions and generated columns),
      # later in the OpenSearch analysis chain and later still in the desktop
      # client's Rust core. A one-code-point disagreement indexes a record
      # under a key the query never produces: no error, no log line, just a
      # book on the shelf the catalogue denies having.
      #
      # This half is hermetic — 854 vectors through TypeScript, plus the SQL
      # file's variant table, combining range and pinned collation compared
      # against the exported constants. The EXECUTABLE half needs a database
      # and runs in integration-tests as greek-folding-parity.spec.ts.
      - name: Greek folding agrees across runtimes
        run: pnpm check:greek-folding

      # The currency table decides what a stored `bigint` means. A wrong
      # minor-unit exponent is a fee or an invoice line wrong by a power of
      # ten, reconciled against nothing that could notice. Checked against ICU,
      # including the 16 currencies where ISO 4217 and ICU legitimately
      # disagree and must keep disagreeing exactly as recorded.
      - name: Currency table matches ICU
        run: pnpm check:currencies

      # Migration SQL that cannot run, or runs and quietly corrupts. Four rules,
      # each one a mistake this repo has already made or is one phase from
      # making: CONCURRENTLY inside the transactional track (a transactional
      # migration opens its own BEGIN/COMMIT and CONCURRENTLY cannot run inside
      # one; note that `prisma migrate deploy` does NOT wrap a file for you —
      # measured in phase 9); an unqualified search_path-sensitive call in an index
      # expression, generated column, CHECK or DEFAULT (see
      # 20260825200000_qualify_immutable_unaccent); a bare cast to timestamptz,
      # which reads the existing value in the SESSION's zone and would shift
      # every stored instant by Europe/Athens' offset during the 2.0 upgrade;
      # and non-idempotent DDL in the resumable online track.
      #
      # Matching is done on SQL with comments and string literals scrubbed —
      # seven migrations explain in prose why they did NOT use CONCURRENTLY,
      # and a plain grep fails all seven.
      - name: Migration SQL is safe to apply
        run: pnpm check:migration-safety

      # Every tenant-scoped route says who may call it. A handler with no
      # authorization decorator is not closed — TenantGuard proves the caller
      # belongs to the library and stops there, so the route is open to every
      # signed-in member of it, including a volunteer. authn-authz-06 is that
      # bug, already shipped once: two controllers carried @UseGuards(TenantGuard)
      # alone, and a volunteer refused POST /members could upload that member's
      # photo. So "I forgot" and "everyone may" are different states in the
      # source: @PublicWithinTenant() says the second one out loud.
      - name: Every tenant route declares a permission
        run: pnpm check:permissions

      # `tenants.db_url` is the Postgres SUPERUSER string with the database name
      # swapped in. Until the per-tenant roles landed it was also what every
      # request connected with, so the audit read one library's members using the
      # connection string held for another (tenant-isolation-02) and then found
      # the same string in plaintext in a passwordless Redis (-03). Nothing in
      # the type system separates the admin url from the runtime one — both are
      # `string` — so this asserts that only migrations, pg_dump and VACUUM read
      # it, that every tenant client is opened through runtimeDbUrl(), and that
      # the sealed password appears only where it is written or opened.
      - name: Tenant databases are opened with per-tenant credentials
        run: pnpm check:tenant-db-urls

      # A published API document that does not describe the server is the
      # defining flaw of every incumbent ILS — the spec is a separate artefact
      # somebody updates, so it drifts. Here it is generated from
      # `apps/api/src/public-api/registry.ts`, which is simultaneously the
      # route's validation wiring and the OpenAPI source, and this step refuses
      # a build where the generated and the committed documents differ.
      #
      # With no public routes yet (they arrive in M6) that comparison alone
      # would be nearly vacuous, so the gate also proves the class-validator →
      # JSON Schema deriver AGREES with `validateDto()` on fixture DTOs: every
      # property the schema calls required is genuinely rejected when omitted,
      # every optional one genuinely accepted, and an unknown key genuinely
      # refused — which is what licenses `additionalProperties: false`.
      #
      # NOTE the `--tsconfig`: this is the first gate that imports decorated
      # classes, there is no tsconfig.json at the repository root, and without
      # it tsx emits TC39 decorators and the DTOs throw at class-definition
      # time. The script's header carries the measured error.
      - name: The published API contract is generated, not maintained
        run: pnpm check:openapi

      # A validator driven by data has a failure mode a validator written in code
      # does not: a misspelled key in a JSON definition is not a syntax error, it
      # is a rule that silently stops applying — and the symptom, fewer
      # complaints, looks exactly like progress.
      #
      # So this asserts the committed definitions load, are honest about their own
      # coverage (a partial definition that does not say so is the dangerous
      # kind), have not been hand-edited since their digest was recorded, and bind
      # only tags they define. Then it runs every one of the 5,000 generated
      # records through the validator and requires ZERO errors — which is what
      # stands in for "zero false positives on LC-published-valid records" in a
      # repository that has no LC records: the corpus was written for phase 7 to
      # test byte round-tripping, so it is not tuned to this definition.
      - name: The format definitions are honest and raise nothing on ordinary MARC
        run: pnpm check:marc-schema

      # And the generator's own check mode, which SKIPS with a printed reason
      # while no authority is vendored and starts diffing the committed
      # definitions against it the day one is. Kept as its own step so the skip
      # is visible in the log rather than buried inside another gate.
      - name: Format definitions match their upstream authority, if one is vendored
        run: pnpm marc:schema --check

      # The 2.0 schema conventions, checked against the DDL the datamodel
      # RENDERS TO rather than against Prisma field names — a gate reading field
      # names would pass a schema with no @map at all. Needs no database: the
      # render is done with the connection string pointed at a closed port, so a
      # future Prisma that needed one would fail here loudly instead of quietly
      # starting to skip.
      #
      # It also holds the baseline's SCOPE: §3 names ~180 tenant tables and the
      # baseline builds 17, and BASELINE-SCOPE.json accounts for every one of
      # them in both directions. That is what keeps "we did not build these" a
      # checked fact rather than an omission somebody has to notice in review.
      - name: The 2.0 schema keeps its conventions and declares its scope
        run: pnpm check:schema-conventions

      # Every @replicated model has a change trigger and vice versa.
      #
      # Compared against the COMMITTED migration SQL, never against the
      # generator's output — regenerating the triggers and comparing them to the
      # markers they were generated from would be comparing a function to its own
      # input, and could not fail for any reason. Whether a provisioned library
      # actually HAS those triggers is a different question, answered by
      # tenant-schema-census.spec.ts against pg_trigger.
      - name: Every replicated model has a change trigger, and vice versa
        run: pnpm check:changelog-coverage

      # items.status has exactly one writer (2.0 phase 15).
      #
      # The GREP half of that boundary. `eslint.config.mjs` carries the AST half
      # and is precise about the Prisma shapes; it is blind to raw SQL, which
      # this repository writes deliberately and often, and a boundary with a door
      # in it is not one. A status write that goes around ItemStatusService
      # succeeds, returns 200 and leaves item_status_history without the row —
      # nothing fails until a librarian asks what happened to a copy and the
      # history says nothing.
      - name: Only ItemStatusService writes items.status
        run: pnpm check:item-status-writer

      # Advisory locks are taken through platform/locks.ts, which sorts them
      # (2.0 phase 16).
      #
      # A hand-written lock is correct in isolation and cannot agree with the
      # lock another transaction is taking at the same moment. Measured on the
      # real tables: a checkin taking `item:` then `patron:` produced 17 x 40P01
      # in fifteen seconds against a concurrent checkout, the first at 1,165 ms;
      # through `orderLocks` the same workload produced zero. This is the half
      # that reads `.sql`, which ESLint cannot.
      - name: Advisory locks go through platform/locks.ts
        run: pnpm check:advisory-locks

      # Every Postgres session this product opens is UTC.
      # `@prisma/adapter-pg` requires it and does not say so: it encodes AND
      # decodes timestamptz as if the session's local wall clock were UTC, so on
      # a non-UTC session every instant it writes is stored wrong by the offset,
      # and on the spring-forward night the value is silently moved by an hour.
      #
      # A STATIC gate, deliberately, because the runtime one cannot fail here:
      # this workflow's postgres:16-alpine service ships no TZ and is therefore
      # already UTC, which is exactly why CI never caught the defect. The runtime
      # half is apps/api/test/integration/session-timezone.spec.ts, which makes
      # its own Asia/Kolkata database so it discriminates on any cluster.
      - name: Every Postgres session is UTC
        run: pnpm check:session-timezone

      # amtool is run against a COPY with the receiver placeholders substituted,
      # not against the file as committed.
      #
      # alertmanager.yml ships `[PLACEHOLDER: alert webhook URL …]` on purpose:
      # no engineer can invent who gets woken up, and Alertmanager refusing to
      # start on an unparseable URL is the deliberate mechanism that stops the
      # stack pretending to alert. But amtool refuses it for the same reason
      # (`first path segment in URL cannot contain colon`), so this step could
      # never pass and blocked every push to main.
      #
      # Skipping it while placeholders remain would be the easy fix and the
      # wrong one — it would leave the routing tree, the receivers, the matchers
      # and the inhibit rules unvalidated for exactly as long as the file is in
      # the state most likely to contain a mistake. Substituting the URLs
      # validates everything except the URLs, today, and the real file is
      # validated directly the moment an owner fills them in.
      - name: Prometheus rules and Alertmanager config are valid
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/infra/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /m/alerts.yml

          mkdir -p /tmp/amcheck
          if grep -q '\[PLACEHOLDER' infra/monitoring/alertmanager.yml; then
            n=$(grep -c '\[PLACEHOLDER' infra/monitoring/alertmanager.yml)
            echo "::notice::alertmanager.yml carries $n [PLACEHOLDER] receiver(s). Validating structure with substituted URLs; the URLs themselves are unchecked until an owner fills them in."
            sed 's#\[PLACEHOLDER[^]]*\]#https://ci.invalid/placeholder#g' \
              infra/monitoring/alertmanager.yml > /tmp/amcheck/alertmanager.yml
          else
            cp infra/monitoring/alertmanager.yml /tmp/amcheck/alertmanager.yml
          fi
          docker run --rm -v /tmp/amcheck:/m:ro --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /m/alertmanager.yml

      # And that the config is loadable at all — a syntax error here takes the
      # whole edge down on deploy, and no job built or parsed it before now.
      #
      # `caddy validate` does not merely adapt: it PROVISIONS every app, and the
      # tls app opens `/etc/caddy/origin/origin.crt` (Caddyfile:160), which is
      # the Cloudflare origin certificate and exists only on the production
      # host. So this step failed with `loading certificates: … no such file or
      # directory` — a real file, correctly referenced, that CI has no business
      # holding.
      #
      # A throwaway self-signed pair at the same path is the right substitute.
      # Dropping to `caddy adapt` would have been easier and would have given up
      # exactly the half worth having: adapt catches a syntax error, provision
      # catches a directive that parses and cannot load, which is the failure
      # that takes the edge down on deploy rather than at build time.
      - name: Caddyfile adapts and validates
        run: |
          set -euo pipefail
          mkdir -p /tmp/caddy-origin
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=libriant-ci.invalid' \
            -keyout /tmp/caddy-origin/origin.key \
            -out /tmp/caddy-origin/origin.crt 2>/dev/null
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/caddy-origin:/etc/caddy/origin:ro \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: TypeScript typecheck (all packages)
        run: pnpm typecheck

      - name: ESLint (all packages)
        run: pnpm lint

      - name: Prettier formatting
        run: pnpm format:check

      # The marketing site is generated, and build.ts carries two gates that
      # nothing else exercises: the [PLACEHOLDER] refusal and the copy lint.
      # Strict (not --draft) so a placeholder or a banned claim fails the build.
      - name: Build the marketing site
        run: pnpm --filter @libriant/site build

      - name: Check the site actually emitted
        run: |
          test -s apps/site/dist/index.html
          test -s apps/site/dist/en/index.html
          test -s apps/site/dist/404.html
          test -s apps/site/dist/en/404.html
          test -s apps/site/dist/styles.css

  unit-tests:
    name: Unit tests (vitest, mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm db:generate
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Unit tests
        run: pnpm --filter @libriant/api exec vitest run --project unit

      # The web and ui packages run node:test, not vitest, and for a while their
      # `test` scripts were `echo 'tests: none yet' && exit 0` — so when real
      # tests were added, nothing noticed that no gate ran them. That left
      # `apps/web/lib/safe-html.test.ts` — the only automated guard between this
      # repo and a re-introduced stored-XSS sink on the public legal pages —
      # unable to fail a build. Kept as its own step rather than folded into
      # `pnpm test`, because @libriant/api's `test` script also runs the
      # integration project, which needs a database this job does not have.
      #
      # `@libriant/marc` is here for the same reason and it is the load-bearing
      # one: its `test` script is a glob, and `node --test` exits 0 when a glob
      # matches nothing. A codec with no gate running it is a directory of
      # plausible TypeScript, so the suite asserts its own size (below) and this
      # line is what runs it.
      #
      # `@libriant/circ-policy` joins on exactly that argument. It is the package
      # that decides when a book is due and what a patron owes, its ~440 golden
      # vectors are the contract phase 77's Rust core is pinned to, and its test
      # script is the same exit-0-on-an-empty-glob shape. A filter list is an
      # allowlist: a new package is invisible to CI until this line names it, so
      # the vectors could pass by not existing. Its `pretest` asserts the file
      # count for the same reason.
      - name: Web, design-system and codec tests
        run: >-
          pnpm --filter @libriant/web --filter @libriant/ui --filter @libriant/shared
          --filter @libriant/marc --filter @libriant/circ-policy test

  # The verify gate ran typecheck, lint, prettier, translations, assets, unit,
  # integration, migrations and the DR drill — and zero supply-chain checks.
  # Combined with --frozen-lockfile everywhere, that meant the resolved tree was
  # frozen forever with no mechanism to notice a disclosure against it.
  supply-chain:
    name: Supply chain (advisories + action pinning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking at `critical`, not `high`: one high is open today against
      # deepmerge-ts, reached only through the Prisma CLI, and gating on it
      # would wedge every merge behind an upstream release. The full report
      # below still surfaces it on every run, so it cannot be forgotten —
      # raise this to `high` the moment that advisory clears.
      - name: Advisories (blocking — critical in the production tree)
        run: pnpm audit --prod --audit-level=critical

      - name: Advisories (full report, non-blocking)
        if: always()
        run: pnpm audit || true

      # Belt and braces around the pins themselves: Dependabot proposes SHA
      # bumps as PRs, and a PR is exactly where a floating tag could be
      # reintroduced by hand.
      - name: Every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          # Anchored to the YAML key. The unanchored version matched the
          # literal `uses: ` inside THIS script and reported itself, so the
          # gate failed on every run regardless of the workflows' contents —
          # a check that cannot pass is a check nobody reads.
          floating=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses: ' .github/workflows/ \
            | grep -v '@[0-9a-f]\{40\}' \
            | grep -v 'uses: \./\.github/' || true)
          if [ -n "$floating" ]; then
            echo "::error::Unpinned action reference(s) — a mutable tag can be repointed by its owner:"
            echo "$floating"
            exit 1
          fi
          echo "All external action references are SHA-pinned."

  integration-tests:
    name: Integration tests (real postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: libriant_control
          # boot-and-config-14. This was `LANG: el_GR.UTF-8`, which is the exact
          # no-op that finding is about: postgres:16-alpine is musl and has no
          # such locale, so the NAME was recorded and the BEHAVIOUR was byte
          # order. Compose was corrected to ICU in the same wave and this file
          # was not, which left CI clusters sorting Greek differently from the
          # production cluster they are supposed to be gating — the one skew a
          # test suite can never tell you about, because it is the thing doing
          # the telling.
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=el-GR --locale=C.UTF-8 --encoding=UTF8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U libriant -d libriant_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
      PG_SUPERUSER_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-test
      ADMIN_SESSION_SECRET: ci-only-test
      IMPERSONATION_SECRET: ci-only-test
      # Quoted: the value is all digits, which unquoted YAML coerces to a
      # float (1.12e+61) — the app then rejects it as non-hex.
      MFA_MASTER_KEY: '0011223344556677889900112233445566778899001122334455667788990011'
      # Seals each tenant's own Postgres password. Must differ from
      # MFA_MASTER_KEY — loadEnv() refuses to boot when the two match.
      TENANT_DB_MASTER_KEY: 'aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899'
      STRIPE_DRIVER: fake
      STORAGE_ROOT: /tmp/libriant-test-storage
      EMAIL_DRIVER: console
      # tsx + decorators (NestJS DI) needs the API's tsconfig pinned.
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/apps/api/tsconfig.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Postgres extensions
        run: |
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "

      - name: Generate Prisma clients
        run: pnpm db:generate

      - name: Apply control-plane migrations
        run: pnpm db:migrate:deploy

      - name: Seed control-plane (cells + plans + feature catalog)
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm --filter @libriant/api exec vitest run --project integration

  db-migration:
    name: Apply control-plane + tenant migrations against real Postgres
    runs-on: ubuntu-latest
    services:
      # Dedicated, throwaway cluster for the DR drill. Separate from the
      # service below because the drill dumps and destroys an ENTIRE cluster.
      # Target for the cross-cluster drill: independently initialised with a
      # DIFFERENT superuser password, which is the whole point — it proves what
      # a pg_dumpall restore does to a rebuilt host's credentials.
      postgres-drill-target:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: target-differs-on-purpose
          POSTGRES_DB: postgres
          # trust, deliberately. The dump replaces this role's password with the
          # SOURCE's in its prologue, and every `\connect` after that
          # re-authenticates — so over TCP with scram the rest of the stream
          # cannot connect and the restore dies half-done. Production never
          # meets this because it restores over the container's local socket;
          # a service container has no socket to offer, so trust is the
          # equivalent. The password is still SET, so the drill can still prove
          # the verifier was swapped; the live password-flip assertions detect
          # trust and skip themselves rather than pass vacuously.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U libriant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-drill:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U libriant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: libriant_control
          # boot-and-config-14. This was `LANG: el_GR.UTF-8`, which is the exact
          # no-op that finding is about: postgres:16-alpine is musl and has no
          # such locale, so the NAME was recorded and the BEHAVIOUR was byte
          # order. Compose was corrected to ICU in the same wave and this file
          # was not, which left CI clusters sorting Greek differently from the
          # production cluster they are supposed to be gating — the one skew a
          # test suite can never tell you about, because it is the thing doing
          # the telling.
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=el-GR --locale=C.UTF-8 --encoding=UTF8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U libriant -d libriant_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # The seed + tenant scripts import the generated Prisma clients, so they
      # must be generated first (the other jobs do this too). Generation
      # doesn't connect — the placeholder URLs just silence the warnings.
      - name: Generate Prisma clients (control-plane + tenant)
        run: pnpm db:generate
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Create + extend both DBs (control + demo tenant)
        run: |
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "
          # `\gexec` is a psql meta-command and is NOT honored by `psql -c`
          # (that path only runs plain SQL), so guard the create in the shell.
          if ! PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'libriant_demo'" | grep -q 1; then
            PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "CREATE DATABASE libriant_demo"
          fi
          # UTC, on the database, unconditionally. @prisma/adapter-pg requires a
          # UTC session and does not say so (packages/shared/src/postgres-session.ts).
          # CI's postgres:16-alpine is already UTC, which is exactly why CI could
          # never catch the defect — so the pin is stated here rather than
          # inherited, and `check:session-timezone` refuses a CREATE without one.
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c \
            "ALTER DATABASE libriant_control SET TimeZone TO 'UTC'; ALTER DATABASE libriant_demo SET TimeZone TO 'UTC'" 
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_demo -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "

      - name: Apply migration
        run: pnpm db:migrate:deploy
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Seed control-plane DB
        run: pnpm db:seed
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Verify expected row counts
        run: |
          COUNTS=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -t -c "
            SELECT
              (SELECT count(*) FROM cells)              || ',' ||
              (SELECT count(*) FROM plan_features)      || ',' ||
              (SELECT count(*) FROM plans)              || ',' ||
              (SELECT count(*) FROM plan_feature_values);
          " | tr -d ' ')
          echo "Counts: $COUNTS"
          [ "$COUNTS" = "1,15,6,90" ] || { echo "Expected 1,15,6,90 — seed drifted"; exit 1; }

      - name: Re-run seed (must remain idempotent)
        run: pnpm db:seed
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Verify row counts unchanged after re-seed
        run: |
          COUNTS=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -t -c "
            SELECT
              (SELECT count(*) FROM cells)              || ',' ||
              (SELECT count(*) FROM plan_features)      || ',' ||
              (SELECT count(*) FROM plans)              || ',' ||
              (SELECT count(*) FROM plan_feature_values);
          " | tr -d ' ')
          echo "Counts: $COUNTS"
          [ "$COUNTS" = "1,15,6,90" ] || { echo "Seed is not idempotent"; exit 1; }

      # Schema migrations are NOT replay-safe and are not meant to be — Prisma
      # runs each exactly once. Data migrations are different: one that upserts
      # seeded rows can look fine on the first run and duplicate or drift on the
      # second, and nothing else here would notice. `ON CONFLICT` is the precise
      # marker for that class, so any future data migration joins this gate on
      # its own.
      - name: Replay data migrations (must be idempotent)
        run: |
          set -euo pipefail
          export PGPASSWORD=libriant
          Q="SELECT p.slug, p.\"monthlyPriceCents\", p.\"annualPriceCents\", p.\"stripePriceId\",
                    p.\"stripeAnnualPriceId\", p.\"sortOrder\", p.id,
                    v.\"featureKey\", v.\"valueInt\", v.\"valueBool\"
             FROM plans p LEFT JOIN plan_feature_values v ON v.\"planId\" = p.id
             ORDER BY p.slug, v.\"featureKey\";"
          psql -h localhost -U libriant -d libriant_control -t -A -F',' -c "$Q" > /tmp/plans-before.csv
          FOUND=0
          for f in $(grep -l 'ON CONFLICT' packages/db-control/prisma/migrations/*/migration.sql); do
            echo "replaying $f"
            FOUND=1
            psql -h localhost -U libriant -d libriant_control -v ON_ERROR_STOP=1 -q -f "$f"
          done
          [ "$FOUND" = "1" ] || { echo "No data migrations matched — the grep marker has drifted"; exit 1; }
          psql -h localhost -U libriant -d libriant_control -t -A -F',' -c "$Q" > /tmp/plans-after.csv
          diff /tmp/plans-before.csv /tmp/plans-after.csv \
            || { echo "A data migration is not idempotent — plan state changed on replay"; exit 1; }
          echo "Data migrations are replay-safe."

      # An untested backup is not a backup. This exercises the real
      # backup.sh → restore.sh pipeline against the service container and
      # asserts the restored cluster matches the source, because the restore
      # path was silently destroying every database and restoring none.
      - name: DR drill (backup → restore round trip)
        run: |
          set -euo pipefail
          # The client must match the server major (postgres:16-alpine here);
          # a newer pg_dumpall emits settings 16 rejects. See the script header.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          # Port 5433, NOT the shared service on 5432: pg_dumpall is
          # cluster-wide and the drill destroys everything it dumped, which
          # would take libriant_control and libriant_demo — and every step
          # after this one — with it.
          PGHOST=localhost PGPORT=5433 PGUSER=libriant PGPASSWORD=libriant \
            pnpm dr:drill

      # The rebuilt-host case: restore this dump into a SECOND cluster whose
      # superuser password differs. It is what caught the template1 hazard —
      # a dump from an already-restored cluster cannot be restored onto a
      # pristine one, which is precisely the DR scenario.
      - name: DR drill — cross-cluster (rebuilt-host restore)
        run: |
          set -euo pipefail
          PGHOST=localhost PGPORT=5433 PGUSER=libriant PGPASSWORD=libriant \
          TARGET_PGHOST=localhost TARGET_PGPORT=5434 \
          TARGET_PGPASSWORD=target-differs-on-purpose \
            pnpm dr:drill --cross-cluster

      - name: Apply tenant migration to libriant_demo
        run: pnpm tenant:migrate:deploy
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      # The 2.0 baseline, into its own schema in the SAME database — which is
      # what the phase-9 acceptance criterion means by "applies to a 1.0 tenant
      # DB as a second schema, not yet cut over". libriant_demo has just had the
      # 1.0 migrations applied above, so this is that case exactly, and the
      # smoke run below then exercises both schemas side by side.
      #
      # btree_gist/btree_gin are created by tenant-create.ts and
      # TenantProvisioningService for a real tenant; libriant_demo is made by
      # `createdb`, so they are created here.
      - name: Apply the 2.0 baseline to libriant_demo as a second schema
        run: |
          set -euo pipefail
          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gist' \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gin'
          pnpm --filter @libriant/db-tenant prisma:migrate:deploy:v2
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Seed tenant defaults
        run: pnpm tenant:seed:defaults
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      # Eight modules: the 1.0 workflow against `public`, and seven 2.0 modules
      # against `lbr2`. The runner continues past a failure, so one broken
      # invariant reports itself rather than hiding the other seven.
      - name: Run tenant smoke test (1.0 workflow + the seven 2.0 modules)
        run: pnpm tenant:smoke
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      # THE UPGRADE REHEARSAL (2.0 phase 19b).
      #
      # A separate database, because the upgrade renames `public` to
      # `v1_archive` and `libriant_demo` is what every step above and the smoke
      # suite read. It is a TEMPLATE copy, so the 1.0 schema, the lbr2 baseline
      # and the seeded defaults all come for free.
      #
      # `ci` profile — 1,000 books and proportional, carrying EVERY awkward
      # shape: a Greek title with a leading article, a translator at order 0, an
      # orphaned author, a bad ISBN check digit, a language outside ISO 639-2/B,
      # a member with no email, duplicate queue positions, a `ready` hold with no
      # copy, a zero-amount fine, an archived-but-paid fine, audit rows spread
      # across months. §6's 50,000-book fixture is the `acceptance` profile and
      # belongs on a schedule: it would add twenty minutes to this job for a
      # signal that does not change between commits, and a fast fixture that is
      # merely SMALLER would test a different library.
      #
      # DRY RUN. There is no `--commit` in phase 19 and no environment variable
      # that makes one; the run rolls back and asserts the database is unchanged.
      - name: Rehearse the v1 to v2 upgrade (dry run, ci fixture)
        run: |
          set -euo pipefail
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "CREATE DATABASE libriant_upgrade TEMPLATE libriant_demo"
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "ALTER DATABASE libriant_upgrade SET TimeZone TO 'UTC'"
          URL=postgresql://libriant:libriant@localhost:5432/libriant_upgrade
          # THE 2.0 DEFAULTS, seeded HERE and not earlier.
          #
          # The 1.0 seed writes `tenant_settings` and the system roles through
          # the 1.0 client and never touches `lbr2`. The 2.0 defaults — the
          # always-open calendar, the five policies, the wildcard `rule-default`,
          # the branch, location and item type — were written only by
          # `TenantProvisioningService`, inside the API, when a library signs up.
          # Nothing outside the API wrote them, so CI's tenant had 124 lbr2
          # tables and no circulation policy, and the upgrade refuses that —
          # correctly, because an upgrade that seeded its own defaults would be
          # inventing a library's policy rather than carrying one forward.
          #
          # Seeding them back in the `demo` steps above does NOT work: the smoke
          # suite runs between there and here, and its teardown TRUNCATEs
          # `branches`, `calendars`, `circulation_rules` and all five policy
          # tables — by design, so one module cannot leave rows for the next.
          # The template copy would then carry the truncation, not the seed.
          #
          # So the rehearsal seeds the database it actually runs against, which
          # is also the truer rehearsal: a real tenant is provisioned first and
          # upgraded afterwards.
          pnpm tenant:seed:defaults:v2 --url "$URL"
          pnpm tsx scripts/seed-v1-fixture.ts --url "$URL" --profile ci
          pnpm tsx scripts/tenant-upgrade-v2.ts --url "$URL" --slug demo --report

      # A rehearsal that could not fail would prove nothing. One deliberately
      # corrupted row — a request pointing at a book that does not exist, which
      # 1.0's own foreign keys make impossible — must be REFUSED by name, and the
      # database must be untouched afterwards.
      - name: A corrupted fixture aborts, and the database is unchanged
        run: |
          set -euo pipefail
          URL=postgresql://libriant:libriant@localhost:5432/libriant_upgrade
          BEFORE=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_upgrade -tAc \
            "SELECT (SELECT count(*) FROM public.books)||','||(SELECT count(*) FROM lbr2.patrons)")
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_upgrade -c "
            SET session_replication_role = replica;
            INSERT INTO public.reservations
              (id,\"bookId\",\"memberId\",\"placedAt\",\"queuePosition\",status,\"customFields\",\"createdAt\",\"updatedAt\")
            VALUES ('ci-corrupt','no-such-book','no-such-member',now(),1,'queued','{}',now(),now());"
          if pnpm tsx scripts/tenant-upgrade-v2.ts --url "$URL" --slug demo; then
            echo "✗ the upgrade accepted a dangling reference"; exit 1
          fi
          AFTER=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_upgrade -tAc \
            "SELECT (SELECT count(*) FROM public.books)||','||(SELECT count(*) FROM lbr2.patrons)")
          [ "$BEFORE" = "$AFTER" ] || { echo "✗ the database changed: $BEFORE -> $AFTER"; exit 1; }
          echo "✓ refused, and the database is byte-identical ($AFTER)"

      # THE CUTOVER ITSELF, COMMITTED AND THEN UNDONE (2.0 phase 20b).
      #
      # Every step above rehearses and rolls back, which proves the copy-forward
      # and the 42 assertions and nothing about the two statements that actually
      # cut a library over. Those are the promotion and the six extension moves,
      # and their failure mode is silent: an extension left in `v1_archive` makes
      # `DROP SCHEMA v1_archive CASCADE` delete live 2.0 columns, indexes and
      # constraints, announced as a NOTICE that ON_ERROR_STOP does not catch.
      #
      # So this commits on a disposable database, asserts the shape a real
      # library would be left in, drops the archive to prove that is now safe,
      # and then rolls the whole thing back and reads the 1.0 library out again.
      # A separate copy from the rehearsal above, because that one has a
      # deliberately corrupted row in it.
      - name: Cut over for real, drop the archive, and roll back
        run: |
          set -euo pipefail
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "CREATE DATABASE libriant_cutover TEMPLATE libriant_demo"
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "ALTER DATABASE libriant_cutover SET TimeZone TO 'UTC'"
          URL=postgresql://libriant:libriant@localhost:5432/libriant_cutover
          pnpm tenant:seed:defaults:v2 --url "$URL"
          pnpm tsx scripts/seed-v1-fixture.ts --url "$URL" --profile ci

          # --commit alone must refuse. A cutover that happens because somebody
          # forgot an argument is the failure this guard exists for.
          if pnpm tsx scripts/tenant-upgrade-v2.ts --url "$URL" --slug demo --commit; then
            echo "✗ --commit cut over without --yes"; exit 1
          fi
          echo "✓ --commit alone refuses"

          pnpm tsx scripts/tenant-upgrade-v2.ts --url "$URL" --slug demo --commit --yes --report

          q() { PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_cutover -tAc "$1"; }
          [ "$(q "SELECT count(*) FROM information_schema.tables WHERE table_schema='v1_archive' AND table_name='books'")" = 1 ] \
            || { echo "✗ 1.0 is not readable in v1_archive"; exit 1; }
          [ "$(q "SELECT count(*) FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace WHERE n.nspname<>'public' AND e.extname<>'plpgsql'")" = 0 ] \
            || { echo "✗ an extension was left outside public"; exit 1; }
          [ "$(q "SELECT count(*) FROM patrons")" = 500 ] \
            || { echo "✗ patrons are not readable unqualified after the promotion"; exit 1; }
          echo "✓ committed: 2.0 in public, 1.0 in v1_archive, extensions rehomed"

          # The archive must now be droppable WITHOUT taking 2.0 data with it.
          # This is the assertion the whole extension-relocation exists for, and
          # it is checked by doing it rather than by reasoning about it.
          q "DROP SCHEMA v1_archive CASCADE" >/dev/null
          [ "$(q "SELECT count(*) FROM patrons WHERE email IS NOT NULL OR email IS NULL")" = 500 ] \
            || { echo "✗ dropping the archive took patron data with it"; exit 1; }
          [ "$(q "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('bib_records_search_trgm','patrons_search_trgm')")" = 2 ] \
            || { echo "✗ dropping the archive took the search indexes"; exit 1; }
          [ "$(q "SELECT count(*) FROM pg_constraint WHERE contype='x' AND conname LIKE '%no_overlap'")" = 3 ] \
            || { echo "✗ dropping the archive took the no-overlap constraints"; exit 1; }
          echo "✓ the archive dropped cleanly and took nothing from 2.0"

      # The rollback, on its own copy — the one above dropped its archive, and a
      # rollback needs the archive it restores from.
      - name: The rollback restores a working 1.0 library
        run: |
          set -euo pipefail
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "CREATE DATABASE libriant_rollback TEMPLATE libriant_demo"
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control \
            -c "ALTER DATABASE libriant_rollback SET TimeZone TO 'UTC'"
          URL=postgresql://libriant:libriant@localhost:5432/libriant_rollback
          pnpm tenant:seed:defaults:v2 --url "$URL"
          pnpm tsx scripts/seed-v1-fixture.ts --url "$URL" --profile ci
          pnpm tsx scripts/tenant-upgrade-v2.ts --url "$URL" --slug demo --commit --yes

          # Without --yes it must refuse, like the cutover.
          if pnpm tenant:rollback:v2 --url "$URL"; then
            echo "✗ the rollback ran without --yes"; exit 1
          fi
          echo "✓ the rollback alone refuses"

          pnpm tenant:rollback:v2 --url "$URL" --yes

          r() { PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_rollback -tAc "$1"; }
          COUNTS=$(r "SELECT (SELECT count(*) FROM books)||','||(SELECT count(*) FROM members)||','||(SELECT count(*) FROM loans)")
          [ "$COUNTS" = "1000,500,800" ] || { echo "✗ the restored library is wrong: $COUNTS"; exit 1; }
          # §6's recipe would have taken these. That is why the script exists.
          [ "$(r "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='members' AND column_name='email'")" = 1 ] \
            || { echo "✗ the rollback destroyed members.email"; exit 1; }
          [ "$(r "SELECT count(*) FROM pg_extension WHERE extname <> 'plpgsql'")" = 6 ] \
            || { echo "✗ the rollback destroyed the extensions"; exit 1; }
          echo "✓ 1.0 restored whole: $COUNTS, with members.email and all six extensions"

          # Twice must refuse, or it drops the library it just restored.
          if pnpm tenant:rollback:v2 --url "$URL" --yes; then
            echo "✗ a second rollback was allowed"; exit 1
          fi
          echo "✓ a second rollback refuses"

      # The Prisma schema and the migrations must still describe the same
      # database. They drift in one direction almost every time and always
      # silently: a model or field is added, `prisma generate` emits a client
      # for it, TypeScript compiles, the code reads a column that exists on no
      # real database, and nothing fails until deploy.
      #
      # This replays every migration into a throwaway database and compares.
      # Statements that DROP are the expected surplus — GIN trigram indexes, a
      # text_pattern_ops index, a generated tsvector column — and each is
      # allowlisted with a reason. A statement that CREATEs or ADDs is the
      # missing migration, and fails.
      #
      # It lives here rather than in `check:all` because it needs a Postgres to
      # build the shadow database in, and `check:all` must stay runnable on a
      # laptop with nothing up. It REFUSES to run without one rather than
      # skipping.
      # Prisma builds the comparison inside an EXISTING, empty database and
      # drops what it created afterwards; it will not create the database
      # itself. Guarded the same way libriant_demo is above, because CREATE
      # DATABASE cannot run inside a transaction.
      - name: Create the shadow database for the drift check
        run: |
          if ! PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'libriant_shadow'" | grep -q 1; then
            PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "CREATE DATABASE libriant_shadow"
          fi
          # See the demo-database step above. The shadow database is where
          # `check:schema-drift` replays every migration, so its partition bounds
          # have to land on UTC day boundaries like a real tenant's.
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c \
            "ALTER DATABASE libriant_shadow SET TimeZone TO 'UTC'"

      - name: Schema and migrations still agree
        run: pnpm check:schema-drift
        env:
          SHADOW_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_shadow

  # ---------------------------------------------------------------------------
  # supply-chain-03 + supply-chain-06.
  #
  # The audit's own acceptance test for supply-chain-03 was "verify with
  # `docker image inspect` that eslint/vitest/turbo/next are gone". Nothing in
  # this repo built the images (supply-chain-06), so nothing could run that
  # check — and the previous attempt at the finding shipped a Dockerfile change
  # whose effect no one measured. This job is that check, plus the half that
  # matters more: a pruned image that cannot boot is worse than a fat one, so it
  # runs the real image against real Postgres and Redis and makes it serve.
  # ---------------------------------------------------------------------------
  image-contents:
    name: Production images ship no dev tooling, and still boot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: libriant_control
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U libriant -d libriant_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job never needed Node — it only shells out to docker. The size
      # budget is a Node script because the numbers and the argument for them
      # belong in a committed file with a diff, not in an env var. No `cache:`
      # key here: the script is dependency-free and this job runs no install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: libriant-api:verify

      - name: Build the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: libriant-web:verify

      # The literal assertion the finding asked for. `ls node_modules/.pnpm`
      # is the whole installed set, so a package that survives anywhere in the
      # image — including as a transitive dependency of something else — shows
      # up here.
      - name: No dev tooling in either production image
        run: |
          set -euo pipefail
          # "Dev tooling" is per-image, because `next` is not one thing in both.
          # It is build-only in the API image and the FRAMEWORK the web image
          # exists to run. This step used to ban it in both and then, four lines
          # later, assert the web image still contained it — two conditions that
          # cannot hold at once, so the job could only ever have gone green if
          # the web image were broken. It never ran until now: the image build
          # ahead of it was failing on corepack, so the contradiction shipped
          # unnoticed.
          shared='eslint|vitest|turbo|prettier|typescript-eslint|supertest|@typescript-eslint\+|@eslint\+|@vitest\+|rolldown|vite'
          fail=0
          for img in libriant-api:verify libriant-web:verify; do
            case "$img" in
              # `next` and `@next/*` belong in the web image and nowhere else.
              *-web:verify) banned="^($shared)@" ;;
              *)            banned="^($shared|next|@next\+)@" ;;
            esac
            echo "── $img"
            hits=$(docker run --rm --entrypoint sh "$img" -c \
              "ls node_modules/.pnpm 2>/dev/null | grep -E '$banned' || true")
            if [ -n "$hits" ]; then
              echo "✗ $img still ships dev tooling:"; echo "$hits"; fail=1
            else
              echo "✓ clean"
            fi
          done
          # And the other direction: the web image must still HAVE Next.js. A
          # prune that removed it would leave this step green on the check above
          # while the container could not start.
          docker run --rm --entrypoint sh libriant-web:verify -c \
            'ls node_modules/.pnpm | grep -qE "^next@"' \
            || { echo "✗ the web image lost Next.js"; fail=1; }
          exit $fail

      # The prune keeps three devDependencies on purpose because containers
      # execute them. If any of these stops resolving, the stack does not start
      # — and that failure would otherwise only surface on a production deploy.
      - name: The kept entrypoints still resolve inside the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh libriant-api:verify -c \
            './apps/api/node_modules/.bin/tsx --version'
          docker run --rm --entrypoint sh libriant-api:verify -c \
            './packages/db-control/node_modules/.bin/prisma --version' >/dev/null
          docker run --rm --entrypoint sh libriant-api:verify -c \
            'node -e "import(\"marked\").then(()=>console.log(\"marked ok\"))"'
          docker run --rm --entrypoint sh libriant-web:verify -c \
            './apps/web/node_modules/.bin/next --version'

      # `docker image ls` takes AT MOST ONE reference — passing two is a usage
      # error, not a filter, and the step exited 1 with
      # `'docker image ls' requires at most 1 argument`. It had never run: every
      # earlier attempt died before reaching it, first on the corepack build and
      # then on the dev-tooling check, so a one-line step that could not work
      # sat in the file unnoticed. Fixing it finally produced a figure —
      # 1.18GB and 1.03GB — and that is where the usefulness of a total ends.
      #
      # A total says an image is too big. It does not say which layer to look
      # at, and `docker history` has never once been run against these images,
      # so nobody in this project has ever seen where the bytes are. That is the
      # diagnostic every future size question starts from, so it now prints on
      # every run, biggest layer first, with the command that created it.
      #
      # `if: always()`: the run you most want a breakdown on is the run that
      # failed. If a build failed there is no image, and the script says so and
      # exits 0 rather than stacking a second red X on the real failure.
      - name: Image size and layer breakdown
        if: always()
        run: |
          set -euo pipefail
          node scripts/check-image-size.mjs --report

      - name: Postgres extensions
        run: |
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "

      # Migrate + seed FROM INSIDE THE PRUNED IMAGE. This is the compose
      # `migrate` one-shot's job, and it is the step a `pnpm install --prod`
      # would have silently destroyed.
      - name: The pruned image can migrate and seed the control plane
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e CONTROL_DATABASE_URL=postgresql://libriant:libriant@localhost:5432/libriant_control \
            -e PG_SUPERUSER_URL=postgresql://libriant:libriant@localhost:5432/libriant_control \
            --entrypoint sh libriant-api:verify \
            -c 'pnpm db:migrate:deploy && pnpm db:seed'

      # The web image had never been booted by anything, here or anywhere. This
      # job asserted that `next --version` resolves inside it and that it still
      # contains a `next@` package directory — which proves Next is INSTALLED,
      # not that it STARTS. Every web container that has ever run did so on a
      # production deploy.
      #
      # That gap is why the size work stopped where it did: `output: 'standalone'`
      # is worth ~150–200 MB and dropping @next/swc another ~85 MB, and neither
      # can be taken responsibly while the only thing standing between a bad
      # prune and a library is a `grep` for a directory name. This step is the
      # prerequisite for both.
      #
      # /api/healthz is deliberately the probe: it is `force-dynamic` and touches
      # no dependency, so it proves the Next server itself is up without needing
      # the API, Postgres or Redis alongside it.
      - name: The pruned web image starts and serves
        run: |
          set -euo pipefail
          docker run -d --name web-verify --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            libriant-web:verify
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3000/api/healthz; then
              echo "✓ the pruned web image booted and served /api/healthz after ${i}s"
              docker rm -f web-verify >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "✗ the pruned web image never served a request:"
          docker logs web-verify
          docker rm -f web-verify >/dev/null
          exit 1

      - name: The pruned API image starts and serves
        run: |
          set -euo pipefail
          docker run -d --name api-verify --network host \
            -e CONTROL_DATABASE_URL=postgresql://libriant:libriant@localhost:5432/libriant_control \
            -e PG_SUPERUSER_URL=postgresql://libriant:libriant@localhost:5432/libriant_control \
            -e REDIS_URL=redis://localhost:6379 \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef \
            -e ADMIN_SESSION_SECRET=ci-only-admin-secret-0123456789abcdef \
            -e IMPERSONATION_SECRET=ci-only-imp-secret-0123456789abcdefgh \
            -e HASH_PEPPER=ci-only-pepper-0123456789abcdefghijklmn \
            -e STORAGE_SIGNING_SECRET=ci-only-storage-secret-0123456789abcd \
            -e MFA_MASTER_KEY=0011223344556677889900112233445566778899001122334455667788990011 \
            -e TENANT_DB_MASTER_KEY=aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899 \
            -e STRIPE_DRIVER=fake \
            -e EMAIL_DRIVER=console \
            -e STORAGE_ROOT=/tmp/libriant-storage \
            libriant-api:verify
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3001/metrics; then
              echo "✓ the pruned API image booted and served /metrics after ${i}s"
              docker rm -f api-verify >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "✗ the pruned API image never served a request:"
          docker logs api-verify
          docker rm -f api-verify >/dev/null
          exit 1

      # supply-chain-03 was closed on two claims: that the production image
      # ships no dev tooling, and that it is smaller. The steps above check the
      # first claim. Nothing has ever checked the second one, and a 1.18GB image
      # is what "nothing ever checked it" looks like. A number nobody enforces
      # drifts, so the band lives in scripts/check-image-size.mjs, where moving
      # it costs a commit and a paragraph rather than an env-var bump.
      #
      # LAST in the job, deliberately. Four steps here had never executed until
      # 2026-08-27, each hidden behind the failure before it, and a size gate
      # placed ahead of the boot test would hide the boot test — the one that
      # matters. A big image is a nuisance; an image that does not start is an
      # outage. So the budget only gets to speak after the image has proved it
      # migrates, seeds, boots and serves.
      - name: Image size stays inside its budget
        run: |
          set -euo pipefail
          node scripts/check-image-size.mjs --enforce
