name: verify

# Reusable validation gate — the SINGLE SOURCE OF TRUTH for "is this commit
# sound". Called by ci.yml (push/PR feedback), deploy.yml (production gate) and
# desktop-release.yml (desktop gate) so all three enforce the EXACT same checks
# and can never drift. Every job uses inline test-only values, so no secrets are
# needed and the gate is safe to call from any workflow.
on:
  workflow_call:

# Least privilege: the gate only ever reads the repo (checkout + install). It
# never publishes images or releases — those live in the calling workflows.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (typecheck + translations + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients (control-plane + tenant)
        run: pnpm db:generate
        env:
          # Generation doesn't actually connect; placeholder URLs silence the warnings.
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Translation parity (en + el catalogs in lock-step)
        run: pnpm check:translations

      # The images are never built in CI, so a Dockerfile/package.json pnpm
      # mismatch is otherwise invisible until the migrate one-shot fails on a
      # network it has no egress from — which is exactly what happened.
      - name: pnpm pins match across package.json and the Dockerfiles
        run: pnpm check:pnpm-pins

      - name: Asset manifest integrity (every slot exists; every code ref listed)
        run: pnpm check:assets

      # Fails only on an author-facing note escaping into a published legal
      # page. The unfilled-provider-details list it prints is a readiness
      # report, not a gate — nobody in this repository can invent a GEMI number.
      - name: Legal documents publish nothing addressed to their author
        run: pnpm check:legal

      # The edge is the only thing between the internet and an API that trusts
      # X-Real-IP. A `handle /webhooks/*` block shipped with no origin guard and
      # nothing noticed, because nothing looked.
      - name: Every Caddy backend route sits behind the origin guard
        run: pnpm check:caddy

      # And that the config is loadable at all — a syntax error here takes the
      # whole edge down on deploy, and no job built or parsed it before now.
      - name: Caddyfile adapts and validates
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: TypeScript typecheck (all packages)
        run: pnpm typecheck

      - name: ESLint (all packages)
        run: pnpm lint

      - name: Prettier formatting
        run: pnpm format:check

      # The marketing site is generated, and build.ts carries two gates that
      # nothing else exercises: the [PLACEHOLDER] refusal and the copy lint.
      # Strict (not --draft) so a placeholder or a banned claim fails the build.
      - name: Build the marketing site
        run: pnpm --filter @libriant/site build

      - name: Check the site actually emitted
        run: |
          test -s apps/site/dist/index.html
          test -s apps/site/dist/en/index.html
          test -s apps/site/dist/404.html
          test -s apps/site/dist/en/404.html
          test -s apps/site/dist/styles.css

  unit-tests:
    name: Unit tests (vitest, mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm db:generate
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Unit tests
        run: pnpm --filter @libriant/api exec vitest run --project unit

  # The verify gate ran typecheck, lint, prettier, translations, assets, unit,
  # integration, migrations and the DR drill — and zero supply-chain checks.
  # Combined with --frozen-lockfile everywhere, that meant the resolved tree was
  # frozen forever with no mechanism to notice a disclosure against it.
  supply-chain:
    name: Supply chain (advisories + action pinning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking at `critical`, not `high`: one high is open today against
      # deepmerge-ts, reached only through the Prisma CLI, and gating on it
      # would wedge every merge behind an upstream release. The full report
      # below still surfaces it on every run, so it cannot be forgotten —
      # raise this to `high` the moment that advisory clears.
      - name: Advisories (blocking — critical in the production tree)
        run: pnpm audit --prod --audit-level=critical

      - name: Advisories (full report, non-blocking)
        if: always()
        run: pnpm audit || true

      # Belt and braces around the pins themselves: Dependabot proposes SHA
      # bumps as PRs, and a PR is exactly where a floating tag could be
      # reintroduced by hand.
      - name: Every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          floating=$(grep -rn 'uses: ' .github/workflows/ \
            | grep -v '@[0-9a-f]\{40\}' \
            | grep -v 'uses: \./\.github/' || true)
          if [ -n "$floating" ]; then
            echo "::error::Unpinned action reference(s) — a mutable tag can be repointed by its owner:"
            echo "$floating"
            exit 1
          fi
          echo "All external action references are SHA-pinned."

  integration-tests:
    name: Integration tests (real postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: libriant_control
          LANG: el_GR.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U libriant -d libriant_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
      PG_SUPERUSER_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-test
      ADMIN_SESSION_SECRET: ci-only-test
      IMPERSONATION_SECRET: ci-only-test
      # Quoted: the value is all digits, which unquoted YAML coerces to a
      # float (1.12e+61) — the app then rejects it as non-hex.
      MFA_MASTER_KEY: '0011223344556677889900112233445566778899001122334455667788990011'
      STRIPE_DRIVER: fake
      STORAGE_ROOT: /tmp/libriant-test-storage
      EMAIL_DRIVER: console
      # tsx + decorators (NestJS DI) needs the API's tsconfig pinned.
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/apps/api/tsconfig.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Postgres extensions
        run: |
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "

      - name: Generate Prisma clients
        run: pnpm db:generate

      - name: Apply control-plane migrations
        run: pnpm db:migrate:deploy

      - name: Seed control-plane (cells + plans + feature catalog)
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm --filter @libriant/api exec vitest run --project integration

  db-migration:
    name: Apply control-plane + tenant migrations against real Postgres
    runs-on: ubuntu-latest
    services:
      # Dedicated, throwaway cluster for the DR drill. Separate from the
      # service below because the drill dumps and destroys an ENTIRE cluster.
      # Target for the cross-cluster drill: independently initialised with a
      # DIFFERENT superuser password, which is the whole point — it proves what
      # a pg_dumpall restore does to a rebuilt host's credentials.
      postgres-drill-target:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: target-differs-on-purpose
          POSTGRES_DB: postgres
          # trust, deliberately. The dump replaces this role's password with the
          # SOURCE's in its prologue, and every `\connect` after that
          # re-authenticates — so over TCP with scram the rest of the stream
          # cannot connect and the restore dies half-done. Production never
          # meets this because it restores over the container's local socket;
          # a service container has no socket to offer, so trust is the
          # equivalent. The password is still SET, so the drill can still prove
          # the verifier was swapped; the live password-flip assertions detect
          # trust and skip themselves rather than pass vacuously.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U libriant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-drill:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U libriant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libriant
          POSTGRES_PASSWORD: libriant
          POSTGRES_DB: libriant_control
          LANG: el_GR.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U libriant -d libriant_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # The seed + tenant scripts import the generated Prisma clients, so they
      # must be generated first (the other jobs do this too). Generation
      # doesn't connect — the placeholder URLs just silence the warnings.
      - name: Generate Prisma clients (control-plane + tenant)
        run: pnpm db:generate
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Create + extend both DBs (control + demo tenant)
        run: |
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "
          # `\gexec` is a psql meta-command and is NOT honored by `psql -c`
          # (that path only runs plain SQL), so guard the create in the shell.
          if ! PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'libriant_demo'" | grep -q 1; then
            PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -c "CREATE DATABASE libriant_demo"
          fi
          PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_demo -c "
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS citext;
          "

      - name: Apply migration
        run: pnpm db:migrate:deploy
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Seed control-plane DB
        run: pnpm db:seed
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Verify expected row counts
        run: |
          COUNTS=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -t -c "
            SELECT
              (SELECT count(*) FROM cells)              || ',' ||
              (SELECT count(*) FROM plan_features)      || ',' ||
              (SELECT count(*) FROM plans)              || ',' ||
              (SELECT count(*) FROM plan_feature_values);
          " | tr -d ' ')
          echo "Counts: $COUNTS"
          [ "$COUNTS" = "1,15,6,90" ] || { echo "Expected 1,15,6,90 — seed drifted"; exit 1; }

      - name: Re-run seed (must remain idempotent)
        run: pnpm db:seed
        env:
          CONTROL_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_control

      - name: Verify row counts unchanged after re-seed
        run: |
          COUNTS=$(PGPASSWORD=libriant psql -h localhost -U libriant -d libriant_control -t -c "
            SELECT
              (SELECT count(*) FROM cells)              || ',' ||
              (SELECT count(*) FROM plan_features)      || ',' ||
              (SELECT count(*) FROM plans)              || ',' ||
              (SELECT count(*) FROM plan_feature_values);
          " | tr -d ' ')
          echo "Counts: $COUNTS"
          [ "$COUNTS" = "1,15,6,90" ] || { echo "Seed is not idempotent"; exit 1; }

      # Schema migrations are NOT replay-safe and are not meant to be — Prisma
      # runs each exactly once. Data migrations are different: one that upserts
      # seeded rows can look fine on the first run and duplicate or drift on the
      # second, and nothing else here would notice. `ON CONFLICT` is the precise
      # marker for that class, so any future data migration joins this gate on
      # its own.
      - name: Replay data migrations (must be idempotent)
        run: |
          set -euo pipefail
          export PGPASSWORD=libriant
          Q="SELECT p.slug, p.\"monthlyPriceCents\", p.\"annualPriceCents\", p.\"stripePriceId\",
                    p.\"stripeAnnualPriceId\", p.\"sortOrder\", p.id,
                    v.\"featureKey\", v.\"valueInt\", v.\"valueBool\"
             FROM plans p LEFT JOIN plan_feature_values v ON v.\"planId\" = p.id
             ORDER BY p.slug, v.\"featureKey\";"
          psql -h localhost -U libriant -d libriant_control -t -A -F',' -c "$Q" > /tmp/plans-before.csv
          FOUND=0
          for f in $(grep -l 'ON CONFLICT' packages/db-control/prisma/migrations/*/migration.sql); do
            echo "replaying $f"
            FOUND=1
            psql -h localhost -U libriant -d libriant_control -v ON_ERROR_STOP=1 -q -f "$f"
          done
          [ "$FOUND" = "1" ] || { echo "No data migrations matched — the grep marker has drifted"; exit 1; }
          psql -h localhost -U libriant -d libriant_control -t -A -F',' -c "$Q" > /tmp/plans-after.csv
          diff /tmp/plans-before.csv /tmp/plans-after.csv \
            || { echo "A data migration is not idempotent — plan state changed on replay"; exit 1; }
          echo "Data migrations are replay-safe."

      # An untested backup is not a backup. This exercises the real
      # backup.sh → restore.sh pipeline against the service container and
      # asserts the restored cluster matches the source, because the restore
      # path was silently destroying every database and restoring none.
      - name: DR drill (backup → restore round trip)
        run: |
          set -euo pipefail
          # The client must match the server major (postgres:16-alpine here);
          # a newer pg_dumpall emits settings 16 rejects. See the script header.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          # Port 5433, NOT the shared service on 5432: pg_dumpall is
          # cluster-wide and the drill destroys everything it dumped, which
          # would take libriant_control and libriant_demo — and every step
          # after this one — with it.
          PGHOST=localhost PGPORT=5433 PGUSER=libriant PGPASSWORD=libriant \
            pnpm dr:drill

      # The rebuilt-host case: restore this dump into a SECOND cluster whose
      # superuser password differs. It is what caught the template1 hazard —
      # a dump from an already-restored cluster cannot be restored onto a
      # pristine one, which is precisely the DR scenario.
      - name: DR drill — cross-cluster (rebuilt-host restore)
        run: |
          set -euo pipefail
          PGHOST=localhost PGPORT=5433 PGUSER=libriant PGPASSWORD=libriant \
          TARGET_PGHOST=localhost TARGET_PGPORT=5434 \
          TARGET_PGPASSWORD=target-differs-on-purpose \
            pnpm dr:drill --cross-cluster

      - name: Apply tenant migration to libriant_demo
        run: pnpm tenant:migrate:deploy
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Seed tenant defaults
        run: pnpm tenant:seed:defaults
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo

      - name: Run tenant smoke test (catalog → loan → reservation → custom collection)
        run: pnpm tenant:smoke
        env:
          TENANT_DATABASE_URL: postgresql://libriant:libriant@localhost:5432/libriant_demo
