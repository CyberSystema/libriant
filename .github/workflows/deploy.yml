name: deploy

# Build images on push to main, then deploy them to every host in
# `infra/deploy/fleet.yml`. The deploy job is intentionally per-host with
# `fail-fast: false` so one cell failing doesn't roll back others — the
# topology assumes hosts are independent (different DB host per cell,
# eventually). Workflow can also be triggered manually from the Actions
# tab for hotfixes.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      # The marketing site is generated from these at build time
      # (apps/site/build.ts reads locales/<lang>/landing.json and assets/icons),
      # so a copy or icon change must trigger a deploy like any code change.
      - 'locales/**'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override the tag to deploy (default: short SHA).'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------
  # verify — gate the whole deploy on the SAME checks CI runs, via the reusable
  # verify workflow (one source of truth — CI, deploy, and the desktop release
  # can never drift). Required status checks aren't available on this GitHub
  # plan, so a red build must be blocked HERE rather than via branch protection;
  # `build` (and therefore deploy) does not start unless this passes.
  #
  # verify.yml exercises the FULL migrate/seed/tenant path + integration suite
  # against an ephemeral Postgres + Redis — the same commands prod-bootstrap.sh
  # runs live on every deploy — so a schema/seed defect is blocked before it can
  # reach a host (CFG-02).
  # ---------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  # ---------------------------------------------------------------------
  # build — produce api + web images, push to GHCR.
  #
  # CFG-01: skip this job entirely when a tag override is supplied. A
  # workflow_dispatch with `image_tag` set is a ROLLBACK to a known-good,
  # already-pushed immutable image — rebuilding here would push the current
  # (possibly broken) HEAD under that historical tag, clobbering the artifact
  # the operator is trying to restore and poisoning :latest. On rollback we
  # pull the existing tag instead of building anything.
  # ---------------------------------------------------------------------
  build:
    name: Build & push images
    needs: verify
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # No tag override reaches this job (gated by `if:` above), so the tag
          # is always the freshly-built HEAD short SHA.
          TAG="${GITHUB_SHA::12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR image paths must be lowercase; the owner login may not be.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------------------------------------------------------------------
  # plan — read fleet.yml and emit a matrix of hosts.
  # ---------------------------------------------------------------------
  plan:
    name: Resolve fleet
    runs-on: ubuntu-latest
    # CFG-01: depend on verify + build but tolerate a SKIPPED build (rollback
    # path), where no new image is produced. Still require verify to have
    # passed and build, if it ran, to have succeeded.
    needs: [verify, build]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    outputs:
      hosts: ${{ steps.read.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          # Parse the YAML host list into a JSON matrix the deploy job
          # can fan out across. (PyYAML ships on the runner, but install
          # defensively so a missing module never blocks all deploys.)
          python3 -m pip install --quiet pyyaml || true
          python3 -c "
          import json, sys, yaml
          fleet = yaml.safe_load(open('infra/deploy/fleet.yml'))
          print('hosts=' + json.dumps([h for h in fleet.get('hosts', [])]))
          " >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # deploy — fan out: one job per host. Failures don't cancel others.
  #
  # Guard rail: if a deploy passes the verify gate but the new stack fails its
  # post-deploy health check, the host is AUTOMATICALLY rolled back to the image
  # it was running before — production never stays on a broken build — and the
  # run is still marked failed so the operator is alerted.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.host.name }}
    # CFG-01: tolerate a skipped build on the rollback path (see `plan`).
    needs: [verify, build, plan]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.plan.outputs.hosts) }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin host key (no trust-on-first-use)
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Use PINNED host keys from a secret. `ssh-keyscan` blindly trusts
          # whatever key answers, so a MITM of the runner→host path could
          # intercept a root-equivalent session that sources all prod secrets.
          # Capture the real keys once out-of-band (`ssh-keyscan host`) and store
          # them in the DEPLOY_KNOWN_HOSTS secret.
          #
          # CFG-05: validate the secret CONTENT, not the written file. Writing
          # an unset secret with `printf '%s\n'` produces a 1-byte (lone "\n")
          # file that passes `-s`, so the old guard was dead code — a forgotten
          # secret surfaced later as a generic "Host key verification failed"
          # mid-deploy instead of this clear diagnostic. Require at least one
          # real "ssh-" key line before trusting it.
          if ! printf '%s\n' "$KNOWN_HOSTS" | grep -q '\bssh-'; then
            echo "DEPLOY_KNOWN_HOSTS secret is empty or has no ssh-* host key — set it to the pinned SSH host keys (\`ssh-keyscan <host>\`)." >&2
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture rollback target (current running image)
        id: capture
        run: |
          # Record the api image tag currently running on the host so a failed
          # deploy can be auto-rolled-back to it. Read via compose labels so we
          # don't need to source .env.prod. A valid target is a 12-hex short SHA
          # (it maps to BOTH an immutable GHCR image and a commit to check out);
          # anything else (first deploy, :latest, a bare image id) safely
          # disables rollback for this run.
          PREV_TAG="$(ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE'
          set -euo pipefail
          img="$(docker ps --filter 'label=com.docker.compose.project=libriant' --filter 'label=com.docker.compose.service=api' --format '{{.Image}}' | head -n1)"
          printf '%s' "${img##*:}"
          REMOTE
          )"
          if printf '%s' "$PREV_TAG" | grep -qE '^[0-9a-f]{12}$'; then
            echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
            echo "Rollback target for ${{ matrix.host.name }}: $PREV_TAG"
          else
            echo "No valid rollback target for ${{ matrix.host.name }} (got '$PREV_TAG') — auto-rollback disabled this run."
          fi

      - name: Deploy (git sync + compose up)
        env:
          # CFG-01: on a rollback (workflow_dispatch with image_tag set) the
          # build job was skipped and produced no output, so resolve the tag
          # from the dispatch input. On a normal push it comes from `build`.
          # Every tag we publish is a 12-char short commit SHA, so the host can
          # map the deployed image's tag straight back to the commit to check
          # out — that keeps the running CODE identical to the running IMAGE
          # even on rollback (the old bug used github.sha = HEAD, which would
          # check out current code under the old image's tag).
          IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build.outputs.tag }}
        run: |
          # Deploy from the repo checkout the host already keeps at
          # /srv/libriant/app — the same layout + commands as the manual `dc`
          # flow, so manual and CI never diverge. `git reset --hard` deploys the
          # exact built commit (host-local edits to tracked files are
          # overwritten — keep customisations in .env.prod). The volume overlay
          # keeps all data on /mnt/libriant. The heredoc is UNQUOTED so only
          # ${IMAGE_TAG} expands on the runner; remote `$`-vars are escaped.
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<EOF
            set -euo pipefail
            cd /srv/libriant/app
            git fetch --quiet origin
            # Resolve the commit to deploy FROM the image tag (a short SHA), so
            # the checked-out scripts/migrations always match the image being
            # run — never current HEAD. (CFG-01)
            GIT_SHA="\$(git rev-parse --verify --quiet "${IMAGE_TAG}^{commit}" || true)"
            if [ -z "\$GIT_SHA" ]; then
              echo "Cannot resolve image tag '${IMAGE_TAG}' to a commit on this host — refusing to deploy." >&2
              exit 1
            fi
            git reset --hard "\$GIT_SHA"
            # Self-bootstrap secrets: generate any MISSING values in .env.prod
            # (idempotent — never overwrites existing, so POSTGRES_PASSWORD is
            # preserved). Operator-supplied bits (admin login) stay blank here;
            # set them once via an interactive run of the same script.
            bash scripts/ensure-env.sh --auto /srv/libriant/.env.prod
            set -a; . /srv/libriant/.env.prod; set +a
            export IMAGE_TAG="${IMAGE_TAG}"
            export COMPOSE_PROJECT_NAME=libriant
            export LIBRIANT_DATA_ROOT=/mnt/libriant
            FILES="-f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.volume.yml"
            # Reclaim disk BEFORE pulling fresh images. Every deploy pulls new
            # SHA-tagged api/web images; left unpruned they accumulate until the
            # disk fills — which has broken a deploy at the seed step with
            # "ENOSPC: no space left on device". Remove images that aren't used
            # by a container and are >72h old: in-use images are protected
            # regardless of age, so the running stack and recent tags (for fast
            # rollback) survive. Best-effort — cleanup never fails the deploy.
            docker image prune -af --filter 'until=72h' || true
            docker builder prune -f --filter 'until=72h' || true
            docker compose \$FILES pull
            # Validate the Caddyfile BEFORE anything is recreated. Two vhosts
            # claiming the same hostname is an adapter error, and without this
            # check the failure sequence is: \`up -d\` succeeds, \`caddy reload\`
            # fails, the fallback \`up -d --force-recreate caddy\` crash-loops,
            # and all three hosts go dark. With it, the deploy aborts and the
            # running stack keeps serving.
            if ! docker compose \$FILES run --rm --no-deps --entrypoint caddy caddy \\
                 validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "===== deploy aborted: Caddyfile is invalid =====" >&2
              exit 1
            fi
            # --force-recreate is deliberate: \`up -d\` alone only recreates a
            # container when compose decides the image/config changed, and with
            # the :latest / re-used tag that check can misfire — leaving the api
            # (or web) running OLD code even though \`pull\` fetched the new image.
            # Forcing recreation guarantees every deploy actually swaps in the
            # freshly-pulled image. (Caddy is reloaded separately below.)
            # The one-shot \`migrate\` service is a hard prerequisite (others gate
            # on service_completed_successfully). \`up -d\` runs detached, so when
            # migrate exits non-zero compose reports only "service migrate didn't
            # complete: exit 1" — the container's actual prisma/seed error is NOT
            # streamed here. On failure, dump the migrate logs (and container
            # status) before bailing, so the real cause is visible in CI instead
            # of an opaque exit code.
            if ! docker compose \$FILES up -d --remove-orphans --force-recreate; then
              echo "===== deploy failed: dumping one-shot 'migrate' logs =====" >&2
              docker compose \$FILES logs --no-color --timestamps migrate 2>&1 | tail -n 200 >&2 || true
              echo "===== container status =====" >&2
              docker compose \$FILES ps >&2 || true
              exit 1
            fi
            # Caddy's config is a bind-mount, so \`up -d\` won't restart it when
            # only the Caddyfile content changed. Reload it explicitly (graceful,
            # zero-downtime) so Caddyfile edits actually take effect; fall back to
            # a recreate if the running config can't be reloaded.
            docker compose \$FILES exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose \$FILES up -d --force-recreate caddy
          EOF

      - name: Wait for health
        run: |
          # Poll the ORIGIN's /healthz on the host itself — deliberately NOT
          # through Cloudflare. Cloudflare's managed challenge / bot protection
          # 403s automated requests (cf-mitigated: challenge), so a public curl
          # can never pass even when the site is perfectly healthy for browsers.
          # A deploy's success must reflect "the new code came up", not the CDN's
          # bot policy. Running over the existing SSH session also means this is
          # immune to how the edge firewall is locked down. Quoted heredoc, so
          # everything evaluates on the host. (Public reachability is a separate
          # concern, monitored by uptime checks — not the deploy gate.)
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE'
            set -euo pipefail
            proj=libriant
            # A12-03: the edge /healthz is a STATIC 200 (Caddy's :80 block) — it
            # stays green even if api/web/worker crashed after `up`, so it can't
            # be the only gate or a broken stack deploys "successfully" and never
            # rolls back. Also assert each app container's OWN healthcheck (which
            # probes /readyz — real DB+Redis liveness) reports `healthy`. Resolve
            # containers by compose labels (naming-scheme agnostic).
            svc_health() {
              local id
              id="$(docker ps -q \
                --filter "label=com.docker.compose.project=$proj" \
                --filter "label=com.docker.compose.service=$1" | head -n1)"
              [ -n "$id" ] || { echo "missing"; return; }
              docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id" 2>/dev/null || echo "missing"
            }
            deadline=$(( $(date +%s) + 150 ))
            edge=""; api=""; web=""; worker=""
            while [ "$(date +%s)" -lt "$deadline" ]; do
              # Require a real 200 — not a 3xx. The plaintext :80 /healthz block
              # answers 200; if Caddy were still on an old config it would 301 to
              # HTTPS, which must NOT count as healthy.
              edge="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/healthz 2>/dev/null || true)"
              api="$(svc_health api)"; web="$(svc_health web)"; worker="$(svc_health worker)"
              if [ "$edge" = "200" ] && [ "$api" = "healthy" ] && [ "$web" = "healthy" ] && [ "$worker" = "healthy" ]; then
                echo "origin + app containers healthy"
                exit 0
              fi
              echo "waiting for health… edge=$edge api=$api web=$web worker=$worker"
              sleep 5
            done
            echo "stack did not become healthy within 150s (edge=$edge api=$api web=$web worker=$worker)" >&2
            docker ps --format 'table {{.Names}}\t{{.Status}}' || true
            exit 1
          REMOTE

      - name: Roll back to previous image on failure
        # Runs only when an earlier step in THIS deploy job failed (a broken
        # deploy or a failed health check) AND we captured a valid previous tag.
        if: failure() && steps.capture.outputs.prev_tag != ''
        env:
          PREV_TAG: ${{ steps.capture.outputs.prev_tag }}
        run: |
          echo "::error::${{ matrix.host.name }} deploy/health failed — rolling back to ${PREV_TAG} (production must not stay on a broken build)."
          # Unquoted heredoc: ${PREV_TAG} expands on the runner; remote `$`-vars
          # are escaped to run on the host.
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<EOF
            set -euo pipefail
            cd /srv/libriant/app
            GIT_SHA="\$(git rev-parse --verify --quiet "${PREV_TAG}^{commit}" || true)"
            if [ -z "\$GIT_SHA" ]; then
              echo "cannot resolve ${PREV_TAG} to a commit on this host — MANUAL ROLLBACK NEEDED" >&2
              exit 1
            fi
            git reset --hard "\$GIT_SHA"
            set -a; . /srv/libriant/.env.prod; set +a
            export IMAGE_TAG="${PREV_TAG}"
            export COMPOSE_PROJECT_NAME=libriant
            export LIBRIANT_DATA_ROOT=/mnt/libriant
            FILES="-f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.volume.yml"
            docker compose \$FILES pull
            # Image rollback restores the previous CODE + IMAGE but does NOT
            # revert DB migrations (Prisma is forward-only). The verify gate runs
            # migrations against an ephemeral DB before any deploy and migrations
            # are expected to be additive, so the previous code runs against the
            # current schema; a genuinely breaking migration needs a manual fix.
            docker compose \$FILES up -d --remove-orphans --force-recreate
            docker compose \$FILES exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose \$FILES up -d --force-recreate caddy
            deadline=\$(( \$(date +%s) + 120 ))
            while [ "\$(date +%s)" -lt "\$deadline" ]; do
              if [ "\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/healthz 2>/dev/null || true)" = "200" ]; then
                echo "rolled back to ${PREV_TAG} — origin healthy"
                exit 0
              fi
              sleep 5
            done
            echo "rollback to ${PREV_TAG} did not become healthy within 120s — MANUAL INTERVENTION NEEDED" >&2
            exit 1
          EOF
