name: deploy

# Build images and deploy them to every host in `infra/deploy/fleet.yml`.
# The deploy job is intentionally per-host with `fail-fast: false` so one cell
# failing doesn't roll back others — the topology assumes hosts are independent
# (different DB host per cell, eventually).
#
# MANUAL ONLY as of 2026-08-22. The push trigger is deliberately removed while
# the new box (195.201.13.95) is deployed by hand from the server itself —
# see docs/RUNBOOK.md. Leaving it on push would either paint
# every push red (the old host is gone) or, once fleet.yml points at the new
# box, ship a release nobody asked for.
#
# Nothing about verification changed: ci.yml still runs the full verify suite
# on every push. What is switched off here is shipping, not checking.
#
# To restore continuous deployment, put back:
#   push:
#     branches: [main]
#     paths: ['apps/**', 'packages/**', 'infra/**', 'locales/**', 'assets/**',
#             '.github/workflows/deploy.yml', '.github/workflows/verify.yml']
# ('locales/**' and 'assets/**' are in that list because apps/site/build.ts
# renders the marketing site from them, so a copy change is a deploy.)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override the tag to deploy (default: short SHA).'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------
  # verify — gate the whole deploy on the SAME checks CI runs, via the reusable
  # verify workflow (one source of truth — CI, deploy, and the desktop release
  # can never drift). Required status checks aren't available on this GitHub
  # plan, so a red build must be blocked HERE rather than via branch protection;
  # `build` (and therefore deploy) does not start unless this passes.
  #
  # verify.yml exercises the FULL migrate/seed/tenant path + integration suite
  # against an ephemeral Postgres + Redis — the same commands prod-bootstrap.sh
  # runs live on every deploy — so a schema/seed defect is blocked before it can
  # reach a host (CFG-02).
  # ---------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  # ---------------------------------------------------------------------
  # build — produce api + web images, push to GHCR.
  #
  # CFG-01: skip this job entirely when a tag override is supplied. A
  # workflow_dispatch with `image_tag` set is a ROLLBACK to a known-good,
  # already-pushed immutable image — rebuilding here would push the current
  # (possibly broken) HEAD under that historical tag, clobbering the artifact
  # the operator is trying to restore and poisoning :latest. On rollback we
  # pull the existing tag instead of building anything.
  # ---------------------------------------------------------------------
  build:
    name: Build & push images
    needs: verify
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        run: |
          # No tag override reaches this job (gated by `if:` above), so the tag
          # is always the freshly-built HEAD short SHA.
          TAG="${GITHUB_SHA::12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR image paths must be lowercase; the owner login may not be.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Caddy now carries the rendered marketing site, so the edge is a build
      # artefact like the others. This also puts the site's content version
      # under IMAGE_TAG, so a rollback rolls the copy back with the code.
      - name: Build & push edge image (Caddy + marketing site)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-caddy:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/libriant-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  # ---------------------------------------------------------------------
  # plan — read fleet.yml and emit a matrix of hosts.
  # ---------------------------------------------------------------------
  plan:
    name: Resolve fleet
    runs-on: ubuntu-latest
    # CFG-01: depend on verify + build but tolerate a SKIPPED build (rollback
    # path), where no new image is produced. Still require verify to have
    # passed and build, if it ran, to have succeeded.
    needs: [verify, build]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    outputs:
      hosts: ${{ steps.read.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          # Parse the YAML host list into a JSON matrix the deploy job fans out
          # across. This is a TRUST BOUNDARY, not a convenience: `user` and `ssh`
          # are interpolated straight into the `ssh` command lines below, so
          # whatever produces them can choose where the deploy key is used.
          # It used to be `pip install --quiet pyyaml || true` — an unpinned,
          # unhashed fetch from PyPI, on the runner holding DEPLOY_SSH_KEY, whose
          # failure was swallowed. yq is preinstalled on GitHub runners.
          # Emit only the three fields the deploy job actually reads, so a stray
          # key in fleet.yml cannot reach the matrix.
          echo "hosts=$(yq -o=json -I=0 '[.hosts[] | {"name": .name, "user": .user, "ssh": .ssh}]' infra/deploy/fleet.yml)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # deploy — fan out: one job per host. Failures don't cancel others.
  #
  # Guard rail: if a deploy passes the verify gate but the new stack fails its
  # post-deploy health check, the host is AUTOMATICALLY rolled back to the image
  # it was running before — production never stays on a broken build — and the
  # run is still marked failed so the operator is alerted.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.host.name }}
    # CFG-01: tolerate a skipped build on the rollback path (see `plan`).
    needs: [verify, build, plan]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.plan.outputs.hosts) }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin host key (no trust-on-first-use)
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Use PINNED host keys from a secret. `ssh-keyscan` blindly trusts
          # whatever key answers, so a MITM of the runner→host path could
          # intercept a root-equivalent session that sources all prod secrets.
          # Capture the real keys once out-of-band (`ssh-keyscan host`) and store
          # them in the DEPLOY_KNOWN_HOSTS secret.
          #
          # CFG-05: validate the secret CONTENT, not the written file. Writing
          # an unset secret with `printf '%s\n'` produces a 1-byte (lone "\n")
          # file that passes `-s`, so the old guard was dead code — a forgotten
          # secret surfaced later as a generic "Host key verification failed"
          # mid-deploy instead of this clear diagnostic. Require at least one
          # real "ssh-" key line before trusting it.
          if ! printf '%s\n' "$KNOWN_HOSTS" | grep -q '\bssh-'; then
            echo "DEPLOY_KNOWN_HOSTS secret is empty or has no ssh-* host key — set it to the pinned SSH host keys (\`ssh-keyscan <host>\`)." >&2
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture rollback target (current running image)
        id: capture
        run: |
          # Record the api image tag currently running on the host so a failed
          # deploy can be auto-rolled-back to it. Read via compose labels so we
          # don't need to source .env.prod. A valid target is a 12-hex short SHA
          # (it maps to BOTH an immutable GHCR image and a commit to check out);
          # anything else (first deploy, :latest, a bare image id) safely
          # disables rollback for this run.
          PREV_TAG="$(ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE'
          set -euo pipefail
          img="$(docker ps --filter 'label=com.docker.compose.project=libriant' --filter 'label=com.docker.compose.service=api' --format '{{.Image}}' | head -n1)"
          printf '%s' "${img##*:}"
          REMOTE
          )"
          if printf '%s' "$PREV_TAG" | grep -qE '^[0-9a-f]{12}$'; then
            echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
            echo "Rollback target for ${{ matrix.host.name }}: $PREV_TAG"
          else
            echo "No valid rollback target for ${{ matrix.host.name }} (got '$PREV_TAG') — auto-rollback disabled this run."
          fi

      # supply-chain-07. The Cloudflare origin PRIVATE KEY must be `0:0` and
      # GROUP-readable, and this has to hold BEFORE the stack is recreated.
      # `caddy` runs as uid 1000 in group 0 under `cap_drop: [ALL]`, so it has no
      # CAP_DAC_OVERRIDE to read around the permission bits and it is not the
      # file's owner — it reads the key as a member of group 0. A key at 600, or
      # one owned by the deploy user (which is what an `scp` produces), makes
      # every HTTPS vhost fail to load its certificate and takes the whole edge
      # down. Failing here instead leaves whatever is running untouched.
      #
      # THIS ARM MOVED FROM `0:600` IN THE SAME COMMIT THAT MOVED THE UID, and it
      # had to. The old arm did not fail closed on the case that matters: a box
      # that has NOT been converted still has a 600 key, the old gate PASSED it,
      # and the job would then have recreated the stack with the non-root caddy
      # against a key that uid 1000 cannot open — a full TLS outage shipped by the
      # one step whose job is to prevent it. Now an unconverted box is refused
      # here, before anything is touched, and the fix it prints is §3.7c.
      #
      # The gate is worth having on its own terms too: a world-readable origin
      # key on a box with more than one login is the Cloudflare Full-strict
      # trust relationship handed to all of them. Same check, same message, as
      # scripts/deploy-on-host.sh — the two deploy paths must not diverge, and
      # this file is the copy that is easy to forget because it is not run from
      # the box.
      - name: Pre-flight — the origin private key is root-owned
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE'
            set -euo pipefail
            KEY=/mnt/libriant/caddy/origin/origin.key
            [ -f "$KEY" ] || { echo "$KEY is missing — it is in the password manager, no backup has it." >&2; exit 1; }
            read -r KEY_UID KEY_GID KEY_MODE <<<"$(stat -L -c '%u %g %a' "$KEY")"
            case "${KEY_UID}:${KEY_GID}:${KEY_MODE}" in
              0:0:640|0:0:440) echo "origin key ok (uid=$KEY_UID gid=$KEY_GID mode=$KEY_MODE)" ;;
              0:0:600|0:0:400)
                echo "$KEY is $KEY_MODE — the pre-supply-chain-07 layout." >&2
                echo "Caddy now runs as uid 1000 in group 0 and cannot open it. This box has" >&2
                echo "NOT been converted; deploying would take every HTTPS vhost down." >&2
                echo "Convert it first: docs/RUNBOOK.md 3.7c (it is safe while the edge serves)." >&2
                exit 1
                ;;
              *)
                echo "$KEY is uid=$KEY_UID gid=$KEY_GID mode=$KEY_MODE; it must be 0:0 and 640 (or 440)." >&2
                echo "Caddy runs with cap_drop: [ALL] and cannot read around the permission bits." >&2
                echo "Fix on the host:  sudo chown 0:0 $KEY && sudo chmod 640 $KEY" >&2
                exit 1
                ;;
            esac
          REMOTE

      - name: Deploy (git sync + compose up)
        env:
          # CFG-01: on a rollback (workflow_dispatch with image_tag set) the
          # build job was skipped and produced no output, so resolve the tag
          # from the dispatch input. On a normal push it comes from `build`.
          # Every tag we publish is a 12-char short commit SHA, so the host can
          # map the deployed image's tag straight back to the commit to check
          # out — that keeps the running CODE identical to the running IMAGE
          # even on rollback (the old bug used github.sha = HEAD, which would
          # check out current code under the old image's tag).
          IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build.outputs.tag }}
        run: |
          # Deploy from the repo checkout the host already keeps at
          # /srv/libriant/app — the same layout + commands as the manual `dc`
          # flow, so manual and CI never diverge. `git reset --hard` deploys the
          # exact built commit (host-local edits to tracked files are
          # overwritten — keep customisations in .env.prod). The volume overlay
          # keeps all data on /mnt/libriant. The heredoc is UNQUOTED so only
          # ${IMAGE_TAG} expands on the runner; remote `$`-vars are escaped.
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<EOF
            set -euo pipefail
            cd /srv/libriant/app
            git fetch --quiet origin
            # Resolve the commit to deploy FROM the image tag (a short SHA), so
            # the checked-out scripts/migrations always match the image being
            # run — never current HEAD. (CFG-01)
            GIT_SHA="\$(git rev-parse --verify --quiet "${IMAGE_TAG}^{commit}" || true)"
            if [ -z "\$GIT_SHA" ]; then
              echo "Cannot resolve image tag '${IMAGE_TAG}' to a commit on this host — refusing to deploy." >&2
              exit 1
            fi
            git reset --hard "\$GIT_SHA"
            # Self-bootstrap secrets: generate any MISSING values in .env.prod
            # (idempotent — never overwrites existing, so POSTGRES_PASSWORD is
            # preserved). Operator-supplied bits (admin login) stay blank here;
            # set them once via an interactive run of the same script.
            bash scripts/ensure-env.sh --auto /srv/libriant/.env.prod
            set -a; . /srv/libriant/.env.prod; set +a
            export IMAGE_TAG="${IMAGE_TAG}"
            export COMPOSE_PROJECT_NAME=libriant
            export LIBRIANT_DATA_ROOT=/mnt/libriant
            FILES="-f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.volume.yml"
            # Reclaim disk BEFORE pulling fresh images. Every deploy pulls new
            # SHA-tagged api/web images; left unpruned they accumulate until the
            # disk fills — which has broken a deploy at the seed step with
            # "ENOSPC: no space left on device". Remove images that aren't used
            # by a container and are >72h old: in-use images are protected
            # regardless of age, so the running stack and recent tags (for fast
            # rollback) survive. Best-effort — cleanup never fails the deploy.
            docker image prune -af --filter 'until=72h' || true
            docker builder prune -f --filter 'until=72h' || true
            docker compose \$FILES pull
            # Validate the Caddyfile BEFORE anything is recreated. Two vhosts
            # claiming the same hostname is an adapter error, and without this
            # check the failure sequence is: \`up -d\` succeeds, \`caddy reload\`
            # fails, the fallback \`up -d --force-recreate caddy\` crash-loops,
            # and all three hosts go dark. With it, the deploy aborts and the
            # running stack keeps serving.
            if ! docker compose \$FILES run --rm --no-deps --entrypoint caddy caddy \\
                 validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "===== deploy aborted: Caddyfile is invalid =====" >&2
              exit 1
            fi
            # --force-recreate is deliberate: \`up -d\` alone only recreates a
            # container when compose decides the image/config changed, and with
            # the :latest / re-used tag that check can misfire — leaving the api
            # (or web) running OLD code even though \`pull\` fetched the new image.
            # Forcing recreation guarantees every deploy actually swaps in the
            # freshly-pulled image. (Caddy is reloaded separately below.)
            # The one-shot \`migrate\` service is a hard prerequisite (others gate
            # on service_completed_successfully). \`up -d\` runs detached, so when
            # migrate exits non-zero compose reports only "service migrate didn't
            # complete: exit 1" — the container's actual prisma/seed error is NOT
            # streamed here. On failure, dump the migrate logs (and container
            # status) before bailing, so the real cause is visible in CI instead
            # of an opaque exit code.
            if ! docker compose \$FILES up -d --remove-orphans --force-recreate; then
              echo "===== deploy failed: dumping one-shot 'migrate' logs =====" >&2
              docker compose \$FILES logs --no-color --timestamps migrate 2>&1 | tail -n 200 >&2 || true
              echo "===== container status =====" >&2
              docker compose \$FILES ps >&2 || true
              exit 1
            fi
            # Caddy's config is a bind-mount, so \`up -d\` won't restart it when
            # only the Caddyfile content changed. Reload it explicitly (graceful,
            # zero-downtime) so Caddyfile edits actually take effect; fall back to
            # a recreate if the running config can't be reloaded.
            docker compose \$FILES exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose \$FILES up -d --force-recreate caddy
          EOF

      - name: Wait for health
        run: |
          # Poll the ORIGIN's /healthz on the host itself — deliberately NOT
          # through Cloudflare. Cloudflare's managed challenge / bot protection
          # 403s automated requests (cf-mitigated: challenge), so a public curl
          # can never pass even when the site is perfectly healthy for browsers.
          # A deploy's success must reflect "the new code came up", not the CDN's
          # bot policy. Running over the existing SSH session also means this is
          # immune to how the edge firewall is locked down. Quoted heredoc, so
          # everything evaluates on the host. (Public reachability is a separate
          # concern, monitored by uptime checks — not the deploy gate.)
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE'
            set -euo pipefail
            proj=libriant
            # boot-and-config-08: the app vhost's hostname, so the gate can ask
            # for a page that is actually rendered by the web container rather
            # than only asking Docker whether containers are alive. Matches the
            # default in the caddy service's environment block.
            if [ -f /srv/libriant/.env.prod ]; then
              set -a; . /srv/libriant/.env.prod; set +a
            fi
            APP_HOST="${PUBLIC_HOST:-app.libriant.com}"
            # A12-03: the edge /healthz is a STATIC 200 (Caddy's :80 block) — it
            # stays green even if api/web/worker crashed after `up`, so it can't
            # be the only gate or a broken stack deploys "successfully" and never
            # rolls back. Also assert each app container's OWN healthcheck (which
            # probes /readyz — real DB+Redis liveness) reports `healthy`. Resolve
            # containers by compose labels (naming-scheme agnostic).
            svc_health() {
              local id
              id="$(docker ps -q \
                --filter "label=com.docker.compose.project=$proj" \
                --filter "label=com.docker.compose.service=$1" | head -n1)"
              [ -n "$id" ] || { echo "missing"; return; }
              docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id" 2>/dev/null || echo "missing"
            }
            deadline=$(( $(date +%s) + 150 ))
            edge=""; site=""; app=""; api=""; web=""; worker=""; pooler=""
            while [ "$(date +%s)" -lt "$deadline" ]; do
              # Require a real 200 — not a 3xx. The plaintext :80 /healthz block
              # answers 200; if Caddy were still on an old config it would 301 to
              # HTTPS, which must NOT count as healthy.
              edge="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/healthz 2>/dev/null || true)"
              # The marketing site is a separate vhost served from inside the
              # edge image, so a healthy origin does not imply it rendered. The
              # explicit Host header bypasses Cloudflare and satisfies the origin
              # certificate's SNI.
              site="$(curl -sSk -o /dev/null -w '%{http_code}' --max-time 5 -H 'Host: libriant.com' https://localhost/ 2>/dev/null || true)"
              # boot-and-config-08. Every signal above this line can be green
              # while the product is unusable. `edge` is Caddy's own static
              # `respond "ok" 200` and proves nothing about any app; `site` is
              # the marketing vhost, served from files inside the edge image;
              # `api`/`web`/`worker` are container healthchecks. NOT ONE of them
              # crossed the web→api hop, so a wrong API_INTERNAL_URL or a broken
              # `app` docker network passed the whole gate green while every
              # page a librarian opened rendered an error.
              #
              # This one does cross it: Caddy's app vhost → web:3000 → the Next
              # route handler → fetch(API_INTERNAL_URL/readyz) → api:3001. A 200
              # means the edge routes the app host, the web container renders,
              # and it can reach a ready API. `--resolve` rather than
              # `-H 'Host: …'` so curl offers the right SNI — the origin
              # certificate covers libriant.com and *.libriant.com, not
              # `localhost`, and a wrong SNI reads as a dead stack.
              app="$(curl -sSk --resolve "$APP_HOST:443:127.0.0.1" -o /dev/null -w '%{http_code}' --max-time 8 "https://$APP_HOST/api/readyz" 2>/dev/null || true)"
              api="$(svc_health api)"; web="$(svc_health web)"; worker="$(svc_health worker)"
              # boot-and-config-15. The pooler every control-plane query passes
              # through. Its sidecar runs `psql -c 'select 1'` THROUGH pgbouncer
              # — the only probe that separates "the pooler answers" from "the
              # pooler can reach Postgres". The `pg_isready` it replaces was
              # answered by pgbouncer's own startup-packet reply and stayed
              # green with the backend gone, and nothing read the result anyway.
              # This line is what reads it.
              pooler="$(svc_health pgbouncer-probe)"
              if [ "$edge" = "200" ] && [ "$site" = "200" ] && [ "$app" = "200" ] && [ "$api" = "healthy" ] && [ "$web" = "healthy" ] && [ "$worker" = "healthy" ]; then
                echo "origin + marketing site + app page (web→api) + app containers healthy"
                # Reported, NOT a conjunct above. Two reasons, and the second is
                # the one that matters. First, it is redundant as a gate: the
                # API's CONTROL_DATABASE_URL points at pgbouncer:5432, so a
                # pooler that cannot reach Postgres already fails `api=healthy`
                # through /readyz. Second, this sidecar is new and has never
                # executed anywhere — and this gate sits immediately before the
                # `if: failure()` rollback step, so a probe that does not go
                # healthy would roll a PERFECTLY HEALTHY production application
                # back to its previous image on the word of a container that
                # serves no traffic. The service's own comment says the API must
                # not be gated on a diagnostic; gating the deploy on it is worse.
                #
                # So it is a signal, and a disagreement is worth saying out loud:
                # everything healthy WHILE the probe is not means the probe is
                # broken, which is a thing to fix, not a reason to roll back.
                if [ "$pooler" = "healthy" ]; then
                  echo "pooler path healthy (psql select 1 through pgbouncer)"
                else
                  echo "::warning::pgbouncer-probe is '${pooler:-missing}' while every other service is healthy. The pooler path itself is proven by api=healthy (the API reaches Postgres through pgbouncer), so this points at the probe, not the pooler. Check: docker compose logs pgbouncer-probe"
                fi
                exit 0
              fi
              echo "waiting for health… edge=$edge site=$site app=$app api=$api web=$web worker=$worker pooler=$pooler"
              sleep 5
            done
            echo "stack did not become healthy within 150s (edge=$edge site=${site:-?} app=${app:-?} api=$api web=$web worker=$worker pooler=${pooler:-?})" >&2
            docker ps --format 'table {{.Names}}\t{{.Status}}' || true
            exit 1
          REMOTE

      - name: Roll back to previous image on failure
        # Runs only when an earlier step in THIS deploy job failed (a broken
        # deploy or a failed health check) AND we captured a valid previous tag.
        if: failure() && steps.capture.outputs.prev_tag != ''
        env:
          PREV_TAG: ${{ steps.capture.outputs.prev_tag }}
        run: |
          echo "::error::${{ matrix.host.name }} deploy/health failed — rolling back to ${PREV_TAG} (production must not stay on a broken build)."
          # Unquoted heredoc: ${PREV_TAG} expands on the runner; remote `$`-vars
          # are escaped to run on the host.
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<EOF
            set -euo pipefail
            cd /srv/libriant/app
            GIT_SHA="\$(git rev-parse --verify --quiet "${PREV_TAG}^{commit}" || true)"
            if [ -z "\$GIT_SHA" ]; then
              echo "cannot resolve ${PREV_TAG} to a commit on this host — MANUAL ROLLBACK NEEDED" >&2
              exit 1
            fi
            git reset --hard "\$GIT_SHA"
            set -a; . /srv/libriant/.env.prod; set +a
            export IMAGE_TAG="${PREV_TAG}"
            export COMPOSE_PROJECT_NAME=libriant
            export LIBRIANT_DATA_ROOT=/mnt/libriant
            FILES="-f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.volume.yml"
            docker compose \$FILES pull
            # Image rollback restores the previous CODE + IMAGE but does NOT
            # revert DB migrations (Prisma is forward-only). The verify gate runs
            # migrations against an ephemeral DB before any deploy and migrations
            # are expected to be additive, so the previous code runs against the
            # current schema; a genuinely breaking migration needs a manual fix.
            docker compose \$FILES up -d --remove-orphans --force-recreate
            docker compose \$FILES exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose \$FILES up -d --force-recreate caddy
            deadline=\$(( \$(date +%s) + 120 ))
            while [ "\$(date +%s)" -lt "\$deadline" ]; do
              if [ "\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/healthz 2>/dev/null || true)" = "200" ]; then
                echo "rolled back to ${PREV_TAG} — origin healthy"
                exit 0
              fi
              sleep 5
            done
            echo "rollback to ${PREV_TAG} did not become healthy within 120s — MANUAL INTERVENTION NEEDED" >&2
            exit 1
          EOF

      # ---------------------------------------------------------------------
      # The monitoring stack, which until now was in NO deploy path at all.
      #
      # Both compose invocations above — and the one in scripts/deploy-on-host.sh
      # — listed exactly two files and never infra/monitoring. So the 32 rules in
      # infra/monitoring/alerts.yml, including the backup dead-man's switches and
      # the Watchdog whose entire job is to prove the alert pipeline is alive,
      # were evaluated by nothing, while `pnpm check:alerts` printed a green line
      # about them on every CI run. This step is what makes them real.
      #
      # A SEPARATE compose project rather than a third `-f`: the app deploy runs
      # `up -d --remove-orphans` under project `libriant`, and the monitoring
      # file declares the `app` network as external — the same network the prod
      # file creates. One invocation cannot hold both.
      #
      # LAST IN THE JOB, AND THAT ORDER IS LOAD-BEARING. The rollback step above
      # is `if: failure()`, evaluated when the job reaches it. Putting monitoring
      # after it means a monitoring problem is reported as a failed deploy —
      # which it is — without rolling a perfectly healthy application back to the
      # previous image because Prometheus would not start.
      # ---------------------------------------------------------------------
      - name: Bring up the monitoring stack
        run: |
          # `set -o pipefail` is load-bearing, not decoration. GitHub runs this
          # block under its default `bash -e {0}`, which does NOT set pipefail,
          # so a pipeline reports the exit status of its LAST command — `tee`,
          # which always succeeds. Without this line every gate below is inert:
          # promtool refusing to parse a rule file, a missing alertmanager.yml,
          # amtool rejecting the config, `up -d` failing, and the ten-second
          # still-running assertion ALL report success, and the ALERTING=off
          # banner is grepped out of the same log so a script that dies before
          # echoing warns nobody either. A totally broken monitoring deploy was
          # a green step. That is the exact failure this step was added to end,
          # reproduced inside the fix for it.
          set -o pipefail
          ssh -o StrictHostKeyChecking=yes "${{ matrix.host.user }}@${{ matrix.host.ssh }}" bash -se <<'REMOTE' | tee /tmp/monitoring.log
            set -euo pipefail
            cd /srv/libriant/app
            set -a; . /srv/libriant/.env.prod; set +a
            MON="-p libriant-monitoring -f infra/monitoring/docker-compose.monitoring.yml"
            # Same shape as the Caddyfile gate: a rule file that does not parse
            # takes Prometheus down on start, and a Prometheus that is down is
            # the thing that was supposed to tell you something is down.
            docker compose $MON run --rm --no-deps --entrypoint promtool prometheus \
              check rules /etc/prometheus/alerts.yml
            # `grep -q` on a MISSING file exits 1, the same code as "no
            # placeholders found" — so without this the file being gone would
            # read as a fully configured one.
            [ -f infra/monitoring/alertmanager.yml ] || {
              echo "infra/monitoring/alertmanager.yml is missing — nowhere to deliver to." >&2; exit 1; }
            # Comments stripped first: the file's own header explains what a
            # [PLACEHOLDER: …] is, and matching that sentence would keep the
            # profile off forever even after the receivers were filled in.
            if sed 's/#.*//' infra/monitoring/alertmanager.yml | grep -q '\[PLACEHOLDER'; then
              export COMPOSE_PROFILES=""
              STATE=off
            else
              export COMPOSE_PROFILES="alerting"
              STATE=on
              docker compose $MON run --rm --no-deps --entrypoint amtool alertmanager \
                check-config /etc/alertmanager/alertmanager.yml
            fi
            docker compose $MON up -d
            # No healthcheck on these images — nothing here can verify what a
            # third-party image ships to probe itself with, and an unverifiable
            # probe that goes permanently red is worse than none. Container
            # STATE needs no such assumption: Prometheus exits non-zero on a
            # config it cannot load, so "still running ten seconds later" means
            # something. It does not prove delivery; that is what ALERTING= is.
            sleep 10
            for svc in prometheus node-exporter; do
              id="$(docker ps -aq --filter 'label=com.docker.compose.project=libriant-monitoring' \
                                  --filter "label=com.docker.compose.service=$svc" | head -n1)"
              state="$(docker inspect -f '{{.State.Status}}' "$id" 2>/dev/null || echo missing)"
              if [ "$state" != "running" ]; then
                docker compose $MON logs --no-color --tail 50 "$svc" >&2 || true
                echo "monitoring service '$svc' is '$state', not running." >&2
                exit 1
              fi
            done
            docker compose $MON ps
            echo "ALERTING=$STATE"
          REMOTE
          if grep -q '^ALERTING=off' /tmp/monitoring.log; then
            echo "::warning title=Alerts are not being delivered::infra/monitoring/alertmanager.yml still has [PLACEHOLDER] receivers, so Alertmanager was not started. Prometheus is evaluating all 32 rules and not one of them can reach a person — including BackupNeverRan, the disk-full alerts, and the Watchdog that exists to tell you alerting itself has broken. Put a real destination in that file."
          fi
