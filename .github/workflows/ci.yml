name: ci

# Fast feedback on every push to main + every PR. Delegates to the reusable
# verify gate (.github/workflows/verify.yml) so CI, the production deploy, and
# the desktop release all run the EXACT same checks — one source of truth, no
# drift.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
