name: Desktop release

# Build + (optionally) sign + publish the Libriant desktop app to GitHub
# Releases — the auto-update feed electron-updater reads (latest.yml +
# installers).
#
# Fully automated + guard-railed:
#   - Triggers ONLY when the desktop shell (apps/desktop/**) changes. The app is
#     a thin shell that loads the live web app, so web/API changes already reach
#     desktop users via the normal deploy — a new installer is needed only when
#     the shell code itself changes.
#   - Gated on the SAME reusable `verify` checks CI + deploy run, so a defective
#     commit can never reach desktop users.
#   - Version auto-increments (major.minor from package.json + the CI run number)
#     so electron-updater always sees a strictly newer build and clients update.
#   - The release is built as a DRAFT and only flipped live once ALL THREE OS
#     installers have uploaded — a partial/failed multi-OS build never ships.
#
# Signing (see apps/desktop/SIGNING.md): each platform auto-detects its secrets —
# present → signed (+ notarized on macOS); absent → a clean UNSIGNED build is
# still published, so you can ship now and add signing later with no change.
#   macOS sign:      MAC_CSC_LINK (Developer ID .p12, base64) + MAC_CSC_KEY_PASSWORD
#   macOS notarize:  App Store Connect API key — APPLE_API_KEY_P8 + _ID + _ISSUER
#   Windows sign:    Azure Trusted Signing — AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET
#                    + AZURE_TS_ENDPOINT/ACCOUNT/CERT_PROFILE + WIN_PUBLISHER_NAME

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      # Just that one path — exactly what the header above promises. Neither
      # this workflow nor verify.yml is listed, because a run is a RELEASE and
      # editing the release machinery is not a reason to ship an installer.
      # (Proof it matters: the commit that removed verify.yml from this list
      # would itself have published v0.1.9, because it edits this file.) Use
      # `workflow_dispatch` to exercise the pipeline deliberately.
      #
      # NOT '.github/workflows/verify.yml'. Every run of this workflow publishes
      # a release — the version is MAJOR.MINOR from package.json plus the CI run
      # number, so there is no such thing as a dry run. verify.yml is the shared
      # gate and changes often for reasons that have nothing to do with the
      # desktop shell; including it here shipped v0.1.8 off a Node-version bump
      # on 2026-08-22, which is also how it contradicted the header above.
      # Nothing is lost by removing it: ci.yml calls the same reusable verify
      # workflow on every push, so a change to the gate is still validated —
      # it just no longer cuts an installer nobody asked for.
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# supply-chain-02: default DENY. This was `contents: write` at the workflow
# level, which handed a write-capable GITHUB_TOKEN to every job in the file —
# including `verify`, which runs the whole test suite and needs nothing but
# read. Write is now granted per job, to the three that genuinely publish.
permissions:
  contents: read

jobs:
  # Same gate as CI + deploy — nothing builds unless the commit is sound.
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  # Resolve the auto-incrementing version and pre-create the release as a DRAFT
  # (idempotent). Building against a pre-existing release means the three OS
  # jobs upload to ONE release instead of racing to create three.
  version:
    name: Resolve version + open draft
    needs: verify
    runs-on: ubuntu-latest
    # Creates the draft release.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          BASE=$(node -p "require('./apps/desktop/package.json').version")
          # Keep MAJOR.MINOR from package.json; the PATCH is the CI run number,
          # which only ever increases — so the version is strictly monotonic
          # even across a minor bump (electron-updater needs newer > current).
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desktop release version: $VERSION"
      - name: Open draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Libriant Desktop ${{ steps.v.outputs.version }}" \
              --notes "Automated desktop build from ${GITHUB_SHA:0:12}."
          fi

  # Build each OS and upload its installers to the draft release.
  release:
    name: Build & upload (${{ matrix.os }})
    needs: [verify, version]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # electron-builder `--publish always` uploads the installers to the draft
    # release from inside this job, so it needs write. That is precisely the
    # co-location the guard below refuses to widen any further.
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # ────────────────────────────────────────────────────────────────────────
      # supply-chain-02 — FAIL CLOSED BEFORE ANY THIRD-PARTY CODE RUNS.
      #
      # This job installs 611 packages and then runs electron-builder. The audit
      # enumerated four packages in that closure with arbitrary-code install
      # hooks (@prisma/engines postinstall, prisma preinstall, esbuild
      # postinstall, electron-winstaller install), and electron-builder itself
      # downloads the Electron dist archive (and, on Windows, 7-Zip) from the
      # network at package time. Any of that code runs in this job.
      #
      # Today that is survivable ONLY because every signing secret is unset: an
      # unset GitHub secret interpolates to the empty string, so there is no
      # Apple Developer ID certificate and no Azure service principal here to
      # steal (the workflow's own `if [ -z "${CSC_LINK:-}" ]` branches are what
      # actually execute, and commit 7d71e7e — "ad-hoc sign unsigned macOS
      # builds" — exists because there is no cert). The moment someone populates
      # MAC_CSC_LINK or AZURE_CLIENT_SECRET, one compromised npm package reads a
      # code-signing identity that cannot be revoked without invalidating every
      # installer already shipped, and can publish a signed installer that every
      # desktop client auto-installs.
      #
      # So the audit's "until then, do not populate MAC_CSC_LINK /
      # AZURE_CLIENT_SECRET" is enforced here instead of living in a document
      # nobody reads at the moment they add the secret. No secret VALUE is put
      # in this step's environment — only the booleans.
      #
      # TO LIFT THIS GUARD, split the pipeline; there is no other correct fix:
      #   1. `release` (this job) keeps `permissions: contents: read`, no
      #      secrets, and runs `electron-builder --publish never`, uploading its
      #      output with actions/upload-artifact.
      #   2. A new `sign-publish` job, gated on an `environment:` with required
      #      reviewers, downloads that artifact, installs ONLY electron-builder
      #      (`--ignore-scripts`, pinned), re-runs it `--prepackaged` with the
      #      signing secrets, and publishes. Verify the generated latest*.yml
      #      sha512 entries match the signed binaries — electron-updater
      #      verifies them, so re-signing after the hashes are computed silently
      #      breaks auto-update for the whole fleet.
      #   3. Then set the repository variable DESKTOP_SIGNING_PIPELINE_SPLIT to
      #      `true` (Settings → Secrets and variables → Actions → Variables).
      - name: Refuse to hand signing secrets to a job that runs third-party code
        env:
          HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_APPLE_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_AZURE_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          PIPELINE_SPLIT: ${{ vars.DESKTOP_SIGNING_PIPELINE_SPLIT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PIPELINE_SPLIT:-}" = "true" ]; then
            echo "DESKTOP_SIGNING_PIPELINE_SPLIT=true — signing secrets are declared safe here."
            exit 0
          fi
          # `if`, not `[ … ] && held=…`: under `set -e` a false `&&` list is the
          # last command of the script line and exits 1, which would turn "no
          # secrets configured" — the normal case — into a failed release.
          held=""
          if [ "${HAS_MAC_CERT:-}" = "true" ]; then held="$held MAC_CSC_LINK"; fi
          if [ "${HAS_APPLE_KEY:-}" = "true" ]; then held="$held APPLE_API_KEY_P8"; fi
          if [ "${HAS_AZURE_SECRET:-}" = "true" ]; then held="$held AZURE_CLIENT_SECRET"; fi
          if [ -n "$held" ]; then
            echo "::error::supply-chain-02: this job installs 611 packages (four with arbitrary-code install hooks) and then runs electron-builder, and it is now also holding:${held}. A code-signing identity stolen here cannot be revoked without invalidating every installer already shipped. Split the build and the signing job first — see the comment above this step — then set the repository variable DESKTOP_SIGNING_PIPELINE_SPLIT=true."
            exit 1
          fi
          echo "No signing secrets are populated — building unsigned, as designed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch Electron binary
        # pnpm blocks Electron's large binary postinstall by default; electron-
        # builder needs it present to package.
        run: pnpm rebuild electron

      - name: Build desktop (tsc)
        run: pnpm --filter @libriant/desktop build

      - name: Package, sign & publish
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          # Override the version (without touching package.json) so the build,
          # the published release tag (v${DESKTOP_VERSION}) and latest.yml all
          # carry the auto-incremented version.
          VER_FLAG="--config.extraMetadata.version=${DESKTOP_VERSION}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "${CSC_LINK:-}" ]; then
              # No Developer ID cert → publish a clean UNSIGNED build instead of
              # failing. Crucially UNSET CSC_LINK/CSC_KEY_PASSWORD rather than
              # leave them as the empty strings the env block sets from the unset
              # secrets: electron-builder treats a DEFINED-but-empty CSC_LINK as
              # "import this cert", and the empty path resolves to the project dir
              # → the "apps/desktop not a file" packaging failure. Unsetting +
              # CSC_IDENTITY_AUTO_DISCOVERY=false makes it cleanly skip signing.
              # afterPack (build/after-pack.js) ad-hoc-signs the bundle in this
              # path so the arm64 build is launchable — without it Apple Silicon
              # rejects a fully unsigned .app as "damaged". Still un-notarized, so
              # users open via right-click → Open. mac auto-update stays disabled
              # until a real Developer ID cert is supplied.
              echo "::warning::No MAC_CSC_LINK — publishing an ad-hoc-signed UNSIGNED macOS build (no notarization → open via right-click → Open; auto-update DISABLED until signed)."
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              # A11-01: bake a flag so the app refuses to auto-update an unsigned
              # build (electron-updater can't verify it → fleet-RCE risk).
              pnpm exec electron-builder --publish always $VER_FLAG \
                --config.extraMetadata.libriantAutoUpdate=false
            elif [ -n "${APPLE_API_KEY_P8:-}" ]; then
              # Signed + notarized. The .p8 (App Store Connect API key) goes to a
              # file whose path @electron/notarize reads via APPLE_API_KEY.
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              pnpm exec electron-builder --publish always $VER_FLAG --config.mac.notarize=true
            else
              # Cert but no notarization key → sign without notarizing (Gatekeeper
              # still warns on first open, but the binary is at least signed).
              echo "::warning::MAC_CSC_LINK set but no APPLE_API_KEY_P8 — signing WITHOUT notarizing."
              pnpm exec electron-builder --publish always $VER_FLAG
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "${AZURE_CLIENT_ID:-}" ]; then
              pnpm exec electron-builder --publish always $VER_FLAG \
                --config.win.azureSignOptions.publisherName="$WIN_PUBLISHER_NAME" \
                --config.win.azureSignOptions.endpoint="$AZURE_TS_ENDPOINT" \
                --config.win.azureSignOptions.codeSigningAccountName="$AZURE_TS_ACCOUNT" \
                --config.win.azureSignOptions.certificateProfileName="$AZURE_TS_CERT_PROFILE"
            else
              # A11-01: No Azure secrets → UNSIGNED build. We keep
              # verifyUpdateCodeSignature at its SECURE DEFAULT (true) and instead
              # DISABLE auto-update for this build (libriantAutoUpdate=false baked
              # into the app). Previously we set verifyUpdateCodeSignature=false so
              # the unsigned update would still apply — that is a fleet-wide RCE
              # vector (anyone who can publish to Releases ships an arbitrary exe).
              # The installer is still published for MANUAL download via the panel;
              # it just won't silently self-update until the build is signed.
              echo "::warning::No AZURE_CLIENT_ID — publishing an UNSIGNED Windows build (SmartScreen warns; AUTO-UPDATE DISABLED until signed; manual download only)."
              pnpm exec electron-builder --publish always $VER_FLAG \
                --config.extraMetadata.libriantAutoUpdate=false
            fi
          else
            pnpm exec electron-builder --publish always $VER_FLAG
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing cert + App Store Connect API key (notarize)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Azure Trusted Signing (service-principal auth + account/profile)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_CERT_PROFILE: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}

  # Flip the draft live ONLY after all three OS builds succeeded — so the API
  # (which serves the newest non-draft release) never sees a partial release.
  # `needs: release` requires every matrix leg to pass; one OS failing leaves the
  # release a draft and the run red for the operator to retry.
  publish:
    name: Publish release
    needs: [version, release]
    runs-on: ubuntu-latest
    # Flips the draft live.
    permissions:
      contents: write
    # This step IS the auto-update feed: electron-updater installs whatever the
    # newest non-draft release contains, on every machine already running the
    # app. Until this gate existed, any push touching apps/desktop/** shipped
    # straight to those machines with no reviewer — and this repository has no
    # branch protection (see deploy.yml's own note).
    #
    # OWNER ACTION REQUIRED: GitHub creates this environment on first use with
    # NO protection rules, which gates nothing. Add a required reviewer under
    # Settings -> Environments -> desktop-release, or this is decoration.
    environment: desktop-release
    steps:
      - name: Make the release live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG — clients on an older version will auto-update."
