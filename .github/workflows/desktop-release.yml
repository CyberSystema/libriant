# Build + sign + publish the Libriant desktop app to GitHub Releases, which is
# the auto-update feed electron-updater reads (latest.yml + installers).
#
# Trigger by pushing a tag like `desktop-v1.2.3` (separate from the web/api
# deploy, which keys off `main`). Uses the MODERN signing paths — see
# apps/desktop/SIGNING.md for how to obtain every value:
#   macOS sign:      MAC_CSC_LINK (Developer ID .p12, base64) + MAC_CSC_KEY_PASSWORD
#   macOS notarize:  App Store Connect API key —
#                    APPLE_API_KEY_P8 (.p8, base64) + APPLE_API_KEY_ID + APPLE_API_ISSUER
#   Windows sign:    Azure Trusted Signing — service principal
#                    (AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET) +
#                    AZURE_TS_ENDPOINT + AZURE_TS_ACCOUNT + AZURE_TS_CERT_PROFILE +
#                    WIN_PUBLISHER_NAME
# Each platform job auto-detects its secrets: present → signed (+ notarized on
# macOS); absent → a clean UNSIGNED build is still published, so you can ship now
# and add signing later with no code/config change. GITHUB_TOKEN (auto) publishes.
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch Electron binary
        # pnpm blocks Electron's large binary postinstall by default; electron-
        # builder needs it present to package.
        run: pnpm rebuild electron

      - name: Build desktop (tsc)
        run: pnpm --filter @libriant/desktop build

      - name: Package, sign & publish
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "${CSC_LINK:-}" ]; then
              # No Developer ID cert → publish a clean UNSIGNED build instead of
              # failing. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
              # from hunting the keychain for an identity. Gatekeeper warns, and
              # macOS auto-update (Squirrel.Mac) stays off until the build is signed.
              echo "::warning::No MAC_CSC_LINK — publishing an UNSIGNED macOS build (Gatekeeper warns; mac auto-update disabled until signed)."
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              pnpm exec electron-builder --publish always
            elif [ -n "${APPLE_API_KEY_P8:-}" ]; then
              # Signed + notarized. The .p8 (App Store Connect API key) goes to a
              # file whose path @electron/notarize reads via APPLE_API_KEY.
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              pnpm exec electron-builder --publish always --config.mac.notarize=true
            else
              # Cert but no notarization key → sign without notarizing (Gatekeeper
              # still warns on first open, but the binary is at least signed).
              echo "::warning::MAC_CSC_LINK set but no APPLE_API_KEY_P8 — signing WITHOUT notarizing."
              pnpm exec electron-builder --publish always
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "${AZURE_CLIENT_ID:-}" ]; then
              pnpm exec electron-builder --publish always \
                --config.win.azureSignOptions.publisherName="$WIN_PUBLISHER_NAME" \
                --config.win.azureSignOptions.endpoint="$AZURE_TS_ENDPOINT" \
                --config.win.azureSignOptions.codeSigningAccountName="$AZURE_TS_ACCOUNT" \
                --config.win.azureSignOptions.certificateProfileName="$AZURE_TS_CERT_PROFILE"
            else
              # No Azure secrets → UNSIGNED build. verifyUpdateCodeSignature=false so
              # electron-updater still applies the (unsigned) update; SmartScreen
              # warns on install. Signed builds keep verification on (default true).
              echo "::warning::No AZURE_CLIENT_ID — publishing an UNSIGNED Windows build (SmartScreen warns; update signature check disabled)."
              pnpm exec electron-builder --publish always --config.win.verifyUpdateCodeSignature=false
            fi
          else
            pnpm exec electron-builder --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing cert + App Store Connect API key (notarize)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Azure Trusted Signing (service-principal auth + account/profile)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_CERT_PROFILE: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
