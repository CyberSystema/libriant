# Build + sign + publish the Libriant desktop app to GitHub Releases, which is
# the auto-update feed electron-updater reads (latest.yml + installers).
#
# Trigger by pushing a tag like `desktop-v1.2.3` (separate from the web/api
# deploy, which keys off `main`). Uses the MODERN signing paths — see
# apps/desktop/SIGNING.md for how to obtain every value:
#   macOS sign:      MAC_CSC_LINK (Developer ID .p12, base64) + MAC_CSC_KEY_PASSWORD
#   macOS notarize:  App Store Connect API key —
#                    APPLE_API_KEY_P8 (.p8, base64) + APPLE_API_KEY_ID + APPLE_API_ISSUER
#   Windows sign:    Azure Trusted Signing — service principal
#                    (AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET) +
#                    AZURE_TS_ENDPOINT + AZURE_TS_ACCOUNT + AZURE_TS_CERT_PROFILE +
#                    WIN_PUBLISHER_NAME
# Until a platform's secrets exist its job produces an unsigned build (or fails
# at notarize). GITHUB_TOKEN (auto) publishes the release.
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch Electron binary
        # pnpm blocks Electron's large binary postinstall by default; electron-
        # builder needs it present to package.
        run: pnpm rebuild electron

      - name: Build desktop (tsc)
        run: pnpm --filter @libriant/desktop build

      - name: Package, sign & publish
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # App Store Connect API key (.p8) for notarytool — written to a file
            # whose path electron-builder/@electron/notarize reads via APPLE_API_KEY.
            if [ -n "${APPLE_API_KEY_P8:-}" ]; then
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            fi
            pnpm exec electron-builder --publish always --config.mac.notarize=true
          elif [ "$RUNNER_OS" = "Windows" ]; then
            pnpm exec electron-builder --publish always \
              --config.win.azureSignOptions.publisherName="$WIN_PUBLISHER_NAME" \
              --config.win.azureSignOptions.endpoint="$AZURE_TS_ENDPOINT" \
              --config.win.azureSignOptions.codeSigningAccountName="$AZURE_TS_ACCOUNT" \
              --config.win.azureSignOptions.certificateProfileName="$AZURE_TS_CERT_PROFILE"
          else
            pnpm exec electron-builder --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing cert + App Store Connect API key (notarize)
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Azure Trusted Signing (service-principal auth + account/profile)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_CERT_PROFILE: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
