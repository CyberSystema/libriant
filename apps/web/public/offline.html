<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Libriant</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        box-sizing: border-box;
        font-family:
          'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #f6f8fa;
        color: #0d1117;
      }
      main {
        text-align: center;
        max-width: 24rem;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #57606a;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 0.625rem 1.25rem;
        background: #1f6feb;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1858c9;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inlined Libriant bookshelf mark so the page needs no network at all. -->
      <svg
        class="logo"
        viewBox="32 32 192 192"
        role="img"
        aria-label="Libriant"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="of-ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#123A47" />
            <stop offset="1" stop-color="#0A222C" />
          </linearGradient>
          <linearGradient id="of-t1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#13B0A0" />
            <stop offset="1" stop-color="#0C8C81" />
          </linearGradient>
          <linearGradient id="of-t2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22C9B8" />
            <stop offset="1" stop-color="#14A99A" />
          </linearGradient>
          <linearGradient id="of-g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F8CE63" />
            <stop offset="1" stop-color="#E9A93C" />
          </linearGradient>
          <linearGradient id="of-g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F2A741" />
            <stop offset="1" stop-color="#E08A2A" />
          </linearGradient>
        </defs>
        <g fill="url(#of-ink)" stroke="rgba(255,255,255,0.06)" stroke-width="1">
          <rect x="44" y="44" width="40" height="168" rx="13" />
          <rect x="44" y="172" width="168" height="40" rx="13" />
        </g>
        <g transform="rotate(-7 107 172)">
          <rect x="95" y="80" width="24" height="92" rx="4.5" fill="url(#of-t1)" />
          <rect
            x="96.6"
            y="80"
            width="20.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="114.5"
            y="86"
            width="4.5"
            height="82"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g>
          <rect x="123" y="62" width="25" height="110" rx="4.5" fill="url(#of-t2)" />
          <rect
            x="124.6"
            y="62"
            width="21.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="143.5"
            y="68"
            width="4.5"
            height="100"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g>
          <rect x="152" y="92" width="24" height="80" rx="4.5" fill="url(#of-g1)" />
          <rect
            x="153.6"
            y="92"
            width="20.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="171.5"
            y="98"
            width="4.5"
            height="70"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g transform="rotate(9 190.5 172)">
          <rect x="178" y="104" width="25" height="68" rx="4.5" fill="url(#of-g2)" />
          <rect
            x="179.6"
            y="104"
            width="21.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="198.5"
            y="110"
            width="4.5"
            height="58"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <path d="M132 53 H145 V96 L138.5 91 L132 96 Z" fill="#F8CE63" />
        <line
          x1="138.5"
          y1="53"
          x2="138.5"
          y2="91"
          stroke="#0C8C81"
          stroke-opacity="0.25"
          stroke-width="1.2"
        />
      </svg>
      <h1>You're offline</h1>
      <p>
        Libriant can't reach the network right now. Pages you've already opened may still be
        available — otherwise reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
