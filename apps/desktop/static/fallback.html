<!doctype html>
<!--
  The shell's offline/setup screen. Greek is written into the markup and the
  script re-renders it in the locale the main process picked (?lang=) — so a
  script that never runs still leaves a readable Greek page rather than an
  English one. Strings live inline because a file:// page can reach neither the
  web app's catalogs nor the network; src/i18n.ts carries the menu half.
-->
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Libriant — σύνδεση</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        box-sizing: border-box;
        background: #f6f8fa;
        color: #0d1117;
        font-family:
          'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #57606a;
        line-height: 1.5;
      }
      .err {
        font-size: 0.8125rem;
        color: #8a6d00;
        background: #fff8e6;
        border: 1px solid #f0e0a0;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        word-break: break-all;
        margin: 0 0 1.25rem;
      }
      label {
        display: block;
        text-align: left;
        font-size: 0.8125rem;
        color: #57606a;
        margin: 0 0 0.25rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.625rem;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        font-size: 0.9375rem;
        margin: 0 0 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 0.625rem 1rem;
        font-weight: 600;
        font-size: 0.9375rem;
        cursor: pointer;
      }
      .primary {
        background: #1f6feb;
        color: #fff;
      }
      .primary:hover {
        background: #1858c9;
      }
      .ghost {
        background: transparent;
        color: #1f6feb;
        border: 1px solid #d0d7de;
      }
      .muted {
        font-size: 0.75rem;
        color: #6e7781;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="logo"
        viewBox="32 32 192 192"
        role="img"
        aria-label="Libriant"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="fb-ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#123A47" />
            <stop offset="1" stop-color="#0A222C" />
          </linearGradient>
          <linearGradient id="fb-t1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#13B0A0" />
            <stop offset="1" stop-color="#0C8C81" />
          </linearGradient>
          <linearGradient id="fb-t2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22C9B8" />
            <stop offset="1" stop-color="#14A99A" />
          </linearGradient>
          <linearGradient id="fb-g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F8CE63" />
            <stop offset="1" stop-color="#E9A93C" />
          </linearGradient>
          <linearGradient id="fb-g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F2A741" />
            <stop offset="1" stop-color="#E08A2A" />
          </linearGradient>
        </defs>
        <g fill="url(#fb-ink)" stroke="rgba(255,255,255,0.06)" stroke-width="1">
          <rect x="44" y="44" width="40" height="168" rx="13" />
          <rect x="44" y="172" width="168" height="40" rx="13" />
        </g>
        <g transform="rotate(-7 107 172)">
          <rect x="95" y="80" width="24" height="92" rx="4.5" fill="url(#fb-t1)" />
          <rect
            x="96.6"
            y="80"
            width="20.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="114.5"
            y="86"
            width="4.5"
            height="82"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g>
          <rect x="123" y="62" width="25" height="110" rx="4.5" fill="url(#fb-t2)" />
          <rect
            x="124.6"
            y="62"
            width="21.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="143.5"
            y="68"
            width="4.5"
            height="100"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g>
          <rect x="152" y="92" width="24" height="80" rx="4.5" fill="url(#fb-g1)" />
          <rect
            x="153.6"
            y="92"
            width="20.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="171.5"
            y="98"
            width="4.5"
            height="70"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <g transform="rotate(9 190.5 172)">
          <rect x="178" y="104" width="25" height="68" rx="4.5" fill="url(#fb-g2)" />
          <rect
            x="179.6"
            y="104"
            width="21.8"
            height="5.5"
            rx="2.5"
            fill="#F4ECD6"
            fill-opacity="0.92"
          />
          <rect
            x="198.5"
            y="110"
            width="4.5"
            height="58"
            rx="2"
            fill="#06181F"
            fill-opacity="0.14"
          />
        </g>
        <path d="M132 53 H145 V96 L138.5 91 L132 96 Z" fill="#F8CE63" />
        <line
          x1="138.5"
          y1="53"
          x2="138.5"
          y2="91"
          stroke="#0C8C81"
          stroke-opacity="0.25"
          stroke-width="1.2"
        />
      </svg>
      <h1 id="heading">Δεν είναι δυνατή η σύνδεση με το Libriant</h1>
      <p id="body">
        Η εφαρμογή δεν μπόρεσε να φορτώσει τον διακομιστή της βιβλιοθήκης. Ελέγξτε τη σύνδεσή σας ή
        ορίστε παρακάτω τη σωστή διεύθυνση.
      </p>
      <p class="err" id="err" hidden></p>

      <label for="url" id="urlLabel">Διεύθυνση διακομιστή βιβλιοθήκης</label>
      <input
        id="url"
        type="url"
        inputmode="url"
        spellcheck="false"
        placeholder="https://library.example.org"
      />
      <div class="row">
        <button class="primary" id="connect">Σύνδεση</button>
        <button class="ghost" id="retry">Δοκιμάστε ξανά</button>
        <button class="ghost" id="browser">Άνοιγμα σε πρόγραμμα περιήγησης</button>
      </div>
      <p class="muted" id="status"></p>
    </main>

    <script>
      (function () {
        var STRINGS = {
          el: {
            title: 'Libriant — σύνδεση',
            heading: 'Δεν είναι δυνατή η σύνδεση με το Libriant',
            body: 'Η εφαρμογή δεν μπόρεσε να φορτώσει τον διακομιστή της βιβλιοθήκης. Ελέγξτε τη σύνδεσή σας ή ορίστε παρακάτω τη σωστή διεύθυνση.',
            crashedHeading: 'Το Libriant έκλεισε επανειλημμένα',
            crashedBody:
              'Η εφαρμογή έκλεισε αναπάντεχα αρκετές φορές στη σειρά, οπότε σταματήσαμε να την επαναφορτώνουμε αυτόματα. Δοκιμάστε ξανά.',
            errNotFound:
              'Η διεύθυνση του διακομιστή δεν βρέθηκε. Ελέγξτε ότι είναι γραμμένη σωστά παρακάτω.',
            errOffline:
              'Αυτός ο υπολογιστής φαίνεται εκτός σύνδεσης. Ελέγξτε το δίκτυο και δοκιμάστε ξανά.',
            errNoAnswer:
              'Ο διακομιστής της βιβλιοθήκης δεν απάντησε. Μπορεί να είναι προσωρινά εκτός λειτουργίας — δοκιμάστε ξανά σε λίγο.',
            errCert:
              'Το πιστοποιητικό ασφαλείας του διακομιστή δεν έγινε αποδεκτό. Επικοινωνήστε με όποιον διαχειρίζεται τον διακομιστή σας.',
            errLabel: 'Τεχνική λεπτομέρεια',
            urlLabel: 'Διεύθυνση διακομιστή βιβλιοθήκης',
            connect: 'Σύνδεση',
            retry: 'Δοκιμάστε ξανά',
            openInBrowser: 'Άνοιγμα σε πρόγραμμα περιήγησης',
            bridgeUnavailable: 'Η γέφυρα της εφαρμογής υπολογιστή δεν είναι διαθέσιμη.',
            enterUrl: 'Εισαγάγετε τη διεύθυνση του διακομιστή.',
            connecting: 'Γίνεται σύνδεση…',
            retrying: 'Νέα προσπάθεια…',
            applyFailed: 'Δεν εφαρμόστηκε',
            reasonInvalidUrl: 'μη έγκυρη διεύθυνση',
            reasonUnknown: 'άγνωστο σφάλμα',
            wentWrong: 'Κάτι πήγε στραβά.',
          },
          en: {
            title: 'Libriant — connection',
            heading: "Can't reach Libriant",
            body: "The app couldn't load the library server. Check your connection, or set the right address below.",
            crashedHeading: 'Libriant closed repeatedly',
            crashedBody:
              'The app closed unexpectedly several times in a row, so we stopped reloading it automatically. Try again.',
            errNotFound:
              "The server address couldn't be found. Check that it's spelled correctly below.",
            errOffline: 'This computer appears to be offline. Check the network and try again.',
            errNoAnswer:
              "The library server didn't answer. It may be temporarily down — try again shortly.",
            errCert:
              "The server's security certificate wasn't accepted. Contact whoever manages your server.",
            errLabel: 'Technical detail',
            urlLabel: 'Library server URL',
            connect: 'Connect',
            retry: 'Try again',
            openInBrowser: 'Open in browser',
            bridgeUnavailable: 'Desktop bridge unavailable.',
            enterUrl: 'Enter a server URL.',
            connecting: 'Connecting…',
            retrying: 'Retrying…',
            applyFailed: "Couldn't apply",
            reasonInvalidUrl: 'invalid address',
            reasonUnknown: 'unknown error',
            wentWrong: 'Something went wrong.',
          },
        };

        var d = window.libriantDesktop;
        var params = new URLSearchParams(location.search);
        var failedUrl = params.get('url') || '';
        var errText = params.get('error') || '';
        // Allowlist rather than an index lookup — anything else (including an
        // Object.prototype key) must land on Greek, not on a blank page.
        var lang = params.get('lang') === 'en' ? 'en' : 'el';
        var s = STRINGS[lang];
        var errEl = document.getElementById('err');
        var urlEl = document.getElementById('url');
        var statusEl = document.getElementById('status');

        function setText(id, text) {
          document.getElementById(id).textContent = text;
        }

        /** Chromium hands us a raw code (ERR_NAME_NOT_RESOLVED); say what it
         *  means to a librarian, and keep the code as a support detail. */
        function explain(code) {
          if (code.indexOf('ERR_CERT') === 0 || code.indexOf('ERR_SSL') === 0) return s.errCert;
          if (code === 'ERR_NAME_NOT_RESOLVED' || code === 'ERR_NAME_RESOLUTION_FAILED')
            return s.errNotFound;
          if (code === 'ERR_INTERNET_DISCONNECTED' || code === 'ERR_NETWORK_CHANGED')
            return s.errOffline;
          if (
            code.indexOf('ERR_CONNECTION') === 0 ||
            code === 'ERR_ADDRESS_UNREACHABLE' ||
            code === 'ERR_TIMED_OUT'
          )
            return s.errNoAnswer;
          return null;
        }

        function reasonText(code) {
          if (code === 'invalid-url') return s.reasonInvalidUrl;
          return code || s.reasonUnknown;
        }

        var crashed = params.get('reason') === 'crashed';
        document.documentElement.lang = lang;
        document.title = s.title;
        setText('heading', crashed ? s.crashedHeading : s.heading);
        setText('body', crashed ? s.crashedBody : (errText && explain(errText)) || s.body);
        setText('urlLabel', s.urlLabel);
        setText('connect', s.connect);
        setText('retry', s.retry);
        setText('browser', s.openInBrowser);

        if (errText) {
          errEl.textContent = s.errLabel + ': ' + (failedUrl ? failedUrl + ' — ' : '') + errText;
          errEl.hidden = false;
        }
        urlEl.value = failedUrl;

        if (!d) {
          statusEl.textContent = s.bridgeUnavailable;
          return;
        }
        // Prefer the authoritative configured URL for the input.
        d.getInfo()
          .then(function (info) {
            if (info && info.serverUrl) urlEl.value = info.serverUrl;
          })
          .catch(function () {});

        function ack(p, okMsg) {
          statusEl.textContent = '';
          return p
            .then(function (r) {
              if (r && r.ok === false)
                statusEl.textContent = s.applyFailed + ': ' + reasonText(r.reason);
              else if (okMsg) statusEl.textContent = okMsg;
            })
            .catch(function () {
              statusEl.textContent = s.wentWrong;
            });
        }

        document.getElementById('connect').addEventListener('click', function () {
          var v = urlEl.value.trim();
          if (!v) {
            statusEl.textContent = s.enterUrl;
            return;
          }
          ack(d.setServerUrl(v), s.connecting);
        });
        document.getElementById('retry').addEventListener('click', function () {
          ack(d.retry(), s.retrying);
        });
        document.getElementById('browser').addEventListener('click', function () {
          if (failedUrl) d.openExternal(failedUrl);
        });
      })();
    </script>
  </body>
</html>
