<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Libriant — connection</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; min-height: 100vh;
        padding: 2rem; box-sizing: border-box; background: #f6f8fa; color: #0d1117;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      main { width: 100%; max-width: 26rem; text-align: center; }
      .logo { width: 56px; height: 56px; margin: 0 auto 1.25rem; display: block; }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: #57606a; line-height: 1.5; }
      .err { font-size: 0.8125rem; color: #8a6d00; background: #fff8e6; border: 1px solid #f0e0a0;
             border-radius: 8px; padding: 0.5rem 0.75rem; word-break: break-all; margin: 0 0 1.25rem; }
      label { display: block; text-align: left; font-size: 0.8125rem; color: #57606a; margin: 0 0 0.25rem; }
      input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.625rem; border: 1px solid #d0d7de;
              border-radius: 8px; font-size: 0.9375rem; margin: 0 0 0.75rem; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      button { appearance: none; border: 0; border-radius: 8px; padding: 0.625rem 1rem; font-weight: 600;
               font-size: 0.9375rem; cursor: pointer; }
      .primary { background: #1f6feb; color: #fff; }
      .primary:hover { background: #1858c9; }
      .ghost { background: transparent; color: #1f6feb; border: 1px solid #d0d7de; }
      .muted { font-size: 0.75rem; color: #6e7781; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Libriant" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="12" fill="#1f6feb" />
        <path d="M16 20 L48 20 M16 32 L48 32 M16 44 L40 44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      </svg>
      <h1>Can't reach Libriant</h1>
      <p>The app couldn't load the library server. Check your connection, or point it at the right address.</p>
      <p class="err" id="err" hidden></p>

      <label for="url">Library server URL</label>
      <input id="url" type="url" inputmode="url" spellcheck="false" placeholder="https://library.example.org" />
      <div class="row">
        <button class="primary" id="connect">Connect</button>
        <button class="ghost" id="retry">Retry</button>
        <button class="ghost" id="browser">Open in browser</button>
      </div>
      <p class="muted" id="status"></p>
    </main>

    <script>
      (function () {
        var d = window.libriantDesktop;
        var params = new URLSearchParams(location.search);
        var failedUrl = params.get('url') || '';
        var errText = params.get('error') || '';
        var errEl = document.getElementById('err');
        var urlEl = document.getElementById('url');
        var statusEl = document.getElementById('status');
        if (errText) { errEl.textContent = (failedUrl ? failedUrl + ' — ' : '') + errText; errEl.hidden = false; }
        urlEl.value = failedUrl;

        if (!d) {
          statusEl.textContent = 'Desktop bridge unavailable.';
          return;
        }
        // Prefer the authoritative configured URL for the input.
        d.getInfo().then(function (info) { if (info && info.serverUrl) urlEl.value = info.serverUrl; }).catch(function () {});

        function ack(p, okMsg) {
          statusEl.textContent = '';
          return p.then(function (r) {
            if (r && r.ok === false) statusEl.textContent = 'Could not apply: ' + (r.reason || 'unknown');
            else if (okMsg) statusEl.textContent = okMsg;
          }).catch(function () { statusEl.textContent = 'Something went wrong.'; });
        }

        document.getElementById('connect').addEventListener('click', function () {
          var v = urlEl.value.trim();
          if (!v) { statusEl.textContent = 'Enter a server URL.'; return; }
          ack(d.setServerUrl(v), 'Connecting…');
        });
        document.getElementById('retry').addEventListener('click', function () { ack(d.retry(), 'Retrying…'); });
        document.getElementById('browser').addEventListener('click', function () {
          if (failedUrl) d.openExternal(failedUrl);
        });
      })();
    </script>
  </body>
</html>
