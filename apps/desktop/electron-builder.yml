# Packaging config for the Libriant desktop shell. `pnpm package` (after
# `pnpm build`) produces installers in `release/`.
#
# This file stays signing-agnostic so a plain local `pnpm package` produces an
# unsigned build. The CI release workflow (.github/workflows/desktop-release.yml)
# supplies the signing inputs at run time:
#   macOS sign:      MAC_CSC_LINK (Developer ID .p12, base64) + MAC_CSC_KEY_PASSWORD
#   macOS notarize:  App Store Connect API key (APPLE_API_KEY_P8 + _ID + _ISSUER),
#                    enabled there via `--config.mac.notarize=true`
#   Windows sign:    Azure Trusted Signing — `win.azureSignOptions` passed via
#                    `--config` + AZURE_* service-principal env (no .pfx/HSM needed)
# Step-by-step procurement + setup: apps/desktop/SIGNING.md.
# The app icon is build/icon.png (1024px); electron-builder derives .icns/.ico.
appId: com.cybersystema.libriant
productName: Libriant
copyright: © CyberSystema

# Update feed: electron-updater reads release metadata (latest.yml + installers)
# from GitHub Releases, and `electron-builder --publish` uploads them there.
# Adjust owner/repo if the desktop releases live elsewhere.
publish:
  provider: github
  owner: CyberSystema
  repo: libriant

directories:
  output: release
  buildResources: build

# Compiled main/preload + the bundled static fallback page + manifest.
files:
  - dist/**/*
  - static/**/*
  - package.json

mac:
  category: public.app-category.productivity
  # Hardened runtime + entitlements are required for notarization; the camera
  # entitlement keeps the barcode scanner working under it.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS shows these when the app first asks for the camera/mic (the scanner).
  extendInfo:
    NSCameraUsageDescription: 'Libriant uses the camera to scan book and membership barcodes.'
    NSMicrophoneUsageDescription: 'Libriant only needs the camera; microphone access is not used.'
  # Off by default so an unsigned local `pnpm package` doesn't try to reach
  # Apple; the release workflow turns it on with `--config.mac.notarize=true`
  # once the App Store Connect API-key secrets are present.
  notarize: false
  target:
    - dmg
    - zip

win:
  # Signed via Azure Trusted Signing — the release workflow passes
  # `win.azureSignOptions` (publisherName/endpoint/account/profile) with
  # `--config` + AZURE_* env. No config here, so a local build is unsigned
  # (SmartScreen warns). See SIGNING.md.
  target:
    - nsis

linux:
  category: Office
  target:
    - AppImage
    - deb
